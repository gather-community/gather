---
# Flags hard-coded user-facing strings in views (see "User-Facing Strings" in CLAUDE.md).
# Every view is linted. Exceptions: mail that only goes to Gather staff (CLAUDE.md exempts it), the
# uptime-check text, and GDrive, whose strings haven't been moved yet.
# spec/lint/hard_coded_strings_spec.rb runs this in CI.
EnableDefaultLinters: false
glob: "app/views/**/*.erb"
exclude:
  - "app/views/gdrive/**/*"
  - "app/views/admin_mailer/*"
  - "app/views/system_mailer/*"
  - "app/views/test_mailer/*"
  - "app/views/exception_notifier/*"
  - "app/views/communities/signup_mailer/notify_approvers.text.erb"
  - "app/views/communities/signup_mailer/approval_created.text.erb"
  - "app/views/communities/signup_mailer/approval_failed.text.erb"
  - "app/views/landing/ping.text.erb"
linters:
  # Literal text between tags, ignoring text with no letters (.erb_linters/hard_coded_text.rb).
  # Contents of <script> tags are skipped.
  HardCodedText:
    enabled: true
  # Literal aria-label, alt, title and placeholder values, and submit button values
  # (.erb_linters/hard_coded_attribute.rb).
  HardCodedAttribute:
    enabled: true
  # String literals inside ERB tags, e.g. link_to("Privacy Policy", ...) or alt: "Home".
  Rubocop:
    enabled: true
    only:
      - Gather/HardCodedString
    rubocop_config:
      require:
        - ./lib/rubocop/cop/gather/hard_coded_string.rb
