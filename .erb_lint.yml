---
# Flags hard-coded user-facing strings in views (see "User-Facing Strings" in CLAUDE.md).
# Only views whose strings have been moved to locale files are linted: add their directories to `glob` as
# modules are converted. spec/lint/hard_coded_strings_spec.rb runs this in CI.
EnableDefaultLinters: false
glob: "app/views/{layouts,shared,home}/**/*.erb"
linters:
  # Literal text between tags. Contents of <script> tags are skipped.
  HardCodedString:
    enabled: true
  # Literal aria-label, alt, title and placeholder values (.erb_linters/hard_coded_attribute.rb).
  HardCodedAttribute:
    enabled: true
  # String literals inside ERB tags, e.g. link_to("Privacy Policy", ...) or alt: "Home".
  Rubocop:
    enabled: true
    only:
      - Gather/HardCodedString
    rubocop_config:
      require:
        - ./lib/rubocop/cop/gather/hard_coded_string.rb
