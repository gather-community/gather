# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # Bundle routine minor/patch bumps into one PR per run. Major bumps
      # stay as individual PRs so breaking changes get reviewed on their own.
      bundler:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The Elasticsearch gems must track our ES 7 server, so they only move as part of a
      # deliberate ES upgrade. Ignore rules also apply to security updates, so patch
      # releases stay unignored to let security fixes within the 7.x line through.
      # Alerts still appear in the Security tab regardless.
      - dependency-name: "elasticsearch*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
