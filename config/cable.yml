# Production Redis predates 6.0, which added the RESP3 protocol that redis-rb 6 uses by default.
development:
  adapter: redis
  protocol: 2
  url: redis://localhost:6379/1

test:
  adapter: test

production:
  adapter: redis
  protocol: 2
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: gather_production
