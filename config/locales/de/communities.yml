        intro: "Gather ist eine Plattform zur Verwaltung von Cohousing-Projekten und anderen gemeinschaftlichen Wohnformen. Um eine neue Gemeinschaft anzufragen, fülle das Formular unten aus. Wir prüfen deine Bewerbung und melden uns per E-Mail. Wir behalten uns vor, Gemeinschaften abzulehnen, die nicht zu unserem Auftrag passen." # MT
