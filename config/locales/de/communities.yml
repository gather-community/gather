        review_time_html: "Normalerweise prüfen wir Bewerbungen innerhalb von 48 Stunden. Achte auf eine Nachricht an %{email}." # MT
    # The approval email the signup review page pre-fills for the approver to personalize.
    signup_action:
      approval_template: |- # MT
        Hallo %{name},

        gute Nachrichten! Deine Bewerbung bei Gather für die Gemeinschaft „%{community}“ wurde angenommen.

        #######################################
        HIER EINE PERSÖNLICHE NOTIZ EINGEBEN,
        ETWAS KONKRETES ZUR GEMEINSCHAFT NENNEN
        #######################################

        Deine Gemeinschaft ist jetzt startklar!

        Du bekommst eine separate E-Mail mit einer Anleitung für deine erste Anmeldung.

        Willkommen an Bord!

        %{approver} für das Gather-Team
    signup_mailer:
      application_approved:
        subject: "Deine Gemeinschaft bei Gather wurde angenommen! (Mit einer Nachricht von %{approver})" # MT
      application_denied:
        subject: "Zu deiner Bewerbung bei Gather" # MT
        dear: "Hallo %{name}," # MT
        body: "Danke für dein Interesse an Gather. Wir haben deine Bewerbung für „%{community}“ geprüft und können deiner Anfrage derzeit leider nicht nachkommen." # MT
        sign_off: "Viele Grüße" # MT
        team: "Das Gather-Team" # MT
    inactivity_mailer:
      warning:
        subject: "Warnung wegen Inaktivität für %{community}" # MT
        subject_final: "[Letzte Warnung vor der Löschung] %{community}" # MT
        intro: "Dies ist Inaktivitätswarnung %{count} von %{max} für die Gather-Gemeinschaft „%{community}“." # MT
        last_login: "Letzte Anmeldung: %{date}" # MT
        never: "Nie" # MT
        final: "Seit über 90 Tagen hat sich niemand aus deiner Gemeinschaft bei Gather angemeldet. Dies ist die letzte Warnung, bevor die Daten deiner Gemeinschaft endgültig gelöscht werden." # MT
        final_days: "Deine Gemeinschaft wird in etwa 7 Tagen gelöscht, wenn sich niemand anmeldet." # MT
        not_final: "Seit über 90 Tagen hat sich niemand aus deiner Gemeinschaft bei Gather angemeldet. Wenn sich niemand anmeldet, kommt in 7 Tagen eine weitere Warnung. Nach 3 Warnungen werden die Daten deiner Gemeinschaft endgültig gelöscht." # MT
        prevent: "Um die Löschung zu verhindern, melde dich einfach bei deiner Gemeinschaft an:" # MT
