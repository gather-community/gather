              default_prep_time: "Standard-Vorbereitungszeit für Mahlzeiten in Minuten" # MT
          billing:
            contact: "E-Mail für Fragen zur Abrechnung. Wird mit der Zahlungsanleitung angezeigt." # MT
            payment_instructions: "Wie man eine Zahlung für ein Konto schickt." # MT
            statement_terms: "Anzahl der Tage nach dem Erstellungsdatum, bis ein Kontoauszug fällig ist. Bei null (0) haben Kontoauszüge kein Fälligkeitsdatum." # MT
            statement_reminder_lead_time: "Wie viele Tage vor dem Fälligkeitsdatum die Zahlungserinnerung für den Kontoauszug verschickt wird. Erinnerungen gehen nicht raus, wenn Kontoauszüge kein Fälligkeitsdatum haben oder der Saldo bezahlt ist." # MT
            paypal_reimbursement: "Der Küchenleitung erlauben, die Rückerstattung für Mahlzeiten per PayPal anzufordern. PayPal-Zahlungen müssen manuell gemacht werden (nicht automatisch)." # MT
            payment_methods:
              _self: "Anleitungen oder Informationen zu den verschiedenen Zahlungsmethoden. Leer lassen, wenn eine Methode nicht akzeptiert wird. Auf deiner <a href='/accounts/mine'>Kontenseite</a> siehst du, wie die Anleitung aussieht." # MT
              paypal_me: "Gib deinen <a href='https://paypal.me'>PayPal.me-Link</a> ein. So können Mitglieder am einfachsten mit PayPal bezahlen. Mit einem geschäftlichen PayPal-Konto lässt sich bei dieser Methode keine Gebühr vermeiden." # MT
              paypal_email: "Wenn du PayPal akzeptieren, aber nicht PayPal.me verwenden willst, gib die E-Mail-Adresse ein, an die Mitglieder Zahlungen schicken sollen." # MT
              paypal_friend: "Gilt für PayPal.me und PayPal per E-Mail. Wähle diese Option, wenn sich die Zahlungen nach den Nutzungsbedingungen von PayPal als Zahlungen unter Freunden rechtfertigen lassen. So fallen keine Gebühren an." # MT
              check_payee: "Gib ein, an wen Schecks ausgestellt werden sollen. Leer lassen, wenn keine Schecks akzeptiert werden." # MT
              check_address: "Gib eine Adresse ein, wenn du Schecks per Post akzeptierst. Dann wird auch eine Anleitung für Online-Überweisungen angezeigt." # MT
              check_dropoff: "Gib eine Anleitung zur persönlichen Abgabe von Schecks ein. Leer lassen, wenn Schecks per Post geschickt werden müssen oder nicht akzeptiert werden." # MT
              cash_dropoff: "Gib eine Anleitung zur persönlichen Abgabe von Bargeld ein. Leer lassen, wenn kein Bargeld akzeptiert wird." # MT
              additional_info: "Gib weitere Informationen ein, die bei der Zahlungsanleitung stehen sollen." # MT
              show_billing_contact: "Ob die E-Mail für die Abrechnung oben (falls angegeben) unten in der Zahlungsanleitung angezeigt wird. Deaktiviere es und trag sie selbst bei „Weitere Informationen“ ein, wenn du sie anders darstellen willst." # MT
