    hints:
      community:
        settings:
          main_nav_customizations: "Hier bearbeitest du die Links im Hauptmenü. Gib Links im Markdown-Format ein. Beispiel: [Linkname](https://example.com). Wenn der Linkname einem vorhandenen Link entspricht, ersetzt er dessen Standard-URL. Eine leere URL entfernt einen Link ganz. Aller andere Text und alle andere Formatierung werden ignoriert." # MT
          locale: "Die Sprache, mit der neue Mitglieder für E-Mails und Kalender-Feeds starten. Alle können ihre in ihrem Profil ändern. Die Website richtet sich nach der Spracheinstellung des Browsers oder nach der Sprache, die jemand unten auf der Seite wählt." # MT
