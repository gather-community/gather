          meals:
            reimb_instructions: "Was die Küchenleitung mit ihren Belegen tun soll, um die Kosten erstattet zu bekommen. Zum Beispiel die Beträge auf der Bearbeitungsseite der Mahlzeit in Gather eingeben, das eingebaute Rückerstattungsformular verwenden oder ein anderes Verfahren." # MT
            allergens: "Kommagetrennte Liste der Allergene, aus denen die Küchenleitung beim Eintragen des Menüs auswählt." # MT
            show_reimb_form: "Ob auf der Übersichtsseite der Mahlzeit ein druckbares Rückerstattungsformular angezeigt wird (mit Einkaufs- und Vorratsbeträgen und Art der Rückerstattung). Deaktiviere es, wenn ihr die Rückerstattung lieber elektronisch abwickelt." # MT
            cooks_can_finalize: "Ob die Küchenleitung Mahlzeiten abschließen darf, zusätzlich zu Abrechnung, Mahlzeitenkoordination und Admins." # MT
            cooks_can_change_invites: "Ob die Küchenleitung ändern darf, welche Gemeinschaften zu einer Mahlzeit eingeladen sind." # MT
            default_invites: "Welche Gemeinschaften standardmäßig zu einer Mahlzeit eingeladen sind." # MT
            allow_job_signup_on_meal_page: "Ob Essensgäste bei der Anmeldung zur Mahlzeit auch anbieten können, bei der Mahlzeit mitzuhelfen." # MT
            default_capacity: "Die Standardeinstellung, wie viele Personen eine Mahlzeit aufnehmen kann." # MT
            reminder_lead_times:
              _self: "Wie viele Tage im Voraus die verschiedenen Erinnerungen verschickt werden. Erinnerungen gehen um 6 Uhr Ortszeit raus. Bei „0“ wird die Erinnerung am Morgen des Tages der Mahlzeit verschickt. Weitere Einstellungen für Erinnerungen findest du auf der Seite der Mahlzeit-Rollen." # MT
              diner: "Die Erinnerung an alle Essensgäste." # MT
              early_menu: "Die Erinnerung an die Küchenleitung, das Menü einzutragen." # MT
              late_menu: "Eine zweite, dringendere Erinnerung an die Küchenleitung, wenn sie noch kein Menü eingetragen hat. Sollte weniger Tage im Voraus liegen als die frühe Menü-Erinnerung." # MT
          calendars:
