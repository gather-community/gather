    dictFileTooBig: "Die Datei ist zu groß ({{filesize}} MiB). Die maximale Größe beträgt {{maxFilesize}} MiB." # MT
    dictFileUnreadable: "Diese Datei konnte nicht gelesen werden. Versuche es noch einmal oder wähle eine andere." # MT
    dictFileSizeUnits:
      tb: "TiB" # MT
      gb: "GiB" # MT
      mb: "MiB" # MT
      kb: "KiB" # MT
      b: "B" # MT
