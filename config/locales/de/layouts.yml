        # tags in this example would render instead of being shown as typed.
        raw_markup: |- # MT
          Wenn du dich auskennst und reines HTML verwenden willst, probier es aus!

          Zum Beispiel <blockquote>möchtest du vielleicht Blockzitate verwenden</blockquote>.
