de:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Medienraum" # MT
        guidelines: |- # MT
          # Richtlinien für den Medienraum

          1. Kinder unter 13 Jahren dürfen nur unter Aufsicht einer erwachsenen Person hier sein.
          1. Filme und Sendungen ab FSK 16 sind am Fernseher und am Receiver gesperrt.
          1. Der Raum kann für besondere Anlässe oder Fernsehsendungen gebucht werden. Schau in den Kalender oder schreib an media@example.com.
          1. Die Fernbedienungen bleiben immer im Raum, an ihrem festen Platz.
          1. Bitte räum den Medienraum nach der Nutzung auf und bring ihn wieder in den „Grundzustand“. Achte auf Krümel.
      multipurpose_room:
        name: "Mehrzweckraum" # MT
        guidelines: |- # MT
          # Richtlinien für den Mehrzweckraum

          1. Wie in den Richtlinien für Veranstaltungen festgelegt, braucht jeder Gast eine erwachsene Person aus der Gemeinschaft als Gastgeber.
          1. Denk bitte daran, dass dieser Raum, wie alle Räume im Gemeinschaftshaus, von allen gemeinsam genutzt wird.
          1. Gastgebende schreiben den Namen ihres Gastes und die Aufenthaltsdaten auf das Whiteboard neben der Tür.
          1. Alle Gäste halten sich an die allgemeinen Richtlinien für das Gemeinschaftshaus (an der Tür ausgehängt) und an die Richtlinien jedes Raums, den sie nutzen. Bitte achte besonders auf die Regeln zu Lärm, Ruhezeiten und unserer Duftstofffrei-Regel.
          1. Keine Kerzen und nichts anderes, was einen Brand oder eine andere Gefahr verursachen könnte. Im Gemeinschaftshaus wird nicht geraucht.
          1. Der Raum wird auch anderweitig genutzt, aber Übernachtungsgäste haben Vorrang. Terminüberschneidungen klärt ihr bitte direkt miteinander.
          1. Gäste können bis zu 7 Tage bleiben, sofern niemand anderes den Raum schon für einen eigenen Gast gebucht hat.
          1. Gastgebende sind für ihre Gäste verantwortlich. Wenn die Gäste abgereist sind, putzen sie den Raum, waschen Bettwäsche und Laken und bringen sie zurück ins Gemeinschaftshaus.
          1. Auschecken bis 12 Uhr.
          1. Die Schlüssel werden an einem festen Platz im Gemeinschaftshaus hinterlegt. Gehen Schlüssel verloren, zahlen die Gastgebenden die neuen.
          1. Gäste können das bereitliegende „Bitte nicht stören“-Schild benutzen, um ungestört zu sein.
      office:
        name: "Büro" # MT
      sitting_room:
        name: "Aufenthaltsraum" # MT
      dining_room:
        name: "Speiseraum" # MT
        abbrv: "GH" # MT
      courtyard:
        name: "Innenhof" # MT
        abbrv: "Hof" # MT
      kitchen:
        name: "Küche" # MT
        abbrv: "GH" # MT
        guidelines: |- # MT
          # Richtlinien für die Küche

          ## Überblick

          Die Küche im Gemeinschaftshaus ist eine große Investition für unsere Gemeinschaft, und sie kann auch ein gefährlicher Ort sein. Weil uns die Sicherheit aller in unserer Gemeinschaft und unserer Geräte am wichtigsten ist, gelten die folgenden Richtlinien.

          Wir erwarten von allen Mitgliedern der Gemeinschaft und ihren Gästen, dass sie mit diesen Geräten und diesem Raum sorgfältig und respektvoll umgehen.

          Eltern sind dafür verantwortlich, ihren Kindern beizubringen:

          * Die Küche ist kein Spielplatz.
          * Das Essen in der Küche ist nicht für alle da, außer es ist so beschriftet.
          * Kinder dürfen nur in die Küche, wenn sie hereingebeten werden und eine verantwortliche erwachsene Person auf sie aufpasst.

          *Bitte hinterlass die Küche sauberer, als du sie vorgefunden hast.*

          Und lasst uns Spaß haben und zusammen leckeres Essen kochen und genießen!

          ## Sicherheit

          * Wenn du die Küche verlässt, während etwas im Ofen oder auf dem Herd ist, warne die anderen, indem du die Kücheneingänge absperrst und einen Zettel hinterlässt.
          * Stell Töpfe mit heißem Essen auf die hinteren Kochplatten, nicht auf die vorderen.
          * Lass das Natron beim Herd stehen. Es ist für den Fall eines Brandes da.
          * Lass scharfe Messer nie unbeaufsichtigt liegen und leg sie nicht ins Spülwasser.

          Wenn du gehen musst, bevor du mit dem Aufräumen fertig bist, hinterlass bitte einen Zettel mit deiner Telefonnummer und der Uhrzeit, wann du zurückkommst.

          Bitte trag alles ein, was du ausleihst, und bring es so bald wie möglich zurück.

          Bitte melde alles Ungewöhnliche, etwa seltsame Geräusche, Gerüche oder kaputte Dinge, der Person, die sich um Reparaturen kümmert.

          Der Kühlschrank im Gemeinschaftshaus ist für Grundvorräte und Gemeinschaftsessen da. Bitte verteil Reste lieber, statt sie hier aufzubewahren.

          Die Aufgaben von Küchenleitung, Küchenhilfe und Aufräumdienst sind gesondert beschrieben.

          ## Grundregeln der Hygiene

          1. Wenn du vielleicht krank bist, halte die Gemeinschaft gesund und bleib zu Hause.
          1. Wasch dir oft die Hände, ganz klassisch: mit Seife und heißem Wasser.
          1. Deck alle Schnittwunden vollständig ab.
          1. Benutz beim Abschmecken jeden Löffel nur einmal.
          1. Vermeide Kreuzkontamination (Allergene und Bakterien), indem du für verschiedene Lebensmittel verschiedene Utensilien benutzt.
          1. Alles, was mit rohem Fleisch in Berührung kommt, muss gespült und desinfiziert werden, bevor es für etwas anderes benutzt wird.
          1. Nimm für jede Art von Lebensmittel das Schneidebrett in der passenden Farbe.
          1. In Spülbecken können sich Bakterien sammeln, also wasch Obst und Gemüse, das roh serviert wird, in einem Sieb.
          1. Lebensmittel bleiben sicher, wenn sie gut gekühlt oder gut durcherhitzt sind.

          ## Grundvorräte

          Grundvorräte werden für die Mahlzeiten im Gemeinschaftshaus gekauft.

          Beim Einkauf achten wir darauf, ob sie bio, fair gehandelt und gentechnikfrei sind, und berücksichtigen außerdem Ernährungsgewohnheiten, Haltbarkeit und Kosten.

          Die Grundvorräte werden über einen Aufschlag auf die Mahlzeiten im Gemeinschaftshaus bezahlt, von dem neuer Vorrat gekauft wird. Von der Küchenleitung wird erwartet, dass sie die Grundvorräte verwendet. So bleibt der Vorrat frisch und die Kosten der Mahlzeit niedrig.

          Bitte nimm also keine Grundvorräte für den privaten Gebrauch. Wenn es wirklich sein muss:

          * Ersetze, was du verbrauchst, Stück für Stück.
          * Wenn das nicht geht, zahl bitte großzügig in die Kasse für die Grundvorräte ein.

          Wenn dir auffällt, dass etwas knapp wird, schreib es bitte auf das Klemmbrett, das dafür bereitliegt.

          Die Küchenkoordination schaut wöchentlich auf die Liste und in die Vorratskammer und kauft bei Bedarf ein. Wir tun unser Bestes, Grundvorräte zu ersetzen, sobald sie ausgehen.

          Wenn du für ein Gemeinschaftsessen einen Grundvorrat brauchst und er fehlt, kauf ihn bitte und reich den Kassenbon gesondert zur Rückerstattung ein.

          Die Essens-AG führt die Liste der Grundvorräte.

          Alles andere kauft die Küchenleitung, auch fertige Salatdressings.
    shared_guidelines:
      common_house:
        name: "Richtlinien für das Gemeinschaftshaus" # MT
        body: |- # MT
          # Richtlinien für das Gemeinschaftshaus

          * Willkommen in unserem Gemeinschaftshaus!
          * Unser Gemeinschaftshaus ist der Mittelpunkt unseres Gemeinschaftslebens.
          * Unsere Gemeinschaft lebt von den Beziehungen zueinander.
          * Alle Mitglieder der Gemeinschaft haben das gleiche Mitspracherecht, wie wir unser Gemeinschaftshaus nutzen.
          * Wir behandeln das Gemeinschaftshaus so respektvoll wie das Haus unserer Nachbarn. Bitte hinterlass es so, wie du es vorgefunden hast, oder noch besser!

          Diese Richtlinien bringen Freiheit, Verantwortung und Sicherheit für Menschen und Gebäude in Einklang.

          ## Barrierefreiheit

          Um auf Empfindlichkeiten Rücksicht zu nehmen, vereinbaren wir Folgendes:

          * *Duftstofffrei* ist unser Ziel im Gemeinschaftshaus.
          * *Rauchen:* Im Gemeinschaftshaus wird nicht geraucht.
          * *Tiere:* Im Gemeinschaftshaus sind keine Haustiere erlaubt, außer Assistenzhunden. Haustiere dürfen auf dem Gelände des Gemeinschaftshauses nicht unbeaufsichtigt bleiben.

          ## Sicherheit

          Das Gemeinschaftshaus wird unter der Woche bis 22 Uhr und freitags und samstags bis 23 Uhr abgeschlossen, nach der Checkliste zum Abschließen.

          ## Kommunikation

          Wer ein Anliegen hat, spricht es nach Möglichkeit direkt an. Bei Bedarf hilft die AG Gemeinschaftshaus weiter.

          ## Instandhaltung

          Melde defekte oder fehlerhafte Anlagen oder Geräte sofort der AG Instandhaltung unter maintenance@example.com.

          Für Routinesachen schreib eine E-Mail oder leg einen Zettel in die Instandhaltungsmappe.

          Melde kaputte Gegenstände der AG Gemeinschaftshaus unter commonhouse@example.com.

          ## Alkohol

          Lass keinen Alkohol, ob geöffnet oder verschlossen, und keine Medikamente im Gemeinschaftshaus liegen und bewahr sie dort nicht auf.

          ## Lärm

          Wen Lärm im Gemeinschaftshaus stört, darf gern bitten, leiser zu sein. Bitte nimm Rücksicht, wenn jemand dich darum bittet.

          Große Veranstaltungen, die lauter als sonst werden oder über die Schließzeit hinausgehen können, werden der Gemeinschaft vorher angekündigt.

          ## Ruhezeiten

          * Werktags von 22 bis 8 Uhr
          * Am Wochenende und an Feiertagen von 23 bis 9 Uhr

          ## Für wen das Gemeinschaftshaus da ist

          Das Gemeinschaftshaus ist für die Bewohnerinnen und Bewohner und ihre eingeladenen Gäste da.

          * Wir sind dankbar für die Unterstützung und Gastfreundschaft unserer Nachbargemeinschaften.
          * Wir heißen unsere Nachbarn willkommen und erwarten, dass wir Probleme fair lösen, auf der Grundlage von Gegenseitigkeit und Vertrauen.

          Mitglieder der Nachbargemeinschaften sind im Gemeinschaftshaus willkommen und buchen Räume auf dieselbe Weise. Alle anderen brauchen eine erwachsene Person aus der Gemeinschaft als Gastgeber, die für das Verhalten ihrer Gäste verantwortlich ist.

          ## Räume buchen

          Aktivitäten der Gemeinschaft kommen in den Kalender und haben Vorrang vor anderen Terminen.

          Alle Richtlinien werden im Konsens beschlossen. Wir freuen uns über alle Beiträge, während wir sie weiter verbessern.
