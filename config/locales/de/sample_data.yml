        side: "Petersilienkartoffeln, grüne Bohnen, Salat mit Senfvinaigrette" # MT
        dessert: "Erdbeeren mit Sahne" # MT
      meal_24:
        title: "Teigtaschensuppe" # MT
        entrees: "Teigtaschen in Hühnerbrühe (oder Gemüsebrühe)" # MT
        side: "Reis, Rettich-Kimchi und Toppings (Seetang in Streifen, gehackte Frühlingszwiebeln)" # MT
        kids: "Teigtaschen mögen die meisten Kinder" # MT
        dessert: "Obst und Brownies" # MT
        notes: "Die Teigtaschen sind mit Schweinefleisch gefüllt, außer du möchtest welche mit Rind oder Gemüse. In die Brühe kommt Ei." # MT
      meal_25:
        title: "Reisbowls zum Selbermachen" # MT
        entrees: "Hähnchen (oder gebackener Tofu), dazu Reis nach Wahl, knusprige Nudeln, Gemüse, Ananas, Kokosraspel, Mandelstifte, geriebener Käse und weitere Toppings" # MT
        kids: "Gemüsesticks, Obst" # MT
        dessert: "Keksschnitten" # MT
      meal_26:
        title: "Deftige deutsche Küche" # MT
        entrees: "Bratwurst, Spätzle und Kartoffelauflauf" # MT
        side: "Rotkohl, Sauerkraut, Meerrettich und Schmand" # MT
        kids: "Steht noch nicht fest" # MT
        dessert: "Apfelstrudel mit Eis" # MT
      meal_27:
        title: "Grillabend" # MT
        entrees: "Grill-Klassiker mit koreanischem Twist. Ich hoffe, meine Küchenhilfen haben ein paar gute Ideen." # MT
        side: "Leicht angebratenes Gemüse vom Wochenmarkt oder aus unseren Gärten" # MT
        kids: "Die Kinder werden vielleicht zur Gartenarbeit eingespannt" # MT
        dessert: "Frische Erdbeeren, wenn gerade Saison ist" # MT
        notes: "So bio und regional wie möglich. Jede Ernährungsweise lässt sich leicht berücksichtigen." # MT
      meal_28:
        title: "Selbstgemachte Pizza!" # MT
        entrees: "Pizza mit verschiedenen Belägen: Hähnchen, Gemüse, Käse, Salami. Normaler und glutenfreier Boden." # MT
        side: "Salat und Obst" # MT
        kids: "Das mögen Kinder" # MT
        dessert: "Vielleicht ..." # MT
        notes: "Bitte gib unten an, wenn du glutenfrei brauchst, damit ich planen kann. Danke! Zutaten möglichst bio und regional." # MT
      meal_29:
        title: "Tomatenverkostung" # MT
        entrees: "Eine Auswahl regionaler Tomaten, mit Geflügel und vegetarischen Varianten" # MT
        side: "Caprese-Salat, viel Gemüse, Maiskolben" # MT
        kids: "Mais vom Kolben geschnitten für Kinder mit Zahnspange" # MT
        dessert: "Tomateneis?" # MT
        notes: "Möglichst regional und bio. Das Essen kann allergenfrei zubereitet werden (aber nicht tomatenfrei). Es gibt Schalenfrüchte (Mandeln und Haselnüsse)." # MT
      meal_30:
        title: "Chili und Apfeldessert-Mitbringbuffet!" # MT
        entrees: "Chili, wie ich es von zu Hause kenne: milde Bohnen und Gemüse auf Reis. Rinderhack für alle, die Fleisch essen." # MT
        side: "Gekochtes Gemüse, je nachdem, was es gerade aus der Region gibt" # MT
        kids: "Das Hauptgericht ist mild genug für alle" # MT
        dessert: "Unser jährliches Apfeldessert-Mitbringbuffet! Komm am Wochenende davor mit zum Äpfelpflücken und bring dann mit, was du aus diesen herrlichen Äpfeln zauberst." # MT
        notes: "Milchprodukte gibt es extra, im Hauptgericht sind keine. Die Desserts machen verschiedene Leute, sie können also alle gängigen Allergene enthalten." # MT
      meal_31:
        title: "Süße und herzhafte Crêpes" # MT
        entrees: "Crêpes mit vielen Füllungen, herzhaft zum Abendessen und süß zum Nachtisch" # MT
        side: "Gedünstetes Gemüse" # MT
        dessert: "Noch mehr Crêpes!" # MT
        notes: "Freilandeier, Milch aus der Region, Bio-Mehl. Wenn du glutenfreie Crêpes möchtest, sag Bescheid, dann probiere ich es." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Reis, gewürztes Gemüse, Rindfleisch und Ei oder Räucherlachs, in Seetang gerollt" # MT
        side: "Wasserkimchi mit Rettich" # MT
        kids: "Das Hauptgericht sollte für sie passen" # MT
        dessert: "Obst oder Eis" # MT
        notes: "Das Wasserkimchi mit Rettich haben wir vor zwei Wochen angesetzt. Nach dem Essen gibt es Gläser zum Mitnehmen." # MT
      meal_33:
        title: "Curry-Erbsensuppe und Sandwiches" # MT
        entrees: "Curry-Erbsensuppe mit Hühnerbrühe, Schinken und Milch, dazu eine vegane Variante mit Gemüsebrühe und Kokosmilch" # MT
        side: "Sandwiches mit Thunfisch- und Eiersalat, oder bring deinen eigenen Belag fürs Brot mit" # MT
        kids: "Dasselbe. Bitte schreib mir vor Donnerstag eine E-Mail, wenn deine Kinder Suppe ohne Curry möchten." # MT
        dessert: "Selbstgebackene Schokocookies und Obst" # MT
        notes: "Die Suppe ist glutenfrei, die vegane Variante außerdem ohne Milch. Wenn du glutenfreies Brot oder andere Änderungen möchtest, schreib mir bitte vor Donnerstag eine E-Mail." # MT
      meal_34:
        title: "Crêpes und leckere Sachen zum Füllen" # MT
        entrees: "Crêpes (Ei, Mehl, Milch). Eigentlich eher wie schwedische Pfannkuchen: dünn und biegsam." # MT
        side: "Süße und herzhafte Füllungen: Zucker, selbstgemachte Erdbeer- und Blaubeermarmelade, Salzkaramellsoße, Schlagsahne, Käse und wahrscheinlich gebratene Pilze. Bring gern selbst etwas mit, wenn du etwas Bestimmtes möchtest." # MT
        kids: "Dasselbe" # MT
        dessert: "Dasselbe" # MT
        notes: "Wahrscheinlich nicht alles bio, aber ich tue mein Bestes im Rahmen des Budgets." # MT
      meal_35:
        title: "Hackbraten-Abend" # MT
        entrees: "Hackbraten" # MT
        side: "Salat, Brötchen, Kartoffeln" # MT
        dessert: "Apfel-Crumble" # MT
      meal_36:
        title: "Bibimbap" # MT
        entrees: "Gedämpfter Reis mit gewürztem Gemüse und Rindfleisch (oder Tofu) obendrauf, dazu scharfe Chilisoße (und Sojasoße, falls du es nicht scharf magst) und Spiegeleier" # MT
        side: "Eingelegtes Gemüse und Kimchi" # MT
        kids: "Sie können mehr Rindfleisch oder Tofu als Gemüse bekommen" # MT
        dessert: "Obst" # MT
        notes: "Alles ist mit glutenfreier Sojasoße, Knoblauch, Sesamöl und schwarzem Pfeffer gewürzt. Das Essen besteht hauptsächlich aus Gemüse, also erwarte nicht viel Fleisch." # MT
      meal_37:
        title: "Puten-Tacos" # MT
        entrees: "Tacos mit Putenhack" # MT
        side: "Bohnenmus (Refried Beans), Reis" # MT
        notes: "Tomaten, Salat, milde Salsa und Schmand für die Tacos." # MT
      meal_38:
        title: "Frühstückspizza" # MT
        entrees: "Der beste Pizzaboden der Welt, aus nur wenigen Zutaten, hauptsächlich Maniok. Selbst die Wählerischsten lieben ihn. Mit einer Soße nach Pesto-Art und einer Auswahl an Fleisch, Gemüse und Käse. Bitte gib eventuelle Ernährungseinschränkungen an." # MT
        side: "Rührei" # MT
      meal_39:
        title: "Suppenbuffet!" # MT
        entrees: "Eine einfache Fleischsuppe und eine einfache Gemüsesuppe, dazu jede Menge Toppings für deine eigene Kreation: Kerne, Gemüse, glutenfreie Nudeln, Käse ..." # MT
        side: "Gemüse, Käse, Nudeln" # MT
        kids: "Kinder stellen sich gern ihre eigene Suppe zusammen" # MT
        dessert: "Vielleicht etwas mit Obst" # MT
        notes: "So regional und bio wie möglich." # MT
      meal_40:
        title: "Lachs im Pergament" # MT
        entrees: "Im Backpapier gegarter Lachs, gewürzt mit Zwiebeln und Kräutern" # MT
        side: "Blattgemüse (Spinat oder Grünkohl) oder grüne Bohnen, mit Knoblauch angebraten, dazu geröstete Frühkartoffeln und frisches Brot" # MT
        kids: "Bitte schreib in die Kommentare, wenn deine Kinder keinen Lachs essen, und schlag etwas anderes vor, zum Beispiel Thunfischsalat oder hart gekochte Eier." # MT
        dessert: "Ja: Obst und etwas Gebackenes" # MT
        notes: "Alles ist glutenfrei außer dem gebackenen Dessert. Das Gemüse ist größtenteils bio. Sag Bescheid, wenn du eine vegetarische Variante brauchst, dann brate oder backe ich etwas Tofu." # MT
