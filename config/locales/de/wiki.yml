          Das ist eine Beispielseite im Wiki.

          Klicke oben auf **Bearbeiten**, um zu sehen, wie diese Seite funktioniert! Keine Sorge, du kannst nichts kaputt machen!

          ## Formatierung

          Wiki-Seiten bearbeitest du mit **Markdown**, einer einfachen Art, saubere und ansprechende Inhalte zu erstellen, ohne eine spezielle Sprache lernen zu müssen. Mehr über Markdown erfährst du in der [Markdown-Formatierungshilfe](/about/markdown).

          ## Links

          Links auf andere Seiten sind sehr wichtig! Du kannst so auf andere **Wiki-Seiten** verlinken: [[Lustige Seite]].

          Der Link oben ist (wahrscheinlich) rot. Das liegt daran, dass die Seite noch nicht existiert. Wenn du auf den Link klickst, kannst du die Seite anlegen. Dann wird der Link blau!

          Wenn du als Linktext etwas anderes als den Seitentitel verwenden willst, kannst du [[Lustige Seite|das hier machen]].

          Links auf externe Seiten sehen [so aus](http://example.com).

          Eine URL als einfacher Text wird automatisch erkannt und in einen Link umgewandelt: https://gather.coop
