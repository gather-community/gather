en:
  admin:
    domains:
      refresh_all_started:
        one: >-
          Checking 1 domain in the background. This should take about %{seconds} seconds.
          Reload this page to see the results.
        other: >-
          Checking %{count} domains in the background. This should take about %{seconds} seconds.
          Reload this page to see the results.
      refresh_one_success: "Re-checked %{domain}."
      refresh_one_failed: >-
        Re-checked %{domain}, but the SMTP2GO API request failed, so validation status may be
        stale. The error has been reported.
      index:
        title: "Domains"
        intro: >-
          This page shows the status of each custom domain's mail setup: whether the MX and SPF
          records are correct, and whether SMTP2GO has validated the domain for sending. Results
          are from the most recent check; use the refresh buttons to re-check.
        none_found: "No custom domains found."
        summary:
          one: "%{ok} of 1 domain has all records correct."
          other: "%{ok} of %{count} domains have all records correct."
        never_checked_prompt: "No checks have run yet — use 'Refresh All' to run the first one."
        not_configured: >-
          The SMTP2GO API key is not configured, so sending status and validation can't be checked.
          Set smtp2go.api_key in the settings.
        headers:
          domain: "Domain"
          communities: "Communities"
          mx: "MX Records"
          spf: "SPF Record"
          smtp2go: "SMTP2GO Validation"
        correct: "Correct"
        incorrect: "Incorrect"
        never_checked: "Never checked"
        refresh_all: "Refresh All"
        refresh_row: "Re-check this domain"
        record_titles:
          verified: "%{host} → %{target} — verified by SMTP2GO"
          in_dns: "%{host} → %{target} — found in DNS, awaiting SMTP2GO verification"
          missing: "%{host} → %{target} — not found in DNS"
        smtp2go_statuses:
          verified: "Verified"
          pending: "Pending"
          not_added: "Not Added"
          unknown: "Unknown"
        record_kinds:
          dkim: "DKIM"
          return_path: "Return"
          tracking: "Tracking"
