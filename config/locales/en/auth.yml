# Additional translations at https://github.com/plataformatec/devise/wiki/I18n

en:
  devise:
    confirmations:
      confirmed: "Your email address has been successfully confirmed."
      send_instructions: "You will receive an email with instructions for how to confirm your email address in a few minutes."
      send_paranoid_instructions: "If your email address exists in our database, you will receive an email with instructions for how to confirm your email address in a few minutes."
    failure:
      already_authenticated: "You are already signed in."
      inactive: "Your account is not activated yet."
      invalid: "Invalid %{authentication_keys} or password."
      locked: "Your account is locked."
      last_attempt: "You have one more attempt before your account is locked."
      not_found_in_database: "Invalid %{authentication_keys} or password."
      timeout: "Your session expired. Please sign in again to continue."
      unauthenticated: "Please sign in to view that page."
      unconfirmed: "You must use an invitation when first signing in."
    authentication_keys:
      email: "email"
    mailer:
      confirmation_instructions:
        subject: "Please Confirm Your Email Address"
      reset_password_instructions:
        subject: "Resetting Your Password"
      unlock_instructions:
        subject: "Unlock Instructions"
    omniauth_callbacks:
      failure: "Could not sign you in from %{kind} because %{reason}."
      success: "Successfully authenticated from %{kind} account."
    passwords:
      new:
        title: "Forgot Password"
        instructions: "Enter your email address to have instructions sent to you via email. Follow the instructions in the email to reset your password. The email may take a few moments to arrive."
      edit:
        title: "Enter a New Password"
        instructions: "Enter a new password below and you will be signed in to Gather."
      no_token: "You can't access this page without coming from a password reset email. If you do come from a password reset email, please make sure you used the full URL provided."
      send_instructions: "You will receive an email with instructions on how to reset your password in a few minutes."
      send_paranoid_instructions: "If your email address exists in our database, you will receive a password recovery link at your email address in a few minutes."
      updated: "Your password has been changed successfully. You are now signed in."
      updated_not_active: "Your password has been changed successfully."
    registrations:
      destroyed: "Bye! Your account has been successfully cancelled. We hope to see you again soon."
      signed_up: "Welcome! You have signed up successfully."
      signed_up_but_inactive: "You have signed up successfully. However, we could not log you in because your account is not yet activated."
      signed_up_but_locked: "You have signed up successfully. However, we could not log you in because your account is locked."
      signed_up_but_unconfirmed: "A message with a confirmation link has been sent to your email address. Please follow the link to activate your account."
      update_needs_confirmation: "You updated your account successfully, but we need to verify your new email address. Please check your email and follow the confirm link to confirm your new email address."
      updated: "Your account has been updated successfully."
    sessions:
      new:
        title: "Sign In"
      signed_in: "Signed in successfully."
      signed_out: "Signed out successfully."
      already_signed_out: "Signed out successfully."
    unlocks:
      send_instructions: "You will receive an email with instructions for how to unlock your account in a few minutes."
      send_paranoid_instructions: "If your account exists, you will receive an email with instructions for how to unlock it in a few minutes."
      unlocked: "Your account has been unlocked successfully. Please sign in to continue."
    # Overrides of devise-i18n's wording ("Log in", "Forgot your password?") to keep ours.
    shared:
      links:
        sign_in: "Sign in"
        forgot_your_password: "Don't know your password?"
  auth_mailer:
    cant_reset_password:
      request_received: "We received a request to reset your password."
      no_full_access: "Unfortunately, your profile does not have full system access and so you are not permitted to sign in."
      contact_admin: "Please contact your Gather administrator if you feel this is in error."
    confirmation_instructions:
      use_link: "Please confirm your new email address using this link:"
      thanks: "Thanks for your cooperation with this important security measure!"
    reset_password_instructions:
      use_link: "We received a request to reset your password. To do so, please use this link:"
      ignore: "If you did not make this request, simply ignore this email and your password will remain unchanged."
    sign_in_invitation:
      subject: "Instructions for Signing in to Gather"
      invited: "You have been invited to sign in to Gather, %{community}'s community management system!"
      click_link: "Please click the link below to begin."
      choose_method: "From there you can choose to sign in with Google or a password. If you haven't set a password yet you will be able to."
      expiry:
        one: "This link will expire in %{count} day."
        other: "This link will expire in %{count} days."
      see_you: "Hope to see you soon!"
  errors:
    messages:
      already_confirmed: "was already confirmed, please try signing in"
      confirmation: "Didn't match password"
      confirmation_period_expired: "needs to be confirmed within %{period}, please request a new one"
      doesnt_match: "Doesn't match password"
      expired: "has expired, please request a new one"
      not_found: "Email not found"
      not_locked: "was not locked"
      not_saved:
        one: "1 error prohibited this %{calendar} from being saved:"
        other: "%{count} errors prohibited this %{calendar} from being saved:"
  password:
    strength:
      weak: "Too weak (Score: %{bits})"
      good: "Good (Score: %{bits})"
      excellent: "Excellent (Score: %{bits})"
    strength_info: "We use a smart password strength check to ensure your password is secure and can't easily be cracked.\n\nYou can make your password stronger by:\n\n  - making it longer\n  - avoiding words found in the dictionary\n  - using a mix of letters, numbers, and symbols"
