    # The approval email the signup review page pre-fills for the approver to personalize.
    signup_action:
      approval_template: |-
        Dear %{name},

        Great news! Your application to join Gather for the community "%{community}" has been approved.

        #######################################
        ENTER A PERSONALIZED NOTE HERE, MENTION
        SOMETHING SPECIFIC ABOUT THE COMMUNITY
        #######################################

        Your community is now ready to go!

        You should receive a separate email with instructions to sign in for the first time.

        Welcome aboard!

        %{approver} for the Gather Team
    signup_mailer:
      application_approved:
        subject: "Your Gather community has been approved! (With a note from %{approver})"
      application_denied:
        subject: "Regarding your Gather community application"
        dear: "Dear %{name},"
        body: "Thank you for your interest in Gather. After reviewing your application for \"%{community}\", we're unable to move forward with your request at this time."
        sign_off: "Best regards,"
        team: "The Gather Team"
    inactivity_mailer:
      warning:
        subject: "Inactivity warning for %{community}"
        subject_final: "[Final Deletion Warning] %{community}"
        intro: "This is inactivity warning %{count} of %{max} for the Gather community \"%{community}\"."
        last_login: "Last login: %{date}"
        never: "Never"
        final: "No one in your community has logged into Gather in over 90 days. This is the final warning before your community data is permanently deleted."
        final_days: "Your community will be deleted in approximately 7 days unless someone logs in."
        not_final: "No one in your community has logged into Gather in over 90 days. If no one logs in, another warning will be sent in 7 days. After 3 warnings, your community data will be permanently deleted."
        prevent: "To prevent deletion, simply log into your community at:"
        contact: "If you believe this warning is in error or need help, please contact us at support@gather.coop."
