        non_members_html: "<strong>Non-members</strong>: The Mailman 'non-member' feature can be used 1) to allow additional addresses to send email to the list without receiving from it and 2) to ban people from sending to the list. Non-members do not receive email from the list. Non-members are not sync'd from Gather, but can be added manually via the %{link}. See the %{docs_link} for more information."
        mailman_docs: "Mailman documentation"
        only_non_users: "Only addresses not associated with Gather users should be adjusted via the Mailman admin panel."
