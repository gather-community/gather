        settings_intro_html: "List settings can be adjusted via the %{link}. The following settings will be forcibly reset by Gather:"
        index_page_html: "<strong>Show list on index page</strong>: Lists will never be advertised since this is a private mailing list system only."
        max_size_html: "<strong>Maximum message size</strong>: Messages are limited to 5 MiB."
        subscription_policy_html: "<strong>Subscription policy</strong>: Moderators will have to authorize any new subscriptions manually. The primary route for subscribing should be via Gather. Subscriptions via the Mailman site or via email should be rare."
