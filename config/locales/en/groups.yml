        name_locked: "List name and domain can't be edited once the list is created. If you need to change them, delete and recreate the list or contact Gather staff."
        admin_panel: "Mailman admin panel"
        sync_intro: "List members are synchronized with Gather as follows:"
        members_html: "<strong>Members</strong>: All members of this group are automatically sync'd to the list. You can manually add additional members via the %{link}."
