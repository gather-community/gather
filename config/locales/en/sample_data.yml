        side: "Red cabbage, sauerkraut, horseradish and sour cream"
        kids: "To be decided"
        dessert: "Apple strudel with ice cream"
      meal_27:
        title: "Barbecue Night"
        entrees: "Grilled favorites with a Korean twist. I'm hoping my assistants have some good ideas."
        side: "Lightly sautéed veggies from the farmers market or our gardens"
        kids: "Kids might be put to work in the garden"
        dessert: "Fresh strawberries, if they're in season"
        notes: "As organic and local as possible. Easy to accommodate any diet."
      meal_28:
        title: "Homemade Pizza!"
        entrees: "Pizza with a variety of toppings: chicken, veggies, cheese, pepperoni. Regular and gluten-free crusts."
        side: "Salad and fruit"
        kids: "Kids like this stuff"
        dessert: "Maybe..."
        notes: "Please say below if you need gluten-free so I can plan. Thanks! Organic and local ingredients when possible."
      meal_29:
        title: "Tomato Tasting"
        entrees: "A sampling of local tomatoes, with poultry and vegetarian options"
        side: "Caprese salad, lots of veggies, corn on the cob"
        kids: "Corn off the cob for kids with braces"
        dessert: "Tomato ice cream?"
        notes: "Local and organic when possible. The meal can be made allergen-free (but not tomato-free). There will be tree nuts (almonds and hazelnuts)."
      meal_30:
        title: "Chili and Apple Dessert Potluck!"
        entrees: "Chili the way I knew it growing up: mild beans and veggies over rice. Ground beef for meat-eaters."
        side: "Cooked veggies, depending on what's local"
        kids: "The main dish is mild enough for everyone"
        dessert: "It's our yearly apple dessert potluck! Come apple picking with us the weekend before, then bring what you make with those gorgeous apples."
        notes: "Dairy is available on the side, but there's none in the main dish. The desserts are made by different people, so they may contain any of the common allergens."
      meal_31:
        title: "Sweet and Savory Crêpes"
        entrees: "Crêpes with lots of fillings, savory for dinner and sweet for dessert"
        side: "Steamed vegetables"
        dessert: "More crêpes!"
        notes: "Free-range eggs, local milk, organic flour. If you'd like gluten-free crêpes, let me know and I'll give it a try."
      meal_32:
        title: "Gimbap"
        entrees: "Rice, seasoned vegetables, beef, and egg or smoked salmon, rolled in seaweed"
        side: "Radish water kimchi"
        kids: "The main dish should work for them"
        dessert: "Fruit or ice cream"
        notes: "We started fermenting the radish water kimchi two weeks ago. There will be jars to take home after the meal."
      meal_33:
        title: "Curried Split Pea Soup and Sandwiches"
        entrees: "Curried split pea soup with chicken broth, ham and milk, and a vegan version with vegetable broth and coconut milk"
        side: "Tuna and egg salad sandwiches, or bring your own fillings for the bread"
        kids: "Same. Please email me before Thursday if your kids want soup without curry."
        dessert: "Homemade chocolate chip cookies, and fruit"
        notes: "The soup is gluten-free, and the veggie soup is dairy-free too. If you'd like gluten-free bread or other changes, please email me before Thursday."
      meal_34:
        title: "Crêpes and Yummy Things to Put in Them"
        entrees: "Crêpes (egg, flour, milk). Really more like Swedish pancakes: flat and flexible."
        side: "Sweet and savory fillings: sugar, homemade strawberry and blueberry jam, salted caramel sauce, whipped cream, cheese, and probably sautéed mushrooms. Bring your own if you want something in particular."
        kids: "Same"
        dessert: "Same"
        notes: "Probably not all organic, but I'll do my best within the budget."
      meal_35:
        title: "Meatloaf Dinner"
        entrees: "Meatloaf"
        side: "Salad, biscuits, potatoes"
        dessert: "Apple crisp"
      meal_36:
        title: "Bibimbap"
        entrees: "Steamed rice topped with seasoned vegetables and beef (or tofu), with hot pepper sauce (and soy sauce if you don't like it spicy), and fried eggs"
        side: "Pickles and kimchi"
        kids: "They can have more beef or tofu than vegetables"
        dessert: "Fruit"
        notes: "Everything is seasoned with gluten-free soy sauce, garlic, sesame oil and black pepper. This meal is mostly vegetables, so don't expect much meat."
      meal_37:
        title: "Turkey Tacos"
        entrees: "Tacos made with ground turkey"
        side: "Refried beans, rice"
        notes: "Tomatoes, lettuce, mild salsa and sour cream for the tacos."
      meal_38:
        title: "Breakfast Pizza"
        entrees: "The best pizza crust ever, made from just a few ingredients, mainly cassava. Even the pickiest eaters love it. With a pesto-style sauce and a choice of meats, veggies and cheeses. Please list any dietary restrictions."
        side: "Scrambled eggs"
      meal_39:
        title: "Soup Bar!"
        entrees: "A simple meat soup and a simple veggie soup, plus lots of toppings to make your own creation: seeds, veggies, gluten-free pasta, cheese..."
        side: "Veggies, cheese, pasta"
        kids: "Kids will enjoy making their own"
        dessert: "Maybe something fruity"
        notes: "As local and organic as possible."
      meal_40:
        title: "Salmon en Papillote"
        entrees: "Salmon baked in parchment, seasoned with onion and herbs"
        side: "Greens (spinach or kale) or green beans sautéed with garlic, roasted new potatoes, and fresh bread"
        kids: "Please comment if your kids won't eat salmon and suggest something else, like tuna salad or hard-boiled eggs."
        dessert: "Yes: fruit and something baked"
        notes: "Everything is gluten-free except the baked dessert. The veggies will be mostly organic. Let me know if you need a vegetarian option; I can stir-fry or bake some tofu."
