    # Sample meals' menus. Each written by a different cook, so the style varies.
    meals:
      meal_01:
        title: "Cranberry Chicken with Sweet Potatoes"
        entrees: "Cranberry chicken (free-range, from a local farm) with sweet potatoes"
        side: "Salad, fruit"
        kids: "The chicken is kid-friendly"
        dessert: "Brownies, ice cream"
        notes: "Baked tofu available on request. I can make some sweet potatoes and cranberries without chicken, and gluten-free brownies too. Gluten, dairy and eggs are only in the dessert."
      meal_02:
        title: "Baked Potato Bar"
        entrees: "Baked potatoes with a variety of toppings"
        dessert: "Bar cookies"
        notes: "Organic where possible. Allergens are easy to avoid."
      meal_03:
        title: "Latkes and Fixings"
        entrees: "Potato pancakes with or without onion or eggs (on request), and some with my favorite curry"
        side: "Veggies, salad, applesauce, sour cream, seeds"
        dessert: "Fruit and dark chocolate"
        notes: "All organic and GMO-free, and gluten-free. Allergens can be avoided on request, so please be clear about what you'd like (e.g. no onions or no eggs)."
      meal_04:
        title: "Soups of the Season"
        entrees: "Cheddar ale soup, pea soup, and open-faced grilled cheese sandwiches"
        side: "Simple salad: spinach, red peppers, avocado and sesame ginger dressing (other dressings too)"
        dessert: "Strawberry semifreddo with black sesame"
      meal_05:
        title: "Gluten-Free Chili, With Beef or Tofu"
        entrees: "Organic gluten-free chili for meat-eaters and for vegetarians, and an organic green salad with assorted veggies. Organic gluten-free cornbread made with dairy and eggs."
        kids: "Same"
        dessert: "Something organic and gluten-free, which may contain dairy and eggs"
      meal_06:
        title: "Birthday Dinner: Pesto and Pasta (or Rice)"
        entrees: "Pesto pasta or rice, with chicken and/or tofu"
        side: "Roasted root veggies and other things from the pantry"
        dessert: "Cupcakes and chocolate cashew drops (dairy-free and gluten-free)"
        notes: "Flexible and accommodating. Please put your dietary restrictions in the comments. Dinner will be simple so we can focus on dessert."
      meal_07:
        title: "Blueberry Pancakes and Spinach Frittatas"
        entrees: "Pancakes, regular or gluten-free, and individual spinach, basil and tomato frittatas"
        side: "Turkey sausage, fruit and yogurt"
        kids: "Gluten-free pancakes made with almond milk"
      meal_08:
        title: "Spinach Lasagna"
        entrees: "Spinach lasagna, and cheese lasagna for people who don't like spinach"
        side: "Steamed broccoli"
        kids: "Plain pasta with parmesan"
        dessert: "Chocolate chip cookies"
        notes: "Email me if you'd like it gluten-free or changed in some other way."
      meal_09:
        title: "Gluten-Free Potato Soup"
        entrees: "Organic potato soup made with dairy, with organic bacon to sprinkle on top for meat-eaters"
        side: "Organic green salad with whatever other organic veggies I can find (tomatoes, peppers, carrots). Organic gluten-free cornbread made with dairy and eggs."
        kids: "Same"
        dessert: "Something organic and gluten-free"
        notes: "Baked tofu for vegetarians"
      meal_10:
        title: "Lime Chicken Tacos"
        entrees: "Shredded chicken in a chipotle adobo sauce with fresh lime (slightly spicy)"
        side: "Refried beans and rice"
        kids: "Plain chicken and cheese quesadillas"
        dessert: "Chocolate hazelnut semifreddo"
        notes: "All allergens can be avoided."
      meal_11:
        title: "Tamale Takeout: Please Read the Notes"
        entrees: "Tamales from a local restaurant. Each adult signed up means one tamale, so don't sign up children. If you want two tamales, sign up two adults."
        side: "Curtido (a kind of pickled cabbage)"
        notes: "Put the kind of tamale you want in the notes. I'm only ordering tamales, to keep it simple."
      meal_12:
        title: "Chicken and Veggie Paellas"
        entrees: "Rice with chicken, and rice with veggies for vegetarians"
        side: "Green salad"
        dessert: "Crème caramel and fruit"
      meal_13:
        title: "Brisket Stroganoff"
        entrees: "Beef brisket stroganoff with egg noodles"
        side: "Shiitake and leek risotto, and asparagus"
        kids: "Plain noodles and risotto"
        dessert: "To be decided"
      meal_14:
        title: "Time for Chili"
        entrees: "Vegetarian chili"
        side: "Cornbread, salad"
        kids: "Same"
        dessert: "Yes"
        notes: "Let me know if you need it gluten-free."
      meal_15:
        title: "Crêpe Buffet"
        entrees: "A selection of crêpes (plain, sourdough, and gluten-free on request), with savory fillings (egg, cheese, veggies, herbs and more) and sweet ones (fruit, chocolate spread, jam, yogurt, ricotta and more) to fill yourself."
        notes: "Fillings are self-serve. The crêpes contain eggs and dairy."
      meal_16:
        title: "Curry and Rice"
        entrees: "Chicken curry over rice, with tofu for vegetarians"
        side: "Radish kimchi"
        kids: "Fried dumplings"
        dessert: "Fruit"
        notes: "My curry powder contains flour. If you need it gluten-free, I'll use the gluten-free curry powder in the common house kitchen."
      meal_17:
        title: "English Breakfast"
        entrees: "Scrambled eggs, sausages, mushrooms, baked beans"
        side: "Mixed berries"
      meal_18:
        title: "Chicken or Veggie Tikka Masala"
        entrees: "Chicken or veggie tikka masala: meat or veggies simmered in a rich coconut curry, with rice on the side"
        side: "Salad, rice"
        kids: "They'll like it"
        dessert: "Fruit"
        notes: "Both versions are gluten-free and dairy-free! Please say whether you want vegan or meat. As local and organic as possible."
      meal_19:
        title: "Chili Cook-Off!"
        entrees: "Chili and more chili, a small fee per adult"
        side: "Applesauce, bread and butter"
        kids: "Chili and more chili. Free for kids 6 and under."
        dessert: "Probably"
        notes: "Our chili cook-off raises money for new art for the dining room. Join us to cook, eat and vote! Everyone gets one vote, kids included. To enter, bring 4 quarts of chili by 6 pm and list its allergens, meat and alcohol on the entry form."
      meal_20:
        title: "Coffee Cake and Casserole"
        entrees: "Bacon and egg casserole with goat cheese and veggies"
        side: "Gluten-free blueberry coffee cake"
        kids: "They'll love it"
        notes: "Everything is gluten-free. The only dairy is the goat cheese in the casserole."
      meal_21:
        title: "Coconut Fish Chowder"
        entrees: "Coconut milk fish chowder, with a fish-free vegan option"
        side: "Freshly baked rolls"
        kids: "Raw carrot sticks and broccoli"
        dessert: "Fruit"
        notes: "The rolls contain wheat. The soup itself is gluten-free."
      meal_22:
        title: "Warm Stuffed Croissants and Fruit"
        entrees: "Fresh and grilled veggies in warm croissants"
        side: "Fresh fruit salad, and nut milks sweetened with dates"
