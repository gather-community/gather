  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Media Room"
        guidelines: |-
          # Media Room Guidelines

          1. Anyone under 13 must be supervised by an adult.
          1. Programs rated above PG-13 are locked on both the TV and the cable box.
          1. The room may be booked for special events or TV programs. See the calendar or contact media@example.com.
          1. Remotes must stay in the room at all times, in their designated place.
          1. Please tidy the Media Room and put it back to "room neutral" after using it. Watch out for food crumbs.
      multipurpose_room:
        name: "Multipurpose Room"
        guidelines: |-
          # Multipurpose Room Guidelines

          1. As the event guidelines say, all guests must be hosted by an adult member of the community.
          1. Please be aware that this room, like all common house space, is a shared resource.
          1. Hosts must write their guest's name and dates of stay on the whiteboard outside the door.
          1. All guests must follow the general common house guidelines (posted on the door) as well as the guidelines for every room they use. Please pay particular attention to the guidelines on noise, quiet hours and our fragrance-free policy.
          1. No candles or anything else that could cause a fire or other hazard. No smoking in the common house.
          1. The room is used for other purposes too, but overnight guests take priority. Please sort out scheduling conflicts person to person.
          1. Guests may stay up to 7 days, as long as another resident hasn't booked the room for another guest.
          1. Hosts are responsible for their guests. After the guests leave, hosts clean the room, wash the linens and sheets, and bring them back to the common house.
          1. Check-out time is noon.
          1. Keys are left in a designated spot in the common house. If keys are lost, the host will be charged for new ones.
          1. Guests may use the Do Not Disturb sign provided for their privacy.
      office:
        name: "Office"
      sitting_room:
        name: "Sitting Room"
      dining_room:
        name: "Dining Room"
        abbrv: "CH"
      courtyard:
        name: "Courtyard"
        abbrv: "Ctyd"
      kitchen:
        name: "Kitchen"
        abbrv: "CH"
        guidelines: |-
          # Kitchen Guidelines

          ## Overview

          The common house kitchen is a large investment for our community, and it can also be a dangerous place. Since our priority is the safety of everyone in our community, and of our equipment, we have the following guidelines.

          We expect every community member and their guests to treat this equipment and this space with care and respect.

          Parents are responsible for teaching their children that:

          * The kitchen is not a play area.
          * The food in the kitchen is not for anyone to eat unless it's labeled that way.
          * Children may only be in the kitchen if they are invited in and supervised by a responsible adult.

          *Please leave the kitchen cleaner than you found it.*

          And let's have fun, and make and eat delicious food together!

          ## Safety

          * If you leave the kitchen while something is in the oven or on a burner, warn others by placing a barrier across the kitchen entrances and leaving a note.
          * Put pots with hot food on the back burners, not the front ones.
          * Don't move the baking soda away from the stove. It's there in case of fire.
          * Never leave sharp knives unattended or put them in soapy water.

          If you have to leave before you've finished cleaning up, please leave a note saying when you'll be back, with your phone number.

          Please sign out anything you borrow and return it as soon as you can.

          Please report anything odd, such as strange noises, smells or broken items, to the person in charge of repairs.

          The common house refrigerator is for staples and community meals. Please share out leftovers rather than storing them here.

          The duties of head cooks, assistant cooks and cleaners are described separately.

          ## Basic Hygiene

          1. If you might be sick, keep the community healthy by going home.
          1. Wash your hands often, the old-fashioned way: with soap and hot water.
          1. Cover all cuts completely.
          1. When tasting, use each spoon only once.
          1. Avoid cross-contamination (allergens and bacteria) by using different utensils for different foods.
          1. Anything that touches raw meat must be washed and sanitized before it's used for anything else.
          1. Use the right colored cutting board for each kind of food.
          1. Sinks can harbor bacteria, so use a colander to wash produce that will be served raw.
          1. Food stays safe when it's thoroughly chilled or thoroughly heated.

          ## Staples

          Staples are bought for common house meals.

          When buying staples, we consider whether they are organic, fair trade and free of GMOs, as well as dietary preferences, shelf life and cost.

          Staples are paid for by a surcharge on common house meals, which buys new stock. Head cooks are expected to use the staples, which keeps stock fresh and their meal costs down.

          So please don't use staples for personal use. If you really must:

          * Replace what you use, item for item.
          * If you can't, please contribute generously to the kitchen staples fund.

          If you notice we're running low on something, please write it on the clipboard kept for this.

          The kitchen coordinator checks the list and the pantry weekly and shops as needed. We do our best to replace staples as they run out.

          If you need a staple to cook a community meal and find it's missing, please buy it and submit a separate receipt for reimbursement.

          The meals committee keeps the list of staples.

          Head cooks buy everything else, including bottled salad dressings.
    shared_guidelines:
      common_house:
        name: "Common House Guidelines"
        body: |-
          # Common House Guidelines

          * Welcome to our common house!
          * Our common house is the center of our community life.
          * Relationships are what our community is built on.
          * Every community member has an equal say in how we use our common house.
          * We treat the common house as respectfully as we would a neighbor's house. Please leave it the way you found it, or better!

          These guidelines balance freedom, responsibility and safety for people and the building.

          ## Accessibility

          To accommodate sensitivities, we agree to the following:

          * *Fragrance free* is the goal in the common house.
          * *Smoking:* there is no smoking in the common house.
          * *Animals:* the common house is pet free, except for service animals. Pets must not be left unattended on the common house grounds.

          ## Security

          The common house is locked by 10 PM on weeknights and by 11 PM on Fridays and Saturdays, following the closing checklist.

          ## Communication

          Residents address concerns directly whenever possible. If needed, the common house committee is available to help.

          ## Maintenance

          Report broken or faulty systems or appliances to the maintenance committee right away, at maintenance@example.com.

          For routine matters, send an email or leave a note in the maintenance folder.

          Report broken items to the common house committee at commonhouse@example.com.

          ## Alcohol

          Don't leave or store alcohol, opened or sealed, or any medication in the common house.

          ## Noise

          Anyone bothered by noise in the common house is welcome to ask for it to be lower. Please be considerate of others who ask.

          The community will be told in advance about large events that may be louder than usual or go past closing time.

          ## Quiet Hours

          * Weekdays, 10 PM to 8 AM
          * Weekends and holidays, 11 PM to 9 AM

          ## Who the Common House Is For

          The common house is for residents and their invited guests.

          * We're grateful for the support and hospitality of our neighboring communities.
          * As we welcome our neighbors, we expect to resolve any problems fairly, based on reciprocity and trust.

          Members of neighboring communities are welcome in the common house, and follow the same procedures for booking rooms. Anyone else must be hosted by an adult resident, who is responsible for their guests' behavior.

          ## Booking Rooms

          Community activities go on the calendar and take priority over other events.

          All guidelines are approved by consensus. Everyone's input is welcome as we continue to refine them.
