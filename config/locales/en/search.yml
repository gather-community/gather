en:
  search:
    # Title for a search result with neither a title nor a name.
    untitled: "(untitled)"
    # Singular label shown under each search result, keyed by result kind (SearchHelper::KINDS).
    kinds:
      wiki_page: "Wiki"
      event: "Event"
      calendar: "Calendar"
      group: "Group"
      user: "Person"
      household: "Household"
      meal: "Meal"
      memorial: "Memorial"
      emergency_contact: "Emergency Contact"
      pet: "Pet"
      vehicle: "Vehicle"
      transaction: "Transaction"
    # Shown by search_controller.ts when fetching a section's results fails.
    load_error: "Error loading results. Please try again."
    index:
      title: "Search"
      form_label: "Search"
      input_label: "Search Gather"
      placeholder: "Search Gather and Google Drive…"
      submit: "Search"
      search_tips: "Search tips"
      # Section headings and mobile tab names; a result count may follow.
      gather: "Gather"
      google_drive: "Google Drive"
      loading: "Loading…"
      load_more_drive: "Load more Drive results"
      filter: "Filter"
      empty_query: "Enter a search term above to search Gather and Google Drive."
    results_gather:
      no_results: "No results found."
    results_drive:
      no_results: "No Drive files found."
    results_drive_auth_error:
      reconnect: "Your community needs to be reconnected to Google Drive. Please notify a Gather Admin."
    # Checkbox labels in the search sidebar, keyed by the type value sent in the `types` param.
    type_filters:
      types:
        wiki_page: "Wiki pages"
        event: "Events"
        calendar: "Calendars"
        group: "Groups"
        user: "People"
        household: "Households"
        meal: "Meals"
        memorial: "Memorials"
        emergency_contact: "Emergency contacts"
        pet: "Pets"
        vehicle: "Vehicles"
        transaction: "Transactions"
        drive: "Google Drive"
    # The search tips modal. The search syntax examples (in <code>) are not translated, since they are
    # literal query syntax; descriptions that mention an example take it as an interpolation.
    search_tips_modal:
      title: "Search Tips"
      intro: "Enter words to search across Gather (wiki pages, events, people, meals, and more) and Google Drive."
      basic_search: "Basic search"
      both_words: "Items containing both words"
      exact_phrase: "The exact phrase “%{phrase}”"
      special_syntax: "Special syntax"
      title_only: "Search only in the title or name field"
      # %{options} is a comma-separated list of file type codes, e.g. doc, sheet.
      drive_type_html: "Filter Drive results by file type. Options: %{options}"
      combining: "Combining"
      title_and_word: "Items named “%{title}” containing “%{word}”"
      sheet_and_phrase: "Google Sheets matching the phrase “%{phrase}”"
      checkbox_hint: "Use the checkboxes on the right to filter by content type."
