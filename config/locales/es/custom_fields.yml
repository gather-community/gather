      community:
        settings:
          main_nav_customizations: "Usa este ajuste para editar los enlaces del menú superior. Escribe los enlaces en formato Markdown. Ejemplo: [Nombre del enlace](https://example.com). Si el nombre del enlace coincide con uno existente, sustituirá la URL predeterminada. Una URL en blanco elimina el enlace por completo. Se ignora cualquier otro texto o marcado." # Machine translated, remove this comment when verified
          people:
            plain_user_selects: "Usar listas desplegables simples en lugar de cuadros con búsqueda. Puede ser preferible en comunidades pequeñas." # Machine translated, remove this comment when verified
            user_custom_fields_spec: "Escribe en formato YAML la especificación de los campos personalizados que aparecerán al ver o editar personas de esta comunidad. Contacta con el soporte de Gather si necesitas ayuda para escribirla." # Machine translated, remove this comment when verified
          meals:
            reimb_instructions: "Qué deben hacer los cocineros con sus recibos para que se les reembolse. Por ejemplo, pedirles que introduzcan los importes en la página de edición de la comida en Gather, usar el formulario de reembolso integrado u otro proceso." # Machine translated, remove this comment when verified
            allergens: "Lista de alérgenos separados por comas entre los que eligen los cocineros al publicar menús." # Machine translated, remove this comment when verified
            show_reimb_form: "Si se muestra un formulario de reembolso imprimible (con importes de compra y despensa y método de reembolso) en la página de resumen de la comida. Desmárcalo si prefieres un proceso de reembolso electrónico." # Machine translated, remove this comment when verified
            cooks_can_finalize: "Si los jefes de cocina pueden finalizar comidas, además de los responsables de facturación, los coordinadores de comidas y los administradores." # Machine translated, remove this comment when verified
            cooks_can_change_invites: "Si los jefes de cocina pueden cambiar qué comunidades están invitadas a una comida." # Machine translated, remove this comment when verified
            default_invites: "Qué comunidades están invitadas a una comida por defecto." # Machine translated, remove this comment when verified
            allow_job_signup_on_meal_page: "Si los comensales pueden ofrecerse a ayudar con una comida al inscribirse en ella." # Machine translated, remove this comment when verified
            default_capacity: "El número predeterminado de personas que admite una comida." # Machine translated, remove this comment when verified
            reminder_lead_times:
              _self: "Con cuántos días de antelación se envían los distintos recordatorios. Se envían a las 6 de la mañana, hora local. Un «0» significa que el recordatorio se enviará la mañana del mismo día de la comida. Consulta la página de roles de comidas para más ajustes de recordatorios." # Machine translated, remove this comment when verified
              diner: "El recordatorio que se envía a todos los comensales." # Machine translated, remove this comment when verified
              early_menu: "El recordatorio que se envía al jefe de cocina para que introduzca un menú." # Machine translated, remove this comment when verified
              late_menu: "Un segundo recordatorio, más urgente, que se envía al jefe de cocina si aún no ha introducido el menú. Debe tener menos días de antelación que el primer recordatorio del menú." # Machine translated, remove this comment when verified
          calendars:
            kinds: "Distintos tipos de eventos separados por comas. Se pueden usar en las normas de eventos. Si se deja en blanco, el campo «tipo» no aparecerá en el formulario de eventos." # Machine translated, remove this comment when verified
            meals:
              default_total_time: "Duración total predeterminada de los eventos de comidas en minutos, incluidos la preparación y la limpieza" # Machine translated, remove this comment when verified
              default_prep_time: "Tiempo de preparación predeterminado de una comida en minutos" # Machine translated, remove this comment when verified
          billing:
            contact: "Correo para consultas de facturación. Se incluirá con las instrucciones de pago." # Machine translated, remove this comment when verified
            payment_instructions: "Cómo pagar una cuenta." # Machine translated, remove this comment when verified
            statement_terms: "Número de días tras la fecha de creación en que vence un estado de cuenta. Si es cero (0), los estados de cuenta no tienen vencimiento." # Machine translated, remove this comment when verified
            statement_reminder_lead_time: "Con cuántos días de antelación al vencimiento se envía el recordatorio de pago del estado de cuenta. No se envían recordatorios si los estados de cuenta no tienen vencimiento o si el saldo ya está pagado." # Machine translated, remove this comment when verified
            paypal_reimbursement: "Permitir que los cocineros pidan el reembolso de las comidas por PayPal. Los pagos de PayPal deben hacerse manualmente (no son automáticos)." # Machine translated, remove this comment when verified
            payment_methods:
              _self: "Instrucciones o información de los distintos métodos de pago. Déjalo en blanco si no se acepta el método. Visita tu <a href='/accounts/mine'>página de cuentas</a> para ver cómo quedan las instrucciones." # Machine translated, remove this comment when verified
              paypal_me: "Escribe tu <a href='https://paypal.me'>enlace de PayPal.me</a>. Es la forma más fácil de que los miembros paguen con PayPal. Ten en cuenta que con este método no se pueden evitar las comisiones si tienes una cuenta de PayPal para empresas." # Machine translated, remove this comment when verified
              paypal_email: "Si quieres aceptar PayPal sin usar PayPal.me, escribe la dirección de correo a la que los miembros deben enviar los pagos." # Machine translated, remove this comment when verified
              paypal_friend: "Se aplica a PayPal.me y a PayPal por correo. Márcalo si, según las condiciones de uso de PayPal, los pagos pueden considerarse entre amigos. Enviarlos así evita comisiones." # Machine translated, remove this comment when verified
              check_payee: "Escribe a nombre de quién deben extenderse los cheques. Déjalo en blanco si no se aceptan cheques." # Machine translated, remove this comment when verified
              check_address: "Escribe una dirección si aceptas cheques por correo postal. Así también se mostrarán las instrucciones de pago de facturas en línea." # Machine translated, remove this comment when verified
              check_dropoff: "Escribe las instrucciones para entregar un cheque en persona. Déjalo en blanco si los cheques deben enviarse por correo postal o no se aceptan." # Machine translated, remove this comment when verified
              cash_dropoff: "Escribe las instrucciones para entregar efectivo en persona. Déjalo en blanco si no se acepta efectivo." # Machine translated, remove this comment when verified
              additional_info: "Escribe cualquier información adicional que quieras incluir en el área de instrucciones de pago." # Machine translated, remove this comment when verified
              show_billing_contact: "Si se incluye el correo de contacto de facturación de arriba (si lo hay) al final de las instrucciones de pago. Desmárcalo y añádelo tú en «Información adicional» si quieres personalizar cómo aparece." # Machine translated, remove this comment when verified
            late_fee_policy:
              fee_type: "Cómo se calcula el recargo" # Machine translated, remove this comment when verified
              threshold: "Saldo pendiente mínimo para aplicar un recargo" # Machine translated, remove this comment when verified
              amount: "Importe o porcentaje del recargo (p. ej. escribe «3» para el 3 % o 3,00, según el tipo)" # Machine translated, remove this comment when verified
