      guide:
        title: "Guía de configuración de Google Drive" # MT
        body: |- # MT
          Esta guía te acompaña para obtener las credenciales necesarias para conectar el Google Workspace de tu comunidad a Gather.

          ## Requisitos

          * La comunidad debe haberse registrado en **Google Workspace**.
              * El plan Business Starter es suficiente.
              * Solo hace falta una cuenta de usuario.
              * Elige un nombre de comunidad para la cuenta (p. ej. workspace.admin@tudominio.com) en vez de un nombre personal (p. ej. juan.perez@tudominio.com).
          * Quien siga estas instrucciones debe haber iniciado sesión en Google con una cuenta del Google Workspace de la comunidad con privilegios de **superadministrador**. Si solo tienes una cuenta, esa cuenta los tiene.

          ## Configuración principal

          ### Crear un proyecto

          1. Ve a https://console.cloud.google.com
          2. Comprueba que has iniciado sesión en Google con la cuenta de superadministrador.
          3. Acepta los términos y condiciones. Espera unos minutos a que se aprovisione el recurso de tu organización.
          4. Ve a https://console.cloud.google.com/projectcreate para crear un proyecto.
          5. Llámalo **Gather Main**.
          6. Selecciona la organización de tu dominio.
          7. Usa el valor predeterminado para la ubicación.

          ### API habilitadas

          1. Con el nuevo proyecto seleccionado, ve a https://console.cloud.google.com/ → menú principal → API y servicios → API y servicios habilitados
          2. Haz clic en **Habilitar API y servicios**.
          3. Habilita la **API de Google Drive**.

          ### ID de cliente de OAuth

          1. Con el nuevo proyecto seleccionado, ve a https://console.cloud.google.com/ → menú principal → API y servicios → API y servicios habilitados → Credenciales.
          2. Haz clic en **Crear credenciales** → **ID de cliente de OAuth**
          3. Selecciona **Aplicación web**.
          4. Nombre: **Drive OAuth Client ID**.
          5. En **Orígenes autorizados de JavaScript**, añade https://gather.coop.
          6. En **URI de redireccionamiento autorizados**, añade https://gather.coop/gdrive/setup/auth/callback.
          7. Copia el ID de cliente y el secreto en un lugar seguro y guárdalos para más adelante.
              1. El ID de cliente debería parecerse a `302773344240-7g2n5abcdef8es2cvpc0roj7t.apps.googleusercontent.com`
              2. El secreto del cliente debería parecerse a `AIza73uyhc63ehd763ehesysqyhw-hei2asda_2rs`

          ### Pantalla de consentimiento de OAuth

          1. Con el nuevo proyecto seleccionado, ve a https://console.cloud.google.com/ → menú principal → API y servicios → Pantalla de consentimiento de OAuth.
          2. Elige **Interno**.
          3. Nombre de la aplicación: **Gather**.
          4. Correo de asistencia al usuario: la dirección de correo de la cuenta de superadministrador.
          5. Sin logotipo.
          6. Página principal de la aplicación: https://gather.coop
          7. Política de privacidad: https://gather.coop/privacy-policy
          8. Dominios autorizados:
              1. gather.coop
          9. Correo del desarrollador: support@gather.coop
          10. Ámbitos
              1. auth/userinfo.email
              2. auth/drive
