      meal_27:
        title: "Noche de barbacoa" # MT
        entrees: "Clásicos a la parrilla con un toque coreano. Espero que mis ayudantes tengan buenas ideas." # MT
        side: "Verduras ligeramente salteadas del mercado de productores o de nuestros huertos" # MT
        kids: "Puede que pongamos a los niños a trabajar en el huerto" # MT
        dessert: "Fresas frescas, si es temporada" # MT
        notes: "Lo más ecológico y local posible. Es fácil adaptarlo a cualquier dieta." # MT
      meal_28:
        title: "¡Pizza casera!" # MT
        entrees: "Pizza con ingredientes variados: pollo, verduras, queso, pepperoni. Masa normal y sin gluten." # MT
        side: "Ensalada y fruta" # MT
        kids: "A los niños les encanta esto" # MT
        dessert: "Puede ser..." # MT
        notes: "Indica abajo si la necesitas sin gluten para que pueda organizarme. ¡Gracias! Ingredientes ecológicos y locales cuando sea posible." # MT
      meal_29:
        title: "Cata de tomates" # MT
        entrees: "Una degustación de tomates de la zona, con opciones de ave y vegetarianas" # MT
        side: "Ensalada caprese, muchas verduras, mazorcas de maíz" # MT
        kids: "Maíz desgranado para los niños con brackets" # MT
        dessert: "¿Helado de tomate?" # MT
        notes: "Local y ecológico cuando sea posible. La comida puede prepararse sin alérgenos (pero no sin tomate). Habrá frutos de cáscara (almendras y avellanas)." # MT
      meal_30:
        title: "¡Chili y postres de manzana para compartir!" # MT
        entrees: "El chili como lo hacían en mi casa: alubias suaves y verduras sobre arroz. Carne picada de ternera para quien coma carne." # MT
        side: "Verduras cocinadas, según lo que haya en la zona" # MT
        kids: "El plato principal es suave para todos" # MT
        dessert: "¡Es nuestra comida anual de postres de manzana, en la que cada cual trae uno! Ven a recoger manzanas con nosotros el fin de semana anterior y luego trae lo que prepares con esas manzanas tan bonitas." # MT
        notes: "Habrá lácteos aparte, pero el plato principal no lleva. Los postres los preparan distintas personas, así que pueden contener cualquiera de los alérgenos habituales." # MT
      meal_31:
        title: "Crepes dulces y saladas" # MT
        entrees: "Crepes con muchos rellenos, saladas para cenar y dulces de postre" # MT
        side: "Verduras al vapor" # MT
        dessert: "¡Más crepes!" # MT
        notes: "Huevos de gallinas camperas, leche de la zona, harina ecológica. Si quieres crepes sin gluten, avísame y lo intentaré." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Arroz, verduras sazonadas, ternera y huevo o salmón ahumado, enrollados en alga" # MT
        side: "Kimchi de rábano en agua" # MT
        kids: "El plato principal debería gustarles" # MT
        dessert: "Fruta o helado" # MT
        notes: "Empezamos a fermentar el kimchi de rábano en agua hace dos semanas. Después de la comida habrá tarros para llevar a casa." # MT
      meal_33:
        title: "Crema de guisantes al curry y sándwiches" # MT
        entrees: "Crema de guisantes secos al curry con caldo de pollo, jamón y leche, y una versión vegana con caldo de verduras y leche de coco" # MT
        side: "Sándwiches de atún y de ensalada de huevo, o trae tu propio relleno para el pan" # MT
        kids: "Lo mismo. Escríbeme antes del jueves si tus hijos quieren la crema sin curry." # MT
        dessert: "Galletas caseras con pepitas de chocolate, y fruta" # MT
        notes: "La crema no lleva gluten, y la de verduras tampoco lleva lácteos. Si quieres pan sin gluten u otros cambios, escríbeme antes del jueves." # MT
      meal_34:
        title: "Crepes y cosas riquísimas para rellenarlas" # MT
        entrees: "Crepes (huevo, harina, leche). En realidad se parecen más a las tortitas suecas: finas y flexibles." # MT
        side: "Rellenos dulces y salados: azúcar, mermelada casera de fresa y de arándanos, salsa de caramelo salado, nata montada, queso y seguramente champiñones salteados. Trae lo tuyo si quieres algo en concreto." # MT
        kids: "Lo mismo" # MT
        dessert: "Lo mismo" # MT
        notes: "Seguramente no todo será ecológico, pero haré lo que pueda con el presupuesto." # MT
      meal_35:
        title: "Cena de pastel de carne" # MT
        entrees: "Pastel de carne" # MT
        side: "Ensalada, panecillos, patatas" # MT
        dessert: "Crumble de manzana" # MT
      meal_36:
        title: "Bibimbap" # MT
        entrees: "Arroz al vapor con verduras sazonadas y ternera (o tofu) por encima, con salsa picante de chile (y salsa de soja si no te gusta el picante), y huevos fritos" # MT
        side: "Encurtidos y kimchi" # MT
        kids: "Pueden tomar más ternera o tofu que verduras" # MT
        dessert: "Fruta" # MT
        notes: "Todo va sazonado con salsa de soja sin gluten, ajo, aceite de sésamo y pimienta negra. Esta comida es sobre todo de verduras, así que no esperes mucha carne." # MT
      meal_37:
        title: "Tacos de pavo" # MT
        entrees: "Tacos de carne picada de pavo" # MT
        side: "Frijoles refritos, arroz" # MT
        notes: "Tomate, lechuga, salsa suave y crema agria para los tacos." # MT
      meal_38:
        title: "Pizza para desayunar" # MT
        entrees: "La mejor masa de pizza del mundo, hecha con muy pocos ingredientes, sobre todo yuca. Les encanta hasta a los más quisquillosos. Con una salsa tipo pesto y carnes, verduras y quesos a elegir. Indica tus restricciones alimentarias." # MT
        side: "Huevos revueltos" # MT
      meal_39:
        title: "¡Bufé de sopas!" # MT
        entrees: "Una sopa sencilla de carne y otra de verduras, y muchos ingredientes para crear la tuya: semillas, verduras, pasta sin gluten, queso..." # MT
        side: "Verduras, queso, pasta" # MT
        kids: "A los niños les encantará prepararse la suya" # MT
        dessert: "Quizá algo con fruta" # MT
        notes: "Lo más local y ecológico posible." # MT
      meal_40:
        title: "Salmón en papillote" # MT
        entrees: "Salmón al horno en papel de hornear, sazonado con cebolla y hierbas" # MT
        side: "Verduras de hoja (espinacas o kale) o judías verdes salteadas con ajo, patatas nuevas asadas y pan recién hecho" # MT
        kids: "Si tus hijos no comen salmón, déjalo en los comentarios y sugiere otra cosa, como ensalada de atún o huevos duros." # MT
        dessert: "Sí: fruta y algo horneado" # MT
        notes: "Todo es sin gluten excepto el postre horneado. Las verduras serán casi todas ecológicas. Avísame si necesitas una opción vegetariana; puedo saltear o hornear algo de tofu." # MT
