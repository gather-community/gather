# MACHINE TRANSLATIONS
#
# A line ending in "# MT" was translated automatically and hasn't been checked by a person yet.
#
# - If you check a line and it's right, or you correct it, delete the "# MT" from the end of the line.
# - If the English for a key changes, its translation here gets rewritten and marked "# MT" again.
# - For a multi-line value, the "# MT" is on the line with the key, after the "|-".
#
# To see how much of a language is left to check: grep -c "# MT" config/locales/<locale>/*.yml
# See "Translations" in CLAUDE.md for the rest.
# ======================================================================================================
es:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Sala multimedia" # MT
        guidelines: |- # MT
          # Normas de uso de la sala multimedia

          1. Los menores de 13 años deben estar siempre con un adulto.
          1. Los programas no recomendados para menores de 13 años están bloqueados en la televisión y en el decodificador.
          1. La sala se puede reservar para eventos especiales o programas de televisión. Consulta el calendario o escribe a media@example.com.
          1. Los mandos a distancia no deben salir nunca de la sala y tienen que quedarse en su sitio.
          1. Después de usar la sala multimedia, recógela y déjala como estaba. Ojo con las migas.
      multipurpose_room:
        name: "Sala de usos múltiples" # MT
        guidelines: |- # MT
          # Normas de uso de la sala de usos múltiples

          1. Como dicen las normas de eventos, todos los invitados deben estar acogidos por un miembro adulto de la comunidad.
          1. Ten en cuenta que esta sala, como todos los espacios de la casa común, es un recurso compartido.
          1. Quien acoja a invitados debe escribir su nombre y las fechas de su estancia en la pizarra que hay junto a la puerta.
          1. Todos los invitados deben respetar las normas generales de la casa común (colgadas en la puerta) y las normas de cada sala que usen. Presta especial atención a las normas sobre ruido, horas de silencio y nuestra política de espacios sin fragancias.
          1. No se permiten velas ni nada que pueda provocar un incendio u otro peligro. No se puede fumar en la casa común.
          1. La sala también se usa para otras cosas, pero los invitados que pasan la noche tienen prioridad. Si hay un conflicto de horario, resuélvelo hablando directamente con la otra persona.
          1. Los invitados pueden quedarse hasta 7 días, siempre que otra persona residente no haya reservado la sala para otro invitado.
          1. Quien acoge es responsable de sus invitados. Cuando se vayan, limpia la sala, lava la ropa de cama y las sábanas y devuélvelas a la casa común.
          1. La salida es a las 12:00.
          1. Las llaves se dejan en un lugar indicado de la casa común. Si se pierden, se cobrarán las nuevas a quien acogió a los invitados.
          1. Los invitados pueden usar el cartel de «No molestar» para tener privacidad.
      office:
        name: "Oficina" # MT
      sitting_room:
        name: "Sala de estar" # MT
      dining_room:
        name: "Comedor" # MT
        abbrv: "CC" # MT
      courtyard:
        name: "Patio" # MT
