      kitchen:
        name: "Cocina" # MT
        abbrv: "CC" # MT
        guidelines: |- # MT
          # Normas de uso de la cocina

          ## Introducción

          La cocina de la casa común es una gran inversión para nuestra comunidad y también puede ser un lugar peligroso. Como nuestra prioridad es la seguridad de todas las personas de la comunidad, y la de nuestro equipamiento, tenemos las siguientes normas.

          Esperamos que todos los miembros de la comunidad y sus invitados traten este equipamiento y este espacio con cuidado y respeto.

          Las madres y los padres son responsables de enseñar a sus hijos que:

          * La cocina no es un lugar para jugar.
          * La comida de la cocina no es para que se la coma cualquiera, salvo que esté etiquetada así.
          * Los niños solo pueden entrar en la cocina si los invitan a pasar y los supervisa un adulto responsable.

          *Deja la cocina más limpia de lo que la encontraste.*

          Y, sobre todo, ¡disfrutemos preparando y comiendo juntos cosas deliciosas!

          ## Seguridad

          * Si sales de la cocina mientras hay algo en el horno o en el fuego, avisa a los demás poniendo una barrera en las entradas de la cocina y dejando una nota.
          * Pon las ollas con comida caliente en los fuegos de atrás, no en los de delante.
          * No apartes el bicarbonato de la cocina. Está ahí por si hay un incendio.
          * No dejes nunca cuchillos afilados sin vigilar ni los metas en agua con jabón.

          Si tienes que irte antes de terminar de recoger, deja una nota diciendo cuándo vuelves, con tu número de teléfono.

          Apunta todo lo que te lleves prestado y devuélvelo en cuanto puedas.

          Si notas algo raro, como ruidos u olores extraños o cosas rotas, avisa a la persona encargada de las reparaciones.

          El frigorífico de la casa común es para los productos básicos y las comidas de la comunidad. Reparte las sobras en lugar de guardarlas aquí.

          Las tareas de los jefes de cocina, los ayudantes de cocina y el equipo de limpieza se describen aparte.

          ## Higiene básica

          1. Si puede que estés enfermo, cuida la salud de la comunidad y quédate en casa.
          1. Lávate las manos a menudo, como siempre: con agua caliente y jabón.
          1. Cúbrete bien cualquier corte.
          1. Al probar la comida, usa cada cuchara solo una vez.
          1. Evita la contaminación cruzada (alérgenos y bacterias) usando utensilios distintos para cada alimento.
          1. Todo lo que toque carne cruda debe lavarse y desinfectarse antes de usarse para otra cosa.
          1. Usa la tabla de cortar del color que corresponde a cada tipo de alimento.
          1. Los fregaderos pueden acumular bacterias, así que usa un colador para lavar las verduras y frutas que se vayan a servir crudas.
          1. La comida se mantiene segura cuando está bien fría o bien caliente.

          ## Productos básicos

          Los productos básicos se compran para las comidas de la casa común.

          Al comprarlos, tenemos en cuenta si son ecológicos, de comercio justo y sin transgénicos, además de las preferencias alimentarias, cuánto duran y lo que cuestan.

          Los productos básicos se pagan con un recargo en las comidas de la casa común, que sirve para reponerlos. Se espera que los jefes de cocina los usen, así se mantienen frescos y sus comidas salen más baratas.

          Así que no uses los productos básicos para tu consumo personal. Si de verdad no te queda más remedio:

          * Repón lo que uses, producto por producto.
          * Si no puedes, haz una aportación generosa al fondo de productos básicos de la cocina.

          Si ves que se está acabando algo, apúntalo en la tablilla que hay para eso.

          La persona que coordina la cocina revisa la lista y la despensa cada semana y compra lo que haga falta. Hacemos lo posible por reponer los productos básicos a medida que se acaban.

          Si necesitas un producto básico para preparar una comida de la comunidad y ves que no hay, cómpralo y entrega el tique por separado para que te lo reembolsen.

          El comité de comidas mantiene la lista de productos básicos.

          Los jefes de cocina compran todo lo demás, incluidos los aliños para ensalada embotellados.
    shared_guidelines:
      common_house:
        name: "Normas de la casa común" # MT
        body: |- # MT
          # Normas de la casa común

          * ¡Te damos la bienvenida a nuestra casa común!
          * Nuestra casa común es el centro de la vida de nuestra comunidad.
          * Nuestra comunidad se construye sobre las relaciones entre las personas.
          * Todos los miembros de la comunidad tienen la misma voz a la hora de decidir cómo usamos la casa común.
          * Tratamos la casa común con el mismo respeto con el que trataríamos la casa de un vecino. Déjala como la encontraste, ¡o mejor!

          Estas normas buscan un equilibrio entre la libertad, la responsabilidad y la seguridad de las personas y del edificio.

          ## Accesibilidad

          Para tener en cuenta las sensibilidades de cada cual, acordamos lo siguiente:

          * *Sin fragancias* es el objetivo en la casa común.
          * *Tabaco:* no se fuma en la casa común.
          * *Animales:* no se permiten mascotas en la casa común, salvo animales de asistencia. No se deben dejar mascotas solas en el recinto de la casa común.

          ## Seguridad

          La casa común se cierra con llave a las 22:00 entre semana y a las 23:00 los viernes y sábados, siguiendo la lista de comprobación de cierre.

          ## Comunicación

          Siempre que sea posible, los residentes hablan directamente de lo que les preocupa. Si hace falta, el comité de la casa común está disponible para ayudar.

          ## Mantenimiento

          Si algún sistema o electrodoméstico se rompe o falla, avisa enseguida al comité de mantenimiento en maintenance@example.com.

          Para asuntos habituales, envía un correo o deja una nota en la carpeta de mantenimiento.

          Si algo se rompe, avisa al comité de la casa común en commonhouse@example.com.

          ## Alcohol

          No dejes ni guardes en la casa común alcohol, abierto o cerrado, ni medicamentos.

          ## Ruido

          Si a alguien le molesta el ruido en la casa común, puede pedir que se baje. Ten en cuenta a quien te lo pida.

          Se avisará a la comunidad con antelación de los eventos grandes que puedan hacer más ruido de lo normal o alargarse más allá de la hora de cierre.

          ## Horas de silencio

          * Entre semana, de 22:00 a 8:00
          * Fines de semana y festivos, de 23:00 a 9:00

          ## Para quién es la casa común

          La casa común es para los residentes y sus invitados.

          * Agradecemos el apoyo y la hospitalidad de las comunidades vecinas.
          * Igual que recibimos a nuestros vecinos, esperamos resolver cualquier problema de forma justa, con reciprocidad y confianza.

          Los miembros de las comunidades vecinas son bienvenidos en la casa común y siguen el mismo procedimiento para reservar salas. Cualquier otra persona debe venir invitada por un residente adulto, que es responsable de cómo se comportan sus invitados.

          ## Reserva de salas

          Las actividades de la comunidad se ponen en el calendario y tienen prioridad sobre otros eventos.

          Todas las normas se aprueban por consenso. Las aportaciones de todos son bienvenidas mientras seguimos mejorándolas.
