        title: "Página de ejemplo" # MT
        content: |- # MT
          Esta es una página de ejemplo de la wiki.

          ¡Haz clic en **Editar** arriba para ver cómo funciona esta página! Y no te preocupes, ¡no puedes romper nada!

          ## Formato

          Para editar una página de la wiki se usa **Markdown**, una forma sencilla de crear contenido limpio y atractivo sin tener que aprender un lenguaje especial. Para saber más sobre Markdown, consulta la [Guía de formato Markdown](/about/markdown).

          ## Enlaces

          ¡Los enlaces a otras páginas son muy importantes! Puedes enlazar a otras **páginas de la wiki** así: [[Página divertida]].

          Fíjate en que el enlace de arriba (probablemente) es rojo. Eso es porque la página aún no existe. Si haces clic en el enlace, podrás crear la página. ¡Entonces el enlace se volverá azul!

          Si quieres usar como texto del enlace algo distinto del título de la página, puedes [[Página divertida|hacer esto]].

          Los enlaces a páginas externas se ven [así](http://example.com).

          Una URL en texto plano se reconocerá y convertirá automáticamente en un enlace: https://gather.coop
