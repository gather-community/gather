            Listan ylläpitäjänä sinua pyydetään hyväksymään seuraava
            postituslistalle lähetetty viesti:

                Lista:    $listname
                Lähettäjä: $sender_email
                Aihe:     $subject

            Viesti on pidätetty, koska:

            $reasons

            Käy sopivana hetkenä hallintanäkymässäsi hyväksymässä tai
            hylkäämässä pyyntö.
