        # tags in this example would render instead of being shown as typed.
        raw_markup: |- # MT
          Jos olet kokenut käyttäjä ja haluat käyttää suoraa HTML:ää, kokeile!

          Voit esimerkiksi <blockquote>käyttää lainauslohkoja</blockquote>.
