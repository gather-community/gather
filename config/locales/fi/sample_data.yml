        entrees: "Kookosmaitoon tehtyä kalakeittoa, ja kalaton vegaaninen vaihtoehto" # MT
        side: "Vastaleivottuja sämpylöitä" # MT
        kids: "Raakoja porkkanatikkuja ja parsakaalia" # MT
        dessert: "Hedelmiä" # MT
        notes: "Sämpylöissä on vehnää. Itse keitto on gluteeniton." # MT
      meal_22:
        title: "Lämpimiä täytettyjä croissanteja ja hedelmiä" # MT
        entrees: "Tuoreita ja grillattuja kasviksia lämpimissä croissanteissa" # MT
        side: "Raikasta hedelmäsalaattia ja taateleilla makeutettuja pähkinämaitoja" # MT
        kids: "Munakokkelia ja jogurttia" # MT
      meal_23:
        title: "Coq au vin" # MT
        entrees: "Coq au vin" # MT
        side: "Persiljaperunoita, vihreitä papuja, salaattia ja sinappivinegrettiä" # MT
        dessert: "Mansikoita ja kermaa" # MT
      meal_24:
        title: "Dumplingkeitto" # MT
        entrees: "Dumplingeja kanaliemessä (tai kasvisliemessä)" # MT
        side: "Riisiä, retiisikimchiä ja lisukkeita (suikaloitua merilevää, hienonnettua kevätsipulia)" # MT
        kids: "Useimmat lapset tykkäävät dumplingeista" # MT
        dessert: "Hedelmiä ja brownieita" # MT
        notes: "Dumplingit ovat possua, ellet pyydä nauta- tai kasvisdumplingeja. Lisään liemeen kananmunaa." # MT
      meal_25:
        title: "Kokoa oma riisikulho" # MT
        entrees: "Kanaa (tai uunitofua) ja valintasi mukaan riisiä, rapeita nuudeleita, kasviksia, ananasta, kookoshiutaleita, mantelilastuja, raastettua juustoa ja muita täytteitä" # MT
        kids: "Viipaloituja kasviksia, hedelmiä" # MT
        dessert: "Keksipaloja" # MT
      meal_26:
        title: "Perinteistä saksalaista ruokaa" # MT
        entrees: "Bratwurstia, munanuudeleita ja perunavuokaa" # MT
        side: "Punakaalia, hapankaalia, piparjuurta ja kermaviiliä" # MT
        kids: "Vielä auki" # MT
        dessert: "Omenastrudelia ja jäätelöä" # MT
      meal_27:
        title: "Grilli-ilta" # MT
        entrees: "Grilliherkkuja korealaisella twistillä. Toivottavasti apukokeillani on hyviä ideoita." # MT
        side: "Kevyesti paistettuja kasviksia torilta tai omista puutarhoistamme" # MT
        kids: "Lapset saatetaan pistää puutarhatöihin" # MT
        dessert: "Tuoreita mansikoita, jos on sesonki" # MT
        notes: "Mahdollisimman luomua ja paikallista. Kaikki ruokavaliot onnistuvat helposti." # MT
      meal_28:
        title: "Kotitekoista pizzaa!" # MT
        entrees: "Pizzaa monilla täytteillä: kanaa, kasviksia, juustoa, pepperonia. Tavallinen ja gluteeniton pohja." # MT
        side: "Salaattia ja hedelmiä" # MT
        kids: "Tällaisesta lapset tykkää" # MT
        dessert: "Ehkä..." # MT
        notes: "Kerro alla, jos tarvitset gluteenitonta, niin osaan suunnitella. Kiitos! Luomua ja paikallisia raaka-aineita aina kun mahdollista." # MT
      meal_29:
        title: "Tomaattimaistiaiset" # MT
        entrees: "Paikallisten tomaattien maistelua, broileri- ja kasvisvaihtoehdoin" # MT
        side: "Caprese-salaattia, paljon kasviksia, maissintähkiä" # MT
        kids: "Tähkästä irrotettua maissia lapsille, joilla on hammasraudat" # MT
        dessert: "Tomaattijäätelöä?" # MT
        notes: "Paikallista ja luomua aina kun mahdollista. Ateria onnistuu allergeenittomana (mutta ei tomaatittomana). Tarjolla on puupähkinöitä (manteleita ja hasselpähkinöitä)." # MT
      meal_30:
        title: "Chiliä ja omenajälkiruokanyyttärit!" # MT
        entrees: "Chiliä sellaisena kuin sen lapsena opin: mietoja papuja ja kasviksia riisin päällä. Lihansyöjille jauhelihaa." # MT
        side: "Kypsennettyjä kasviksia sen mukaan, mitä lähiseudulta saa" # MT
        kids: "Pääruoka on tarpeeksi mietoa kaikille" # MT
        dessert: "Vuotuiset omenajälkiruokanyyttärit! Lähde kanssamme omenoita poimimaan edellisenä viikonloppuna ja tuo sitten mitä noista upeista omenoista loihdit." # MT
        notes: "Maitotuotteita on tarjolla erikseen, mutta pääruoassa niitä ei ole. Jälkiruoat ovat eri ihmisten tekemiä, joten niissä voi olla mitä tahansa yleisistä allergeeneista." # MT
      meal_31:
        title: "Suolaisia ja makeita kreppejä" # MT
        entrees: "Kreppejä monilla täytteillä: suolaisia päivälliseksi ja makeita jälkiruoaksi" # MT
        side: "Höyrytettyjä kasviksia" # MT
        dessert: "Lisää kreppejä!" # MT
        notes: "Vapaiden kanojen munia, paikallista maitoa, luomujauhoja. Jos haluat gluteenittomia kreppejä, kerro, niin kokeilen." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Riisiä, maustettuja kasviksia, naudanlihaa ja kananmunaa tai savulohta merileväarkkiin käärittynä" # MT
        side: "Retiisivesikimchiä" # MT
        kids: "Pääruoan pitäisi kelvata heillekin" # MT
        dessert: "Hedelmiä tai jäätelöä" # MT
        notes: "Laitoimme retiisivesikimchin käymään kaksi viikkoa sitten. Aterian jälkeen saa ottaa purkin kotiin." # MT
      meal_33:
        title: "Curryhernekeittoa ja voileipiä" # MT
        entrees: "Curryllä maustettua hernekeittoa kanaliemellä, kinkulla ja maidolla, sekä vegaaninen versio kasvisliemellä ja kookosmaidolla" # MT
        side: "Tonnikala- ja munasalaattileipiä, tai tuo omat leivänpäälliset" # MT
        kids: "Samaa. Laita sähköpostia ennen torstaita, jos lapsesi haluavat keittoa ilman currya." # MT
        dessert: "Kotitekoisia suklaahippukeksejä ja hedelmiä" # MT
        notes: "Keitto on gluteenitonta, ja kasviskeitto myös maidotonta. Jos haluat gluteenitonta leipää tai muita muutoksia, laita sähköpostia ennen torstaita." # MT
      meal_34:
        title: "Kreppejä ja herkullisia täytteitä" # MT
        entrees: "Kreppejä (kananmunaa, jauhoja, maitoa). Oikeastaan lähempänä tavallisia ohukaisia: ohuita ja taipuisia." # MT
        side: "Makeita ja suolaisia täytteitä: sokeria, kotitekoista mansikka- ja mustikkahilloa, suolakinuskikastiketta, kermavaahtoa, juustoa ja luultavasti paistettuja sieniä. Tuo omasi, jos haluat jotain tiettyä." # MT
        kids: "Samaa" # MT
        dessert: "Samaa" # MT
        notes: "Ehkä ei ihan kaikki luomua, mutta teen parhaani budjetin puitteissa." # MT
      meal_35:
        title: "Lihamurekepäivällinen" # MT
        entrees: "Lihamureketta" # MT
        side: "Salaattia, sämpylöitä, perunoita" # MT
        dessert: "Omenapaistosta" # MT
      meal_36:
        title: "Bibimbap" # MT
        entrees: "Höyrytettyä riisiä, jonka päällä maustettuja kasviksia ja naudanlihaa (tai tofua), chilikastiketta (ja soijakastiketta, jos et pidä tulisesta) sekä paistettuja kananmunia" # MT
        side: "Pikkelssejä ja kimchiä" # MT
        kids: "Lapsille voi annostella enemmän nautaa tai tofua kuin kasviksia" # MT
        dessert: "Hedelmiä" # MT
        notes: "Kaikki on maustettu gluteenittomalla soijakastikkeella, valkosipulilla, seesamiöljyllä ja mustapippurilla. Ateria on enimmäkseen kasviksia, joten paljon lihaa ei kannata odottaa." # MT
      meal_37:
        title: "Kalkkunatacot" # MT
        entrees: "Tacoja kalkkunajauhelihasta" # MT
        side: "Papumuhennosta, riisiä" # MT
        notes: "Tacoihin tomaattia, jäävuorisalaattia, mietoa salsaa ja kermaviiliä." # MT
      meal_38:
        title: "Aamiaispizza" # MT
        entrees: "Maailman paras pizzapohja, tehty vain muutamasta raaka-aineesta, lähinnä maniokista. Nirsoimmatkin syöjät rakastavat sitä. Päällä pestotyylinen kastike ja valinnan mukaan lihaa, kasviksia ja juustoja. Kerro ruokavaliorajoitteistasi." # MT
        side: "Munakokkelia" # MT
      meal_39:
        title: "Keittobaari!" # MT
        entrees: "Yksinkertainen lihakeitto ja yksinkertainen kasviskeitto, ja paljon lisukkeita oman luomuksen tekemiseen: siemeniä, kasviksia, gluteenitonta pastaa, juustoa..." # MT
        side: "Kasviksia, juustoa, pastaa" # MT
        kids: "Lapset tykkäävät koota omansa" # MT
        dessert: "Ehkä jotain hedelmäistä" # MT
        notes: "Mahdollisimman paikallista ja luomua." # MT
      meal_40:
        title: "Lohi en papillote" # MT
        entrees: "Leivinpaperissa uunissa kypsennettyä lohta, maustettu sipulilla ja yrteillä" # MT
        side: "Valkosipulilla paistettuja lehtivihanneksia (pinaattia tai lehtikaalia) tai vihreitä papuja, uunissa paahdettuja uusia perunoita ja tuoretta leipää" # MT
        kids: "Kommentoi, jos lapsesi eivät syö lohta, ja ehdota jotain muuta, vaikka tonnikalasalaattia tai keitettyjä kananmunia." # MT
        dessert: "Kyllä: hedelmiä ja jotain leivottua" # MT
        notes: "Kaikki on gluteenitonta paitsi leivottu jälkiruoka. Kasvikset ovat enimmäkseen luomua. Kerro, jos tarvitset kasvisvaihtoehdon; voin paistaa wokissa tai uunissa vähän tofua." # MT
