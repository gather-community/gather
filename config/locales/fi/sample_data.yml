fi:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Mediahuone" # MT
        guidelines: |- # MT
          # Mediahuoneen ohjeet

          1. Alle 13-vuotiaiden on oltava aikuisen valvonnassa.
          1. K-16- ja K-18-ohjelmat on lukittu sekä televisiosta että digiboksista.
          1. Huoneen voi varata erityistapahtumia tai tv-ohjelmia varten. Katso kalenteri tai ota yhteyttä: media@example.com.
          1. Kaukosäätimet pysyvät aina huoneessa, niille varatulla paikalla.
          1. Siivoa mediahuone käytön jälkeen ja palauta se ”perustilaan”. Varo ruoanmuruja.
      multipurpose_room:
        name: "Monitoimihuone" # MT
        guidelines: |- # MT
          # Monitoimihuoneen ohjeet

          1. Kuten tapahtumaohjeissa sanotaan, jokaisella vieraalla on oltava isäntänä yhteisön aikuinen jäsen.
          1. Muista, että tämä huone on kuten kaikki yhteistalon tilat yhteistä omaisuutta.
          1. Isäntä kirjoittaa vieraansa nimen ja vierailun päivämäärät oven vieressä olevalle valkotaululle.
          1. Kaikkien vieraiden on noudatettava yhteistalon yleisiä ohjeita (ovessa) sekä jokaisen käyttämänsä huoneen ohjeita. Kiinnitä erityistä huomiota melua, hiljaisia tunteja ja tuoksutonta käytäntöämme koskeviin ohjeisiin.
          1. Ei kynttilöitä eikä mitään muutakaan, mikä voi aiheuttaa tulipalon tai muun vaaran. Yhteistalossa ei saa tupakoida.
          1. Huonetta käytetään muuhunkin, mutta yövieraat menevät edelle. Sovi päällekkäisistä varauksista suoraan toisen kanssa.
          1. Vieras voi yöpyä enintään 7 päivää, kunhan kukaan muu asukas ei ole varannut huonetta omalle vieraalleen.
          1. Isäntä vastaa vieraistaan. Kun vieraat lähtevät, isäntä siivoaa huoneen, pesee liinavaatteet ja lakanat ja tuo ne takaisin yhteistaloon.
          1. Huone luovutetaan klo 12 mennessä.
          1. Avaimet jätetään niille varattuun paikkaan yhteistalossa. Jos avaimet katoavat, uusista laskutetaan isäntää.
          1. Vieraat voivat käyttää yksityisyytensä turvaamiseksi huoneessa olevaa Älä häiritse -kylttiä.
      office:
        name: "Toimisto" # MT
      sitting_room:
        name: "Oleskeluhuone" # MT
      dining_room:
        name: "Ruokasali" # MT
        abbrv: "YT" # MT
      courtyard:
        name: "Piha" # MT
        abbrv: "Piha" # MT
      kitchen:
        name: "Keittiö" # MT
        abbrv: "YT" # MT
        guidelines: |- # MT
          # Keittiön ohjeet

          ## Yleistä

          Yhteistalon keittiö on yhteisöllemme iso investointi, ja se voi myös olla vaarallinen paikka. Koska tärkeintä meille on kaikkien yhteisön jäsenten ja laitteidemme turvallisuus, olemme sopineet seuraavista ohjeista.

          Odotamme, että jokainen yhteisön jäsen ja hänen vieraansa kohtelevat laitteita ja tilaa huolella ja kunnioittavasti.

          Vanhemmat opettavat lapsilleen, että:

          * Keittiö ei ole leikkipaikka.
          * Keittiön ruoka ei ole kenen tahansa syötävissä, ellei siinä lue niin.
          * Lapset saavat olla keittiössä vain, jos heidät on kutsuttu sinne ja vastuullinen aikuinen valvoo heitä.

          *Jätä keittiö siistimmäksi kuin se oli tullessasi.*

          Ja pidetään hauskaa, laitetaan ja syödään herkullista ruokaa yhdessä!

          ## Turvallisuus

          * Jos lähdet keittiöstä, kun jotain on uunissa tai liedellä, varoita muita laittamalla este keittiön oviaukkoihin ja jättämällä lapun.
          * Laita kattilat, joissa on kuumaa ruokaa, takalevyille eikä etulevyille.
          * Älä siirrä ruokasoodaa pois lieden luota. Se on siinä tulipalon varalta.
          * Älä koskaan jätä teräviä veitsiä vartioimatta tai laita niitä tiskiveteen.

          Jos joudut lähtemään ennen kuin olet siivonnut loppuun, jätä lappu, jossa kerrot, milloin palaat, ja puhelinnumerosi.

          Merkitse kaikki lainaamasi tavarat listaan ja palauta ne niin pian kuin voit.

          Ilmoita kaikesta oudosta, kuten oudoista äänistä, hajuista tai rikkinäisistä tavaroista, korjauksista vastaavalle.

          Yhteistalon jääkaappi on perustarvikkeille ja yhteisille aterioille. Jaa tähteet mieluummin muille kuin säilytä niitä täällä.

          Pääkokkien, apukokkien ja siivoojien tehtävät on kuvattu erikseen.

          ## Hygienian perusteet

          1. Jos saatat olla sairas, pidä yhteisö terveenä ja mene kotiin.
          1. Pese kädet usein, vanhaan malliin: saippualla ja kuumalla vedellä.
          1. Peitä kaikki haavat huolellisesti.
          1. Kun maistat, käytä kutakin lusikkaa vain kerran.
          1. Vältä ristikontaminaatiota (allergeenit ja bakteerit) käyttämällä eri välineitä eri ruoille.
          1. Kaikki, mikä on koskenut raakaa lihaa, pestään ja desinfioidaan ennen kuin sitä käytetään mihinkään muuhun.
          1. Käytä kullekin ruoalle oikean väristä leikkuulautaa.
          1. Altaissa voi olla bakteereja, joten pese raakana tarjottavat kasvikset siivilässä.
          1. Ruoka pysyy turvallisena, kun se on kunnolla jäähdytetty tai kunnolla kuumennettu.

          ## Perustarvikkeet

          Perustarvikkeet ostetaan yhteistalon aterioita varten.

          Perustarvikkeita ostaessamme mietimme, ovatko ne luomua, reilun kaupan tuotteita ja GMO-vapaita, sekä ruokavalioita, säilyvyyttä ja hintaa.

          Perustarvikkeet maksetaan yhteistalon aterioihin lisättävällä pienellä lisämaksulla, jolla ostetaan uusia. Pääkokkien odotetaan käyttävän perustarvikkeita, jolloin varasto pysyy tuoreena ja aterioiden kustannukset pieninä.

          Älä siis käytä perustarvikkeita omiin tarpeisiisi. Jos on aivan pakko:

          * Korvaa käyttämäsi tuote samanlaisella.
          * Jos et voi, lahjoita reilusti keittiön perustarvikekassaan.

          Jos huomaat, että jokin on loppumassa, kirjoita se tätä varten olevalle listalle.

          Keittiövastaava käy listan ja ruokakomeron läpi viikoittain ja tekee tarvittavat ostokset. Yritämme parhaamme mukaan täydentää perustarvikkeet sitä mukaa kuin ne loppuvat.

          Jos tarvitset perustarviketta yhteisen aterian valmistukseen ja huomaat sen puuttuvan, osta se ja toimita kuitti erikseen kulukorvausta varten.

          Ateriatoimikunta ylläpitää perustarvikkeiden listaa.

          Pääkokit ostavat kaiken muun, myös valmiit salaatinkastikkeet.
    shared_guidelines:
      common_house:
        name: "Yhteistalon ohjeet" # MT
        body: |- # MT
          # Yhteistalon ohjeet

          * Tervetuloa yhteistaloomme!
          * Yhteistalo on yhteisöelämämme keskus.
          * Yhteisömme rakentuu ihmisten välisille suhteille.
          * Jokaisella yhteisön jäsenellä on yhtä suuri sananvalta siihen, miten yhteistaloa käytämme.
          * Kohtelemme yhteistaloa yhtä kunnioittavasti kuin naapurin kotia. Jätä se sellaiseksi kuin se oli tullessasi, tai vielä paremmaksi!

          Nämä ohjeet tasapainottavat vapautta, vastuuta sekä ihmisten ja rakennuksen turvallisuutta.

          ## Esteettömyys

          Herkkyyksien huomioimiseksi sovimme seuraavaa:

          * *Tuoksuttomuus* on tavoitteemme yhteistalossa.
          * *Tupakointi:* yhteistalossa ei tupakoida.
          * *Eläimet:* yhteistaloon ei tuoda lemmikkejä, avustajakoiria lukuun ottamatta. Lemmikkejä ei saa jättää ilman valvontaa yhteistalon pihalle.

          ## Turvallisuus

          Yhteistalo lukitaan arki-iltaisin klo 22 ja perjantaisin ja lauantaisin klo 23 mennessä sulkemislistan mukaisesti.

          ## Viestintä

          Asukkaat ottavat huolensa puheeksi suoraan aina kun mahdollista. Tarvittaessa yhteistalotoimikunta auttaa.

          ## Huolto

          Ilmoita rikkinäisistä tai viallisista järjestelmistä tai laitteista heti huoltotoimikunnalle osoitteeseen maintenance@example.com.

          Tavallisissa asioissa lähetä sähköpostia tai jätä lappu huoltokansioon.

          Ilmoita rikkinäisistä tavaroista yhteistalotoimikunnalle osoitteeseen commonhouse@example.com.

          ## Alkoholi

          Älä jätä tai säilytä yhteistalossa alkoholia, avattua tai avaamatonta, äläkä lääkkeitä.

          ## Melu

          Jos yhteistalon melu häiritsee, voit aina pyytää hiljentämään. Ota huomioon muut, jotka sitä pyytävät.

          Yhteisölle kerrotaan etukäteen isoista tapahtumista, joissa voi olla tavallista äänekkäämpää tai jotka jatkuvat sulkemisajan yli.

          ## Hiljaiset tunnit

          * Arkisin klo 22–8
          * Viikonloppuisin ja pyhäpäivinä klo 23–9

          ## Kenelle yhteistalo on tarkoitettu

          Yhteistalo on asukkaille ja heidän kutsumilleen vieraille.

          * Olemme kiitollisia naapuriyhteisöjemme tuesta ja vieraanvaraisuudesta.
          * Kun toivotamme naapurimme tervetulleiksi, ratkomme mahdolliset ongelmat reilusti, vastavuoroisuuden ja luottamuksen pohjalta.

          Naapuriyhteisöjen jäsenet ovat tervetulleita yhteistaloon, ja he varaavat huoneita samalla tavalla kuin me. Muilla on oltava isäntänä aikuinen asukas, joka vastaa vieraidensa käytöksestä.

          ## Huoneiden varaaminen

          Yhteisön toiminta merkitään kalenteriin, ja se menee muiden tapahtumien edelle.

          Kaikki ohjeet hyväksytään yksimielisesti. Kaikkien ehdotukset ovat tervetulleita, kun jatkamme ohjeiden hiomista.
