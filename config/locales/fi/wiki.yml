        content: |- # MT
          Tämä on esimerkki wikisivusta.

          Valitse yltä **Muokkaa**, niin näet, miten tämä sivu toimii! Älä huoli, et voi rikkoa mitään!

          ## Muotoilu

          Wikisivua muokataan **Markdownilla**, joka on yksinkertainen tapa luoda siistiä ja hyvännäköistä sisältöä ilman, että tarvitsee opetella erityistä kieltä. Lisätietoja Markdownista on [Markdown-muotoiluoppaassa](/about/markdown).

          ## Linkit

          Linkit muille sivuille ovat hyvin tärkeitä! Voit linkittää muille **wikisivuille** näin: [[Hauska sivu]].

          Huomaa, että yllä oleva linkki on (luultavasti) punainen. Tämä johtuu siitä, ettei sivua ole vielä olemassa. Jos napsautat linkkiä, voit luoda sivun. Sen jälkeen linkki muuttuu siniseksi!

          Jos haluat käyttää linkin tekstinä jotain muuta kuin sivun otsikkoa, voit [[Hauska sivu|tehdä näin]].

          Linkit ulkoisille sivuille näyttävät [tältä](http://example.com).

          Pelkkänä tekstinä kirjoitettu URL tunnistetaan ja muutetaan linkiksi automaattisesti: https://gather.coop
