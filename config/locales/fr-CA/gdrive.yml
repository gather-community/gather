fr-CA:
  gdrive:
    config:
      guide:
        body: "Ce guide vous accompagne pour obtenir les identifiants nécessaires à la connexion du Google Workspace de votre communauté à Gather.\n\n## Prérequis\n\n* La communauté doit avoir souscrit à **Google Workspace**.\n    * La formule Business Starter suffit.\n    * Un seul compte utilisateur est nécessaire.\n    * Choisissez un nom de communauté pour le compte (par ex. workspace.admin@votredomaine.com) plutôt qu'un nom de personne (par ex. jean.dupont@votredomaine.com).\n* La personne qui suit ces instructions doit être connectée à Google avec un compte du Google Workspace de la communauté ayant les droits **Super administrateur**. Si vous n'avez qu'un compte, il a ces droits.\n\n## Configuration principale\n\n### Créer un projet\n\n1. Rendez-vous sur https://console.cloud.google.com\n2. Vérifiez que vous êtes connecté à Google avec le compte Super administrateur.\n3. Acceptez les conditions d'utilisation. Attendez quelques minutes que la ressource de votre organisation soit provisionnée.\n4. Rendez-vous sur https://console.cloud.google.com/projectcreate pour créer un projet.\n5. Nommez-le **Gather Main**.\n6. Sélectionnez l'organisation de votre domaine.\n7. Utilisez la valeur par défaut pour l'emplacement.\n\n### API activées\n\n1. Avec le nouveau projet sélectionné, rendez-vous sur https://console.cloud.google.com/ → menu principal → API et services → API et services activés\n2. Cliquez sur **Activer les API et les services**.\n3. Activez l'**API Google Drive**.\n\n### ID client OAuth\n\n1. Avec le nouveau projet sélectionné, rendez-vous sur https://console.cloud.google.com/ → menu principal → API et services → API et services activés → Identifiants.\n2. Cliquez sur **Créer des identifiants** → **ID client OAuth**\n3. Sélectionnez **Application Web**.\n4. Nom : **Drive OAuth Client ID**.\n5. Sous **Origines JavaScript autorisées**, ajoutez https://gather.coop.\n6. Sous **URI de redirection autorisés**, ajoutez https://gather.coop/gdrive/setup/auth/callback.\n7. Copiez l'ID client et le code secret en lieu sûr pour plus tard.\n    1. L'ID client devrait ressembler à `302773344240-7g2n5abcdef8es2cvpc0roj7t.apps.googleusercontent.com`\n    2. Le code secret du client devrait ressembler à `AIza73uyhc63ehd763ehesysqyhw-hei2asda_2rs`\n\n### Écran de consentement OAuth\n\n1. Avec le nouveau projet sélectionné, rendez-vous sur https://console.cloud.google.com/ → menu principal → API et services → Écran de consentement OAuth.\n2. Choisissez **Interne**.\n3. Nom de l'application : **Gather**.\n4. Adresse courriel d'assistance utilisateur : l'adresse courriel du compte Super administrateur.\n5. Pas de logo.\n6. Page d'accueil de l'application : https://gather.coop\n7. Règles de confidentialité : https://gather.coop/privacy-policy\n8. Domaines autorisés :\n    1. gather.coop\n9. Adresse courriel du développeur : support@gather.coop\n10. Champs d'application\n    1. auth/userinfo.email\n    2. auth/drive" # Machine translated, remove this comment when verified
    migration:
      request:
        mobile_warning:
          switch_html: "Si vous voulez passer sur un ordinateur, vous pouvez utiliser le même %{link} dans le courriel qui vous a amené ici." # Machine translated, remove this comment when verified
