fr-CA:
  groups:
    groups:
      form:
        non_members_html: "<strong>Non-membres</strong> : la fonction « non-membre » de Mailman permet 1) d'autoriser d'autres adresses à envoyer des courriels à la liste sans en recevoir et 2) d'interdire à certaines personnes d'écrire à la liste. Les non-membres ne reçoivent pas les courriels de la liste. Ils ne sont pas synchronisés depuis Gather, mais peuvent être ajoutés manuellement via le %{link}. Consultez la %{docs_link} pour en savoir plus." # Machine translated, remove this comment when verified
        subscription_policy_html: "<strong>Politique d'abonnement</strong> : les modérateurs devront autoriser manuellement tout nouvel abonnement. L'abonnement doit passer principalement par Gather. Les abonnements via le site Mailman ou par courriel devraient être rares." # Machine translated, remove this comment when verified
      show:
        additional_senders_note: "Ces expéditeurs supplémentaires peuvent écrire à la liste, mais n'en reçoivent pas les courriels." # Machine translated, remove this comment when verified
  domains:
    new:
      migrating: "Si vous migrez des adresses de transfert ou des listes de diffusion, assurez-vous qu'elles sont configurées dans Gather et prêtes à recevoir des courriels lorsque vous ferez pointer le domaine vers Gather." # Machine translated, remove this comment when verified
