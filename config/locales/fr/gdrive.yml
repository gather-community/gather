      guide:
        title: "Guide de configuration de Google Drive" # Machine translated, remove this comment when verified
        body: |- # Machine translated, remove this comment when verified
          Ce guide vous accompagne pour obtenir les identifiants nécessaires à la connexion du Google Workspace de votre communauté à Gather.

          ## Prérequis

          * La communauté doit avoir souscrit à **Google Workspace**.
              * La formule Business Starter suffit.
              * Un seul compte utilisateur est nécessaire.
              * Choisissez un nom de communauté pour le compte (par ex. workspace.admin@votredomaine.com) plutôt qu'un nom de personne (par ex. jean.dupont@votredomaine.com).
          * La personne qui suit ces instructions doit être connectée à Google avec un compte du Google Workspace de la communauté ayant les droits **Super administrateur**. Si vous n'avez qu'un compte, il a ces droits.

          ## Configuration principale

          ### Créer un projet

          1. Rendez-vous sur https://console.cloud.google.com
          2. Vérifiez que vous êtes connecté à Google avec le compte Super administrateur.
          3. Acceptez les conditions d'utilisation. Attendez quelques minutes que la ressource de votre organisation soit provisionnée.
          4. Rendez-vous sur https://console.cloud.google.com/projectcreate pour créer un projet.
          5. Nommez-le **Gather Main**.
          6. Sélectionnez l'organisation de votre domaine.
          7. Utilisez la valeur par défaut pour l'emplacement.

          ### API activées

          1. Avec le nouveau projet sélectionné, rendez-vous sur https://console.cloud.google.com/ → menu principal → API et services → API et services activés
          2. Cliquez sur **Activer les API et les services**.
          3. Activez l'**API Google Drive**.

          ### ID client OAuth

          1. Avec le nouveau projet sélectionné, rendez-vous sur https://console.cloud.google.com/ → menu principal → API et services → API et services activés → Identifiants.
          2. Cliquez sur **Créer des identifiants** → **ID client OAuth**
          3. Sélectionnez **Application Web**.
          4. Nom : **Drive OAuth Client ID**.
          5. Sous **Origines JavaScript autorisées**, ajoutez https://gather.coop.
          6. Sous **URI de redirection autorisés**, ajoutez https://gather.coop/gdrive/setup/auth/callback.
          7. Copiez l'ID client et le code secret en lieu sûr pour plus tard.
              1. L'ID client devrait ressembler à `302773344240-7g2n5abcdef8es2cvpc0roj7t.apps.googleusercontent.com`
              2. Le code secret du client devrait ressembler à `AIza73uyhc63ehd763ehesysqyhw-hei2asda_2rs`

          ### Écran de consentement OAuth

          1. Avec le nouveau projet sélectionné, rendez-vous sur https://console.cloud.google.com/ → menu principal → API et services → Écran de consentement OAuth.
          2. Choisissez **Interne**.
          3. Nom de l'application : **Gather**.
          4. Adresse e-mail d'assistance utilisateur : l'adresse e-mail du compte Super administrateur.
          5. Pas de logo.
          6. Page d'accueil de l'application : https://gather.coop
          7. Règles de confidentialité : https://gather.coop/privacy-policy
          8. Domaines autorisés :
              1. gather.coop
          9. Adresse e-mail du développeur : support@gather.coop
          10. Champs d'application
              1. auth/userinfo.email
              2. auth/drive
