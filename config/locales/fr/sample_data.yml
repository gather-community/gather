        title: "Cuisine allemande traditionnelle" # MT
        entrees: "Bratwurst, nouilles aux œufs et gratin de pommes de terre" # MT
        side: "Chou rouge, choucroute, raifort et crème fraîche" # MT
        kids: "À décider" # MT
        dessert: "Strudel aux pommes et glace" # MT
      meal_27:
        title: "Soirée barbecue" # MT
        entrees: "Les classiques du barbecue, avec une touche coréenne. J'espère que mes aides auront de bonnes idées." # MT
        side: "Légumes légèrement sautés, du marché ou de nos jardins" # MT
        kids: "Les enfants seront peut-être mis au travail au jardin" # MT
        dessert: "Des fraises fraîches, si c'est la saison" # MT
        notes: "Le plus bio et local possible. Facile de s'adapter à tous les régimes." # MT
      meal_28:
        title: "Pizza maison !" # MT
        entrees: "Pizza avec plein de garnitures : poulet, légumes, fromage, pepperoni. Pâte classique ou sans gluten." # MT
        side: "Salade et fruits" # MT
        kids: "Les enfants adorent ça" # MT
        dessert: "Peut-être..." # MT
        notes: "Indiquez ci-dessous si vous avez besoin de sans gluten, pour que je puisse m'organiser. Merci ! Ingrédients bio et locaux quand c'est possible." # MT
      meal_29:
        title: "Dégustation de tomates" # MT
        entrees: "Un assortiment de tomates locales, avec des options volaille et végétariennes" # MT
        side: "Salade caprese, plein de légumes, épis de maïs" # MT
        kids: "Maïs égrené pour les enfants qui ont un appareil dentaire" # MT
        dessert: "Glace à la tomate ?" # MT
        notes: "Local et bio quand c'est possible. Le repas peut être sans allergènes (mais pas sans tomates). Il y aura des fruits à coque (amandes et noisettes)." # MT
      meal_30:
        title: "Chili et repas partagé de desserts aux pommes !" # MT
        entrees: "Le chili comme je l'ai connu enfant : haricots doux et légumes sur du riz. Bœuf haché pour les carnivores." # MT
        side: "Légumes cuits, selon ce qu'on trouve localement" # MT
        kids: "Le plat principal est assez doux pour tout le monde" # MT
        dessert: "C'est notre repas partagé annuel de desserts aux pommes ! Venez cueillir des pommes avec nous le week-end d'avant, puis apportez ce que vous aurez préparé avec ces magnifiques pommes." # MT
        notes: "Il y a des produits laitiers à part, mais pas dans le plat principal. Les desserts sont faits par différentes personnes, donc ils peuvent contenir n'importe quel allergène courant." # MT
      meal_31:
        title: "Crêpes sucrées et salées" # MT
        entrees: "Des crêpes avec plein de garnitures, salées pour le dîner et sucrées pour le dessert" # MT
        side: "Légumes vapeur" # MT
        dessert: "Encore des crêpes !" # MT
        notes: "Œufs de poules élevées en plein air, lait local, farine bio. Si vous voulez des crêpes sans gluten, dites-le-moi et j'essaierai." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Riz, légumes assaisonnés, bœuf, et œuf ou saumon fumé, roulés dans une feuille d'algue" # MT
        side: "Kimchi de radis en saumure" # MT
        kids: "Le plat principal devrait leur convenir" # MT
        dessert: "Fruits ou glace" # MT
        notes: "Nous avons mis le kimchi de radis à fermenter il y a deux semaines. Il y aura des bocaux à rapporter chez vous après le repas." # MT
      meal_33:
        title: "Soupe de pois cassés au curry et sandwichs" # MT
        entrees: "Soupe de pois cassés au curry avec bouillon de poulet, jambon et lait, et une version végane avec bouillon de légumes et lait de coco" # MT
        side: "Sandwichs au thon et aux œufs, ou apportez votre propre garniture pour le pain" # MT
        kids: "Pareil. Envoyez-moi un e-mail avant jeudi si vos enfants veulent de la soupe sans curry." # MT
        dessert: "Cookies maison aux pépites de chocolat, et fruits" # MT
        notes: "La soupe est sans gluten, et la soupe aux légumes est aussi sans lait. Si vous voulez du pain sans gluten ou d'autres changements, envoyez-moi un e-mail avant jeudi." # MT
      meal_34:
        title: "Crêpes et bonnes choses à mettre dedans" # MT
        entrees: "Crêpes (œuf, farine, lait). Fines et souples, un peu comme les crêpes suédoises." # MT
        side: "Garnitures sucrées et salées : sucre, confiture maison de fraises et de myrtilles, sauce caramel au beurre salé, chantilly, fromage, et sans doute des champignons sautés. Apportez les vôtres si vous voulez quelque chose de particulier." # MT
        kids: "Pareil" # MT
        dessert: "Pareil" # MT
        notes: "Sans doute pas tout bio, mais je ferai de mon mieux avec le budget." # MT
      meal_35:
        title: "Soirée pain de viande" # MT
        entrees: "Pain de viande" # MT
        side: "Salade, petits pains, pommes de terre" # MT
        dessert: "Crumble aux pommes" # MT
      meal_36:
        title: "Bibimbap" # MT
        entrees: "Riz vapeur garni de légumes assaisonnés et de bœuf (ou de tofu), avec de la sauce pimentée (et de la sauce soja si vous n'aimez pas épicé), et des œufs au plat" # MT
        side: "Pickles et kimchi" # MT
        kids: "Ils peuvent avoir plus de bœuf ou de tofu que de légumes" # MT
        dessert: "Fruits" # MT
        notes: "Tout est assaisonné avec de la sauce soja sans gluten, de l'ail, de l'huile de sésame et du poivre noir. Ce repas, c'est surtout des légumes, alors ne vous attendez pas à beaucoup de viande." # MT
      meal_37:
        title: "Tacos à la dinde" # MT
        entrees: "Tacos à la dinde hachée" # MT
        side: "Haricots refrits, riz" # MT
        notes: "Tomates, laitue, salsa douce et crème fraîche pour les tacos." # MT
      meal_38:
        title: "Pizza du petit-déj" # MT
        entrees: "La meilleure pâte à pizza du monde, avec juste quelques ingrédients, surtout du manioc. Même les plus difficiles l'adorent. Avec une sauce façon pesto et un choix de viandes, de légumes et de fromages. Indiquez vos restrictions alimentaires." # MT
        side: "Œufs brouillés" # MT
      meal_39:
        title: "Bar à soupes !" # MT
        entrees: "Une soupe simple à la viande et une soupe simple aux légumes, avec plein de garnitures pour faire votre propre création : graines, légumes, pâtes sans gluten, fromage..." # MT
        side: "Légumes, fromage, pâtes" # MT
        kids: "Les enfants vont adorer composer la leur" # MT
        dessert: "Peut-être quelque chose aux fruits" # MT
        notes: "Le plus local et bio possible." # MT
      meal_40:
        title: "Saumon en papillote" # MT
        entrees: "Saumon cuit en papillote, assaisonné d'oignon et d'herbes" # MT
        side: "Légumes verts (épinards ou chou kale) ou haricots verts sautés à l'ail, pommes de terre nouvelles rôties et pain frais" # MT
        kids: "Mettez un commentaire si vos enfants ne mangent pas de saumon et proposez autre chose, comme une salade de thon ou des œufs durs." # MT
        dessert: "Oui : des fruits et une pâtisserie maison" # MT
        notes: "Tout est sans gluten sauf la pâtisserie. Les légumes seront surtout bio. Dites-moi s'il vous faut une option végétarienne ; je peux faire sauter ou cuire du tofu au four." # MT
