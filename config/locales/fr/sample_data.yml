fr:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Salle multimédia" # MT
        guidelines: |- # MT
          # Consignes de la salle multimédia

          1. Les moins de 13 ans doivent être accompagnés d'un adulte.
          1. Les programmes déconseillés aux moins de 16 ans sont verrouillés sur la télé et sur le décodeur.
          1. La salle peut être réservée pour des événements particuliers ou des émissions de télé. Consultez le calendrier ou écrivez à media@example.com.
          1. Les télécommandes restent toujours dans la salle, à leur place.
          1. Merci de ranger la salle multimédia et de la remettre dans son état « neutre » après usage. Attention aux miettes !
      multipurpose_room:
        name: "Salle polyvalente" # MT
        guidelines: |- # MT
          # Consignes de la salle polyvalente

          1. Comme le précisent les consignes sur les événements, tout invité doit être accueilli par un membre adulte de la communauté.
          1. N'oubliez pas que cette salle, comme tous les espaces de la maison commune, est une ressource partagée.
          1. Les hôtes inscrivent le nom de leur invité et ses dates de séjour sur le tableau blanc à côté de la porte.
          1. Tous les invités respectent les consignes générales de la maison commune (affichées sur la porte) ainsi que celles de chaque salle qu'ils utilisent. Faites particulièrement attention aux consignes sur le bruit, les heures de calme et notre politique sans parfum.
          1. Pas de bougies ni de quoi que ce soit qui pourrait provoquer un incendie ou un autre danger. Interdiction de fumer dans la maison commune.
          1. La salle sert aussi à d'autres usages, mais les invités qui dorment sur place sont prioritaires. Réglez les conflits de réservation directement entre vous.
          1. Les invités peuvent rester jusqu'à 7 jours, tant qu'un autre résident n'a pas réservé la salle pour un autre invité.
          1. Les hôtes sont responsables de leurs invités. Après leur départ, les hôtes nettoient la salle, lavent le linge et les draps, et les rapportent à la maison commune.
          1. Le départ se fait avant midi.
          1. Les clés sont déposées à un endroit prévu dans la maison commune. En cas de perte, les nouvelles clés sont facturées à l'hôte.
          1. Les invités peuvent utiliser le panneau « Ne pas déranger » prévu pour préserver leur intimité.
      office:
        name: "Bureau" # MT
      sitting_room:
        name: "Salon" # MT
      dining_room:
        name: "Salle à manger" # MT
        abbrv: "MC" # MT
      courtyard:
        name: "Cour" # MT
        abbrv: "Cour" # MT
      kitchen:
        name: "Cuisine" # MT
        abbrv: "MC" # MT
        guidelines: |- # MT
          # Consignes de la cuisine

          ## Présentation

          La cuisine de la maison commune représente un gros investissement pour notre communauté, et elle peut aussi être un endroit dangereux. Comme notre priorité est la sécurité de tous les membres de la communauté et de notre matériel, nous avons adopté les consignes suivantes.

          Nous attendons de chaque membre de la communauté et de ses invités qu'ils traitent ce matériel et cet espace avec soin et respect.

          Les parents sont responsables d'apprendre à leurs enfants que :

          * La cuisine n'est pas un terrain de jeu.
          * La nourriture de la cuisine n'est pas à la disposition de tous, sauf si c'est indiqué.
          * Les enfants ne peuvent entrer dans la cuisine que s'ils y sont invités et surveillés par un adulte responsable.

          *Merci de laisser la cuisine plus propre que vous ne l'avez trouvée.*

          Et amusons-nous à préparer et à manger de bons plats ensemble !

          ## Sécurité

          * Si vous quittez la cuisine alors que quelque chose est au four ou sur le feu, prévenez les autres en barrant les entrées de la cuisine et en laissant un mot.
          * Mettez les casseroles de plats chauds sur les feux du fond, pas sur ceux de devant.
          * Ne déplacez pas le bicarbonate de soude qui est près de la cuisinière. Il est là en cas d'incendie.
          * Ne laissez jamais de couteaux tranchants sans surveillance et ne les mettez pas dans l'eau savonneuse.

          Si vous devez partir avant d'avoir fini de ranger, laissez un mot indiquant quand vous reviendrez, avec votre numéro de téléphone.

          Notez tout ce que vous empruntez et rapportez-le dès que possible.

          Signalez tout ce qui vous semble anormal (bruits ou odeurs bizarres, objets cassés) à la personne chargée des réparations.

          Le réfrigérateur de la maison commune est réservé aux produits de base et aux repas communautaires. Partagez les restes plutôt que de les stocker ici.

          Les tâches des chefs cuisiniers, des aides-cuisiniers et de l'équipe de nettoyage sont décrites à part.

          ## Hygiène de base

          1. Si vous êtes peut-être malade, préservez la santé de la communauté en rentrant chez vous.
          1. Lavez-vous souvent les mains, à l'ancienne : à l'eau chaude et au savon.
          1. Couvrez complètement toute coupure.
          1. Pour goûter, n'utilisez chaque cuillère qu'une seule fois.
          1. Évitez la contamination croisée (allergènes et bactéries) en utilisant des ustensiles différents pour chaque aliment.
          1. Tout ce qui a touché de la viande crue doit être lavé et désinfecté avant de servir à autre chose.
          1. Utilisez la planche à découper de la bonne couleur pour chaque type d'aliment.
          1. Les éviers peuvent abriter des bactéries : utilisez une passoire pour laver les fruits et légumes servis crus.
          1. Les aliments restent sains s'ils sont bien froids ou bien chauds.

          ## Produits de base

          Les produits de base sont achetés pour les repas de la maison commune.

          Quand nous achetons des produits de base, nous regardons s'ils sont bio, issus du commerce équitable et sans OGM, et nous tenons compte des préférences alimentaires, de la durée de conservation et du prix.

          Les produits de base sont financés par un supplément sur les repas de la maison commune, qui sert à renouveler le stock. Les chefs cuisiniers sont invités à utiliser les produits de base, ce qui garde le stock frais et réduit le coût de leurs repas.

          Merci donc de ne pas utiliser les produits de base pour un usage personnel. Si vraiment vous devez le faire :

          * Remplacez ce que vous utilisez, produit pour produit.
          * Sinon, contribuez généreusement à la caisse des produits de base de la cuisine.

          Si vous remarquez qu'un produit commence à manquer, notez-le sur la feuille prévue à cet effet.

          La personne qui coordonne la cuisine vérifie la liste et le garde-manger chaque semaine et fait les courses si besoin. Nous faisons de notre mieux pour remplacer les produits de base dès qu'ils sont épuisés.

          S'il vous manque un produit de base pour préparer un repas communautaire, achetez-le et présentez un ticket de caisse séparé pour être remboursé.

          Le comité repas tient la liste des produits de base.

          Les chefs cuisiniers achètent tout le reste, y compris les vinaigrettes en bouteille.
    shared_guidelines:
      common_house:
        name: "Consignes de la maison commune" # MT
        body: |- # MT
          # Consignes de la maison commune

          * Bienvenue dans notre maison commune !
          * Notre maison commune est le cœur de la vie de notre communauté.
          * Notre communauté repose sur les liens entre ses membres.
          * Chaque membre de la communauté a son mot à dire, à égalité, sur l'usage de la maison commune.
          * Nous traitons la maison commune avec autant de respect que la maison d'un voisin. Merci de la laisser comme vous l'avez trouvée, ou mieux !

          Ces consignes équilibrent la liberté, la responsabilité et la sécurité des personnes et du bâtiment.

          ## Accessibilité

          Pour respecter les sensibilités de chacun, nous convenons de ce qui suit :

          * *Sans parfum*, c'est l'objectif dans la maison commune.
          * *Tabac :* il est interdit de fumer dans la maison commune.
          * *Animaux :* les animaux de compagnie ne sont pas admis dans la maison commune, sauf les animaux d'assistance. Ils ne doivent pas être laissés seuls aux abords de la maison commune.

          ## Sécurité

          La maison commune est fermée à clé au plus tard à 22 h en semaine et à 23 h les vendredis et samedis, en suivant la liste de fermeture.

          ## Communication

          Les résidents règlent leurs différends directement entre eux dès que possible. Si besoin, le comité de la maison commune est là pour aider.

          ## Entretien

          Signalez tout de suite les installations ou appareils cassés ou défectueux au comité d'entretien, à maintenance@example.com.

          Pour les questions courantes, envoyez un e-mail ou laissez un mot dans le classeur de l'entretien.

          Signalez les objets cassés au comité de la maison commune à commonhouse@example.com.

          ## Alcool

          Ne laissez et ne stockez pas d'alcool, ouvert ou non, ni de médicaments dans la maison commune.

          ## Bruit

          Toute personne gênée par le bruit dans la maison commune peut demander qu'on le baisse. Merci d'être attentif aux personnes qui le demandent.

          La communauté est prévenue à l'avance des grands événements qui risquent d'être plus bruyants que d'habitude ou de dépasser l'heure de fermeture.

          ## Heures de calme

          * En semaine, de 22 h à 8 h
          * Le week-end et les jours fériés, de 23 h à 9 h

          ## À qui s'adresse la maison commune

          La maison commune est destinée aux résidents et à leurs invités.

          * Nous sommes reconnaissants du soutien et de l'hospitalité des communautés voisines.
          * En accueillant nos voisins, nous comptons régler les éventuels problèmes de façon équitable, dans la réciprocité et la confiance.

          Les membres des communautés voisines sont les bienvenus dans la maison commune et suivent les mêmes procédures pour réserver les salles. Toute autre personne doit être accueillie par un résident adulte, qui est responsable du comportement de ses invités.

          ## Réservation des salles

          Les activités de la communauté sont inscrites au calendrier et ont la priorité sur les autres événements.

          Toutes les consignes sont adoptées par consensus. Les avis de chacun sont les bienvenus pour continuer à les améliorer.
