        title: "Page d'exemple" # MT
        content: |- # MT
          Ceci est une page wiki d'exemple.

          Cliquez sur **Modifier** ci-dessus pour voir comment cette page fonctionne ! Et pas d'inquiétude, vous ne pouvez rien casser !

          ## Mise en forme

          Pour modifier une page wiki, on utilise **Markdown**, une façon simple de créer un contenu propre et soigné sans apprendre de langage particulier. Pour en savoir plus sur Markdown, consultez le [Guide de mise en forme Markdown](/about/markdown).

          ## Liens

          Les liens vers d'autres pages sont très importants ! Vous pouvez créer un lien vers d'autres **pages wiki** comme ceci : [[Page amusante]].

          Notez que le lien ci-dessus est (probablement) rouge. C'est parce que la page n'existe pas encore. Si vous cliquez sur le lien, vous pourrez créer la page. Le lien deviendra alors bleu !

          Si vous voulez utiliser un autre texte que le titre de la page pour le lien, vous pouvez [[Page amusante|faire ceci]].

          Les liens vers des pages externes ressemblent [à ceci](http://example.com).

          Une URL en texte brut sera automatiquement reconnue et convertie en lien : https://gather.coop
