    # Templates that Mailman fetches for list emails. $listname and similar are Mailman placeholders,
    # which must be kept as is.
    mailman:
      templates:
        footer:
          list_name: "$listname, una lista email di un gruppo Gather" # MT
          unsubscribe: "Per annullare l'iscrizione, visita la pagina del gruppo e lascialo o disattiva l'iscrizione." # MT
        list_admin_action_post:
          body: |- # MT
            In qualità di amministratore della lista, ti chiediamo di
            autorizzare il seguente messaggio alla mailing list:

                Lista:   $listname
                Da:      $sender_email
                Oggetto: $subject

            Il messaggio è trattenuto perché:

            $reasons

            Quando ti è comodo, visita la tua dashboard per approvare o
            respingere la richiesta.
