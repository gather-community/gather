      stop_impersonating: "Smetti di impersonare" # MT
      home: "Home" # MT
      skip_to_content: "Vai al contenuto" # MT
      show_menu: "Mostra menu" # MT
      toggle_navigation: "Mostra/nascondi navigazione" # MT
      loading: "Caricamento" # MT
      add_to_home_screen: "Aggiungi Gather alla schermata Home" # MT
    footer:
      privacy_policy: "Informativa sulla privacy" # MT
      credits: "Riconoscimenti" # MT
      settings: "Impostazioni" # MT
      subscription: "Abbonamento" # MT
      billing: "Fatturazione" # MT
      communities: "Comunità" # MT
      resync_subscriptions: "Risincronizza abbonamenti" # MT
      domains: "Domini" # MT
      # Shown on pages in machine-translated locales (Gather::Locales::MACHINE_TRANSLATED).
      machine_translated: "Questa pagina è stata tradotta automaticamente e potrebbe contenere errori." # MT
      machine_translated_with_link_html: "Questa pagina è stata tradotta automaticamente e potrebbe contenere errori. %{link}" # MT
