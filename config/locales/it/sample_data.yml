      meal_27:
        title: "Serata barbecue" # MT
        entrees: "Grigliata dei grandi classici con un tocco coreano. Spero che chi mi aiuta in cucina abbia qualche buona idea." # MT
        side: "Verdure saltate leggermente, dal mercato contadino o dai nostri orti" # MT
        kids: "I bambini potrebbero finire a lavorare nell'orto" # MT
        dessert: "Fragole fresche, se è stagione" # MT
        notes: "Il più possibile bio e locale. Facile adattarlo a qualsiasi dieta." # MT
      meal_28:
        title: "Pizza fatta in casa!" # MT
        entrees: "Pizza con tanti condimenti: pollo, verdure, formaggio, salamino piccante. Impasto normale e senza glutine." # MT
        side: "Insalata e frutta" # MT
        kids: "Ai bambini queste cose piacciono" # MT
        dessert: "Forse..." # MT
        notes: "Scrivi qui sotto se ti serve senza glutine, così mi organizzo. Grazie! Ingredienti bio e locali quando possibile." # MT
      meal_29:
        title: "Degustazione di pomodori" # MT
        entrees: "Un assaggio di pomodori della zona, con opzioni con pollame e vegetariane" # MT
        side: "Caprese, tante verdure, pannocchie" # MT
        kids: "Mais sgranato per i bambini con l'apparecchio" # MT
        dessert: "Gelato al pomodoro?" # MT
        notes: "Locale e bio quando possibile. Il pasto si può fare senza allergeni (ma non senza pomodori). Ci sarà frutta a guscio (mandorle e nocciole)." # MT
      meal_30:
        title: "Chili e dolci di mele portati da tutti!" # MT
        entrees: "Il chili della mia infanzia: fagioli e verdure poco piccanti sul riso. Carne macinata di manzo per chi mangia carne." # MT
        side: "Verdure cotte, a seconda di cosa offre la zona" # MT
        kids: "Il piatto principale è abbastanza delicato per tutti" # MT
        dessert: "È la nostra festa annuale dei dolci di mele, dove ognuno porta qualcosa! Vieni a raccogliere le mele con noi il fine settimana prima, poi porta quello che prepari con quelle mele stupende." # MT
        notes: "I latticini sono disponibili a parte, ma nel piatto principale non ce ne sono. I dolci li preparano persone diverse, quindi possono contenere qualsiasi allergene comune." # MT
      meal_31:
        title: "Crêpes dolci e salate" # MT
        entrees: "Crêpes con tanti ripieni, salate per cena e dolci per dessert" # MT
        side: "Verdure al vapore" # MT
        dessert: "Altre crêpes!" # MT
        notes: "Uova di galline allevate all'aperto, latte locale, farina bio. Se vuoi crêpes senza glutine, fammelo sapere e ci provo." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Riso, verdure condite, manzo e uova o salmone affumicato, arrotolati nell'alga" # MT
        side: "Kimchi d'acqua al ravanello" # MT
        kids: "Il piatto principale dovrebbe andare bene anche per loro" # MT
        dessert: "Frutta o gelato" # MT
        notes: "Abbiamo messo a fermentare il kimchi d'acqua al ravanello due settimane fa. Dopo il pasto ci saranno dei barattoli da portare a casa." # MT
      meal_33:
        title: "Zuppa di piselli spezzati al curry e panini" # MT
        entrees: "Zuppa di piselli spezzati al curry con brodo di pollo, prosciutto e latte, e una versione vegana con brodo vegetale e latte di cocco" # MT
        side: "Panini con insalata di tonno e uova, oppure porta tu cosa mettere nel pane" # MT
        kids: "Idem. Mandami un'email prima di giovedì se i tuoi figli vogliono la zuppa senza curry." # MT
        dessert: "Biscotti fatti in casa con gocce di cioccolato, e frutta" # MT
        notes: "La zuppa è senza glutine, e quella vegetale è anche senza latticini. Se vuoi pane senza glutine o altre modifiche, mandami un'email prima di giovedì." # MT
      meal_34:
        title: "Crêpes e tante cose buone per farcirle" # MT
        entrees: "Crêpes (uova, farina, latte). In realtà più simili ai pancake svedesi: sottili e morbide." # MT
        side: "Ripieni dolci e salati: zucchero, marmellata di fragole e di mirtilli fatta in casa, salsa al caramello salato, panna montata, formaggio e probabilmente funghi trifolati. Se vuoi qualcosa in particolare, portalo tu." # MT
        kids: "Idem" # MT
        dessert: "Idem" # MT
        notes: "Probabilmente non sarà tutto bio, ma farò del mio meglio con il budget a disposizione." # MT
      meal_35:
        title: "Cena con polpettone" # MT
        entrees: "Polpettone" # MT
        side: "Insalata, focaccine, patate" # MT
        dessert: "Crumble di mele" # MT
      meal_36:
        title: "Bibimbap" # MT
        entrees: "Riso al vapore con sopra verdure condite e manzo (o tofu), salsa di peperoncino (e salsa di soia per chi non ama il piccante) e uova all'occhio di bue" # MT
        side: "Sottaceti e kimchi" # MT
        kids: "Possono avere più manzo o tofu che verdure" # MT
        dessert: "Frutta" # MT
        notes: "È tutto condito con salsa di soia senza glutine, aglio, olio di sesamo e pepe nero. È un piatto soprattutto di verdure, quindi non aspettarti molta carne." # MT
      meal_37:
        title: "Tacos di tacchino" # MT
        entrees: "Tacos con carne macinata di tacchino" # MT
        side: "Fagioli refritos, riso" # MT
        notes: "Per i tacos: pomodori, lattuga, salsa delicata e panna acida." # MT
      meal_38:
        title: "Pizza da colazione" # MT
        entrees: "La miglior base per pizza di sempre, fatta con pochi ingredienti, soprattutto manioca. Piace anche ai più schizzinosi. Con una salsa tipo pesto e carni, verdure e formaggi a scelta. Indica eventuali restrizioni alimentari." # MT
        side: "Uova strapazzate" # MT
      meal_39:
        title: "Buffet di zuppe!" # MT
        entrees: "Una zuppa semplice di carne e una semplice di verdure, più tantissimi condimenti per creare la tua: semi, verdure, pasta senza glutine, formaggio..." # MT
        side: "Verdure, formaggio, pasta" # MT
        kids: "I bambini si divertiranno a comporre la loro" # MT
        dessert: "Forse qualcosa alla frutta" # MT
        notes: "Il più possibile locale e bio." # MT
      meal_40:
        title: "Salmone al cartoccio" # MT
        entrees: "Salmone cotto al cartoccio, insaporito con cipolla ed erbe aromatiche" # MT
        side: "Verdure a foglia (spinaci o cavolo riccio) o fagiolini saltati con aglio, patate novelle arrosto e pane fresco" # MT
        kids: "Se i tuoi figli non mangiano il salmone, scrivilo nei commenti e suggerisci un'alternativa, come insalata di tonno o uova sode." # MT
        dessert: "Sì: frutta e un dolce da forno" # MT
        notes: "È tutto senza glutine tranne il dolce da forno. Le verdure saranno per lo più bio. Fammi sapere se ti serve un'opzione vegetariana: posso saltare in padella o cuocere al forno un po' di tofu." # MT
