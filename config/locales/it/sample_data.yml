# MACHINE TRANSLATIONS
#
# A line ending in "# MT" was translated automatically and hasn't been checked by a person yet.
#
# - If you check a line and it's right, or you correct it, delete the "# MT" from the end of the line.
# - If the English for a key changes, its translation here gets rewritten and marked "# MT" again.
# - For a multi-line value, the "# MT" is on the line with the key, after the "|-".
#
# To see how much of a language is left to check: grep -c "# MT" config/locales/<locale>/*.yml
# See "Translations" in CLAUDE.md for the rest.
# ======================================================================================================
it:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Sala multimediale" # MT
        guidelines: |- # MT
          # Regole della sala multimediale

          1. I minori di 13 anni devono essere accompagnati da un adulto.
          1. I programmi vietati ai minori di 14 anni sono bloccati sia sulla TV sia sul decoder.
          1. La sala si può prenotare per eventi speciali o programmi TV. Consulta il calendario o scrivi a media@example.com.
          1. I telecomandi devono restare sempre nella sala, al loro posto.
          1. Dopo l'uso, riordina la sala multimediale e rimettila com'era. Attenzione alle briciole.
      multipurpose_room:
        name: "Sala polivalente" # MT
        guidelines: |- # MT
          # Regole della sala polivalente

          1. Come previsto dalle regole sugli eventi, ogni ospite deve essere invitato da un membro adulto della comunità.
          1. Ricorda che questa sala, come tutti gli spazi della casa comune, è una risorsa condivisa.
          1. Chi ospita deve scrivere il nome dell'ospite e le date del soggiorno sulla lavagna fuori dalla porta.
          1. Tutti gli ospiti devono rispettare le regole generali della casa comune (affisse sulla porta) e quelle di ogni sala che usano. Fai particolare attenzione alle regole su rumore, ore di silenzio e divieto di profumi.
          1. Niente candele né altro che possa provocare un incendio o altri pericoli. È vietato fumare nella casa comune.
          1. La sala si usa anche per altro, ma gli ospiti che pernottano hanno la precedenza. Eventuali sovrapposizioni si risolvono parlandone direttamente tra le persone interessate.
          1. Gli ospiti possono fermarsi fino a 7 giorni, purché un altro residente non abbia già prenotato la sala per un altro ospite.
          1. Chi ospita è responsabile dei propri ospiti. Dopo la loro partenza, pulisce la sala, lava biancheria e lenzuola e le riporta nella casa comune.
          1. La sala va lasciata entro mezzogiorno.
          1. Le chiavi si lasciano in un posto apposito nella casa comune. Se vanno perse, chi ospita paga quelle nuove.
          1. Per la loro privacy, gli ospiti possono usare il cartello «Non disturbare» a disposizione.
      office:
        name: "Ufficio" # MT
      sitting_room:
        name: "Salotto" # MT
      dining_room:
        name: "Sala da pranzo" # MT
        abbrv: "CC" # MT
      courtyard:
        name: "Cortile" # MT
        abbrv: "Cort" # MT
      kitchen:
        name: "Cucina" # MT
        abbrv: "CC" # MT
        guidelines: |- # MT
          # Regole della cucina

          ## Introduzione

          La cucina della casa comune è un grande investimento per la nostra comunità, e può anche essere un luogo pericoloso. Poiché la nostra priorità è la sicurezza di tutte le persone della comunità e delle nostre attrezzature, ci siamo dati le regole che seguono.

          Ci aspettiamo che ogni membro della comunità e i suoi ospiti trattino queste attrezzature e questo spazio con cura e rispetto.

          I genitori devono insegnare ai propri figli che:

          * La cucina non è un posto per giocare.
          * Il cibo in cucina non si mangia, a meno che non sia indicato chiaramente.
          * I bambini possono stare in cucina solo se sono invitati e sorvegliati da un adulto responsabile.

          *Lascia la cucina più pulita di come l'hai trovata.*

          E divertiamoci a cucinare e a mangiare insieme cose buone!

          ## Sicurezza

          * Se esci dalla cucina mentre qualcosa è in forno o sul fornello, avvisa gli altri mettendo una barriera agli ingressi della cucina e lasciando un biglietto.
          * Metti le pentole con cibo caldo sui fornelli posteriori, non su quelli davanti.
          * Non spostare il bicarbonato dal fornello. Sta lì in caso di incendio.
          * Non lasciare mai coltelli affilati incustoditi e non metterli nell'acqua insaponata.

          Se devi andartene prima di aver finito di pulire, lascia un biglietto con l'ora in cui torni e il tuo numero di telefono.

          Annota tutto quello che prendi in prestito e restituiscilo il prima possibile.

          Segnala qualsiasi cosa strana, come rumori o odori insoliti o oggetti rotti, a chi si occupa delle riparazioni.

          Il frigorifero della casa comune è per gli alimenti di base e i pasti della comunità. Gli avanzi, invece di lasciarli qui, dividili tra chi li vuole.

          I compiti di capocuoco, aiuto cuoco e pulizie sono descritti a parte.

          ## Igiene di base

          1. Se pensi di essere malato, proteggi la salute della comunità e resta a casa.
          1. Lavati spesso le mani, alla vecchia maniera: con acqua calda e sapone.
          1. Copri bene tutti i tagli.
          1. Quando assaggi, usa ogni cucchiaio una volta sola.
          1. Evita la contaminazione crociata (allergeni e batteri) usando utensili diversi per cibi diversi.
          1. Tutto ciò che tocca carne cruda va lavato e igienizzato prima di usarlo per altro.
          1. Usa il tagliere del colore giusto per ogni tipo di alimento.
          1. I lavelli possono ospitare batteri: per lavare frutta e verdura da servire crude, usa uno scolapasta.
          1. Il cibo resta sicuro se è ben refrigerato o ben riscaldato.

          ## Alimenti di base

          Gli alimenti di base si comprano per i pasti della casa comune.

          Quando li compriamo teniamo conto di biologico, commercio equo e assenza di OGM, oltre che delle preferenze alimentari, della conservazione e del costo.

          Gli alimenti di base si pagano con un piccolo supplemento sui pasti della casa comune, che serve a ricomprarli. Ci si aspetta che i capocuochi li usino: così le scorte restano fresche e il costo dei loro pasti resta basso.

          Quindi non usare gli alimenti di base per uso personale. Se proprio devi:

          * Rimpiazza quello che usi, articolo per articolo.
          * Se non puoi, contribuisci generosamente al fondo per gli alimenti di base.

          Se vedi che qualcosa sta finendo, scrivilo sulla cartellina che teniamo apposta.

          Chi coordina la cucina controlla ogni settimana la lista e la dispensa e fa la spesa quando serve. Facciamo del nostro meglio per ricomprare gli alimenti di base man mano che finiscono.

          Se ti serve un alimento di base per cucinare un pasto della comunità e scopri che manca, compralo e presenta uno scontrino separato per il rimborso.

          La commissione pasti tiene la lista degli alimenti di base.

          Tutto il resto lo comprano i capocuochi, compresi i condimenti per insalata già pronti.
    shared_guidelines:
      common_house:
        name: "Regole della casa comune" # MT
        body: |- # MT
          # Regole della casa comune

          * Benvenuto nella nostra casa comune!
          * La nostra casa comune è il cuore della vita della comunità.
          * La nostra comunità si fonda sulle relazioni.
          * Ogni membro della comunità ha la stessa voce in capitolo su come usiamo la casa comune.
          * Trattiamo la casa comune con lo stesso rispetto che avremmo per la casa di un vicino. Lasciala come l'hai trovata, o meglio!

          Queste regole cercano un equilibrio tra libertà, responsabilità e sicurezza delle persone e dell'edificio.

          ## Accessibilità

          Per rispettare le sensibilità di tutti, ci impegniamo a quanto segue:

          * *Senza profumi* è l'obiettivo nella casa comune.
          * *Fumo:* nella casa comune non si fuma.
          * *Animali:* nella casa comune non sono ammessi animali, tranne quelli di assistenza. Gli animali non vanno lasciati incustoditi negli spazi esterni della casa comune.

          ## Sicurezza

          La casa comune si chiude entro le 22:00 nei giorni feriali ed entro le 23:00 il venerdì e il sabato, seguendo la lista di controllo per la chiusura.

          ## Comunicazione

          Quando è possibile, i residenti affrontano i problemi direttamente tra loro. Se serve, la commissione casa comune è disponibile ad aiutare.

          ## Manutenzione

          Segnala subito alla commissione manutenzione impianti o elettrodomestici rotti o difettosi, scrivendo a maintenance@example.com.

          Per le questioni ordinarie, manda un'email o lascia un biglietto nella cartella della manutenzione.

          Segnala gli oggetti rotti alla commissione casa comune scrivendo a commonhouse@example.com.

          ## Alcol

          Non lasciare né conservare nella casa comune alcolici, aperti o chiusi, né medicinali.

          ## Rumore

          Chiunque sia disturbato dal rumore nella casa comune può chiedere di abbassare il volume. Se te lo chiedono, sii rispettoso degli altri.

          La comunità verrà avvisata in anticipo dei grandi eventi che potrebbero essere più rumorosi del solito o andare oltre l'orario di chiusura.

          ## Ore di silenzio

          * Giorni feriali, dalle 22:00 alle 8:00
          * Fine settimana e festivi, dalle 23:00 alle 9:00

          ## Per chi è la casa comune

          La casa comune è per i residenti e i loro ospiti.

          * Siamo grati per il sostegno e l'ospitalità delle comunità vicine.
          * Accogliendo i nostri vicini, ci impegniamo a risolvere eventuali problemi in modo equo, sulla base di reciprocità e fiducia.

          I membri delle comunità vicine sono i benvenuti nella casa comune e seguono le stesse procedure per prenotare le sale. Chiunque altro deve essere invitato da un residente adulto, che è responsabile del comportamento dei propri ospiti.

          ## Prenotare le sale

          Le attività della comunità vanno in calendario e hanno la precedenza sugli altri eventi.

          Tutte le regole sono approvate per consenso. I contributi di tutti sono benvenuti mentre continuiamo a migliorarle.
