          Questa è una pagina wiki di esempio.

          Fai clic su **Modifica** qui sopra per vedere come funziona questa pagina! E non preoccuparti, non puoi rompere niente!

          ## Formattazione

          Per modificare una pagina wiki si usa il **Markdown**, un modo semplice per creare contenuti puliti e gradevoli senza dover imparare un linguaggio speciale. Per saperne di più sul Markdown, consulta la [Guida alla formattazione Markdown](/about/markdown).

          ## Link

          I link ad altre pagine sono molto importanti! Puoi creare un link ad altre **pagine wiki** così: [[Pagina divertente]].

          Nota che il link qui sopra è (probabilmente) rosso. Questo perché la pagina non esiste ancora. Se fai clic sul link, potrai creare la pagina. A quel punto il link diventerà blu!

          Se come testo del link vuoi usare qualcosa di diverso dal titolo della pagina, puoi [[Pagina divertente|fare così]].

          I link a pagine esterne appaiono [così](http://example.com).

          Un URL in testo semplice viene riconosciuto automaticamente e trasformato in link: https://gather.coop
