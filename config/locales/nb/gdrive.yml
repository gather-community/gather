      guide:
        title: "Oppsettsveiledning for Google Drive" # MT
        # Markdown, rendered with Gather's Markdown renderer. Google's menu and button names are in quotes
        # or bold so they can be matched to Google's own (translated) interface.
        body: |- # MT
          Denne veiledningen tar deg gjennom hvordan du skaffer påloggingsinformasjonen som trengs for å koble fellesskapets Google Workspace til Gather.

          ## Forutsetninger

          * Fellesskapet må ha registrert seg for **Google Workspace**.
              * Abonnementet Business Starter er nok.
              * Det trengs bare én brukerkonto.
              * Velg et navn for fellesskapet til kontoen (f.eks. workspace.admin@dittdomene.no) i stedet for et personnavn (f.eks. ola.nordmann@dittdomene.no).
          * Den som følger disse instruksjonene, må være logget inn hos Google som en bruker i fellesskapets Google Workspace med rettigheter som **superadministrator**. Hvis dere bare har én konto, har den kontoen rettigheter som superadministrator.

          ## Hovedoppsett

          ### Opprette et prosjekt

          1. Gå til https://console.cloud.google.com
          2. Kontroller at du er logget inn hos Google som brukeren med rettigheter som superadministrator.
          3. Godta vilkårene. Vent noen minutter mens organisasjonsressursen din klargjøres.
          4. Gå til https://console.cloud.google.com/projectcreate for å opprette et prosjekt.
          5. Gi det navnet **Gather Main**.
          6. Velg organisasjonen for domenet ditt.
          7. Bruk standardverdien for plassering.

          ### Aktiverte API-er

          1. Med det nye prosjektet valgt går du til https://console.cloud.google.com/ → hamburgermenyen → **API-er og tjenester** → **Aktiverte API-er og tjenester**
          2. Klikk på **Aktiver API-er og tjenester**.
          3. Aktiver **Google Drive API**.

          ### OAuth-klient-ID

          1. Med det nye prosjektet valgt går du til https://console.cloud.google.com/ → hamburgermenyen → **API-er og tjenester** → **Aktiverte API-er og tjenester** → **Legitimasjon**.
          2. Klikk på **Opprett legitimasjon** → **OAuth-klient-ID**
          3. Velg **Nettapplikasjon**.
          4. Navn: **Drive OAuth Client ID**.
          5. Under **Autoriserte JavaScript-opphav** legger du til https://gather.coop.
          6. Under **Autoriserte viderekoblings-URI-er** legger du til https://gather.coop/gdrive/setup/auth/callback.
          7. Kopier klient-ID-en og klienthemmeligheten til et trygt sted, og ta vare på dem til senere.
              1. Klient-ID-en skal se omtrent slik ut: `302773344240-7g2n5abcdef8es2cvpc0roj7t.apps.googleusercontent.com`
              2. Klienthemmeligheten skal se omtrent slik ut: `AIza73uyhc63ehd763ehesysqyhw-hei2asda_2rs`

          ### OAuth-samtykkeskjerm

          1. Med det nye prosjektet valgt går du til https://console.cloud.google.com/ → hamburgermenyen → **API-er og tjenester** → **OAuth-samtykkeskjerm**.
          2. Velg **Intern**.
          3. Appnavn: **Gather**.
          4. E-postadresse for brukerstøtte: e-postadressen til brukeren med rettigheter som superadministrator.
          5. Ingen logo.
          6. Startside for appen: https://gather.coop
          7. Personvernerklæring: https://gather.coop/privacy-policy
          8. Autoriserte domener:
              1. gather.coop
          9. E-postadresse til utvikleren: support@gather.coop
          10. Tilgangsområder
              1. auth/userinfo.email
              2. auth/drive
