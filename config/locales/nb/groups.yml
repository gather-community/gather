    # Templates that Mailman fetches for list emails. $listname and similar are Mailman placeholders,
    # which must be kept as is.
    mailman:
      templates:
        footer:
          list_name: "$listname, en e-postliste for en gruppe i Gather" # MT
          unsubscribe: "For å melde deg av, gå til gruppesiden og forlat gruppen eller velg den bort." # MT
        list_admin_action_post:
          body: |- # MT
            Som listeadministrator blir du bedt om å godkjenne følgende
            innlegg til e-postlisten:

                Liste:   $listname
                Fra:     $sender_email
                Emne:    $subject

            Meldingen holdes tilbake fordi:

            $reasons

            Når det passer deg, gå til kontrollpanelet ditt for å godkjenne
            eller avvise forespørselen.
