          Vanlig lenketekst blir gjenkjent automatisk: https://gather.coop
        images: |- # MT
          Du kan vise bilder slik:

          ![Kattunge](https://gather.coop/sample-image.png)
        rule: |- # MT
          Du kan bruke en vannrett linje for å dele opp innholdet:

          ---

          fint!
        # Not named html or *_html: Rails treats such keys as already-safe HTML, so the
        # tags in this example would render instead of being shown as typed.
        raw_markup: |- # MT
          Hvis du er en erfaren bruker og vil bruke HTML direkte, prøv det!

          For eksempel <blockquote>vil du kanskje bruke blokksitater</blockquote>.
