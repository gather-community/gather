      examples:
        formatting: "Du kan enkelt lage enkel formatering som **fet**, _kursiv_ og ~~gjennomstreking~~." # MT
        lists: |- # MT
          Du kan også lage

          * punkt-
          * lister
              * med
              * innrykkede
              * underlister

          og

          1. nummererte
          2. lister
        headers: |- # MT
          # Overskrifter
          ## Er
          ### Enkle

          også!
        tables: |- # MT
          | Du  | Kan    |
          |------|--------|
          | til og med lage pene | tabeller |
          | Wow! | Så kult! |
