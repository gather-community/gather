        dessert: "Eplestrudel med iskrem" # MT
      meal_27:
        title: "Grillkveld" # MT
        entrees: "Grillfavoritter med et koreansk preg. Jeg håper kjøkkenhjelperne mine har noen gode ideer." # MT
        side: "Lett stekte grønnsaker fra bondens marked eller fra hagene våre" # MT
        kids: "Barna kan bli satt i arbeid i hagen" # MT
        dessert: "Ferske jordbær, hvis det er sesong" # MT
        notes: "Så økologisk og lokalt som mulig. Lett å tilpasse til alle dietter." # MT
      meal_28:
        title: "Hjemmelaget pizza!" # MT
        entrees: "Pizza med masse forskjellig fyll: kylling, grønnsaker, ost, pepperoni. Vanlig og glutenfri bunn." # MT
        side: "Salat og frukt" # MT
        kids: "Barn liker sånt" # MT
        dessert: "Kanskje ..." # MT
        notes: "Skriv nedenfor hvis du trenger glutenfritt, så jeg kan planlegge. Takk! Økologiske og lokale råvarer når det går." # MT
      meal_29:
        title: "Tomatsmaking" # MT
        entrees: "Smaksprøver av lokale tomater, med fjærkre og vegetaralternativer" # MT
        side: "Caprese, masse grønnsaker, maiskolber" # MT
        kids: "Mais skåret av kolben for barn med tannregulering" # MT
        dessert: "Tomatis?" # MT
        notes: "Lokalt og økologisk når det går. Måltidet kan lages uten allergener (men ikke uten tomat). Det blir nøtter (mandler og hasselnøtter)." # MT
      meal_30:
        title: "Chili og spleiselag med eplekaker!" # MT
        entrees: "Chili slik jeg vokste opp med den: milde bønner og grønnsaker over ris. Kjøttdeig til kjøttetere." # MT
        side: "Kokte grønnsaker, alt etter hva som finnes lokalt" # MT
        kids: "Hovedretten er mild nok for alle" # MT
        dessert: "Det er det årlige spleiselaget vårt med eplekaker og andre eplegodsaker! Bli med og plukk epler helgen før, og ta med det du lager av de nydelige eplene." # MT
        notes: "Det finnes melkeprodukter ved siden av, men det er ingen i hovedretten. Dessertene er laget av forskjellige folk, så de kan inneholde alle de vanlige allergenene." # MT
      meal_31:
        title: "Søte og salte crêpes" # MT
        entrees: "Crêpes med masse forskjellig fyll, salt til middag og søtt til dessert" # MT
        side: "Dampede grønnsaker" # MT
        dessert: "Mer crêpes!" # MT
        notes: "Egg fra frittgående høner, lokal melk, økologisk mel. Vil du ha glutenfrie crêpes, si fra, så skal jeg prøve." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Ris, krydrede grønnsaker, storfekjøtt og egg eller røkelaks, rullet i tang" # MT
        side: "Vannkimchi med reddik" # MT
        kids: "Hovedretten bør passe for dem" # MT
        dessert: "Frukt eller iskrem" # MT
        notes: "Vi begynte å fermentere vannkimchien med reddik for to uker siden. Det blir glass du kan ta med hjem etter måltidet." # MT
      meal_33:
        title: "Gul ertesuppe med curry og smørbrød" # MT
        entrees: "Gul ertesuppe med curry, kyllingbuljong, skinke og melk, og en vegansk variant med grønnsaksbuljong og kokosmelk" # MT
        side: "Smørbrød med tunfisk og eggesalat, eller ta med ditt eget pålegg" # MT
        kids: "Det samme. Send meg en e-post før torsdag hvis barna dine vil ha suppe uten curry." # MT
        dessert: "Hjemmelagde cookies med sjokoladebiter, og frukt" # MT
        notes: "Suppen er glutenfri, og grønnsakssuppen er melkefri også. Vil du ha glutenfritt brød eller andre endringer, send meg en e-post før torsdag." # MT
      meal_34:
        title: "Crêpes og mye godt å fylle dem med" # MT
        entrees: "Crêpes (egg, mel, melk). Egentlig mer som vanlige norske pannekaker: tynne og myke." # MT
        side: "Søtt og salt fyll: sukker, hjemmelaget jordbær- og blåbærsyltetøy, saltkaramellsaus, krem, ost og sannsynligvis stekt sopp. Ta med ditt eget hvis du vil ha noe spesielt." # MT
        kids: "Det samme" # MT
        dessert: "Det samme" # MT
        notes: "Sikkert ikke alt økologisk, men jeg gjør mitt beste innenfor budsjettet." # MT
      meal_35:
        title: "Middag med kjøttpudding" # MT
        entrees: "Kjøttpudding" # MT
        side: "Salat, scones, poteter" # MT
        dessert: "Eplesmuldrepai" # MT
      meal_36:
        title: "Bibimbap" # MT
        entrees: "Dampet ris toppet med krydrede grønnsaker og storfekjøtt (eller tofu), med sterk chilisaus (og soyasaus hvis du ikke liker det sterkt), og speilegg" # MT
        side: "Syltede grønnsaker og kimchi" # MT
        kids: "De kan få mer kjøtt eller tofu enn grønnsaker" # MT
        dessert: "Frukt" # MT
        notes: "Alt er krydret med glutenfri soyasaus, hvitløk, sesamolje og sort pepper. Dette måltidet er mest grønnsaker, så ikke regn med mye kjøtt." # MT
      meal_37:
        title: "Kalkuntaco" # MT
        entrees: "Taco med kalkunkjøttdeig" # MT
        side: "Bønnemos, ris" # MT
        notes: "Tomat, salat, mild salsa og rømme til tacoen." # MT
      meal_38:
        title: "Frokostpizza" # MT
        entrees: "Tidenes beste pizzabunn, laget av bare noen få ingredienser, mest kassava. Selv de kresneste elsker den. Med en pestoaktig saus og valgfritt kjøtt, grønnsaker og ost. Skriv opp eventuelle kostbehov." # MT
        side: "Eggerøre" # MT
      meal_39:
        title: "Suppebar!" # MT
        entrees: "En enkel kjøttsuppe og en enkel grønnsakssuppe, pluss masse tilbehør så du kan lage din egen variant: frø, grønnsaker, glutenfri pasta, ost ..." # MT
        side: "Grønnsaker, ost, pasta" # MT
        kids: "Barna vil synes det er gøy å lage sin egen" # MT
        dessert: "Kanskje noe med frukt" # MT
        notes: "Så lokalt og økologisk som mulig." # MT
      meal_40:
        title: "Laks en papillote" # MT
        entrees: "Laks bakt i bakepapir, krydret med løk og urter" # MT
        side: "Bladgrønt (spinat eller grønnkål) eller grønne bønner stekt med hvitløk, ovnsbakte nypoteter og ferskt brød" # MT
        kids: "Skriv en kommentar hvis barna dine ikke spiser laks, og foreslå noe annet, som tunfisksalat eller hardkokte egg." # MT
        dessert: "Ja: frukt og noe bakt" # MT
        notes: "Alt er glutenfritt bortsett fra den bakte desserten. Grønnsakene blir stort sett økologiske. Si fra hvis du trenger et vegetaralternativ, så kan jeg wokke eller bake litt tofu." # MT
