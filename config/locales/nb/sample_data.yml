nb:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Medierom" # MT
        guidelines: |- # MT
          # Retningslinjer for medierommet

          1. Barn under 13 år må ha tilsyn av en voksen.
          1. Programmer med aldersgrense 15 år eller høyere er sperret både på TV-en og på TV-boksen.
          1. Rommet kan reserveres til spesielle arrangementer eller TV-programmer. Se kalenderen eller kontakt media@example.com.
          1. Fjernkontrollene skal alltid bli i rommet, på sin faste plass.
          1. Rydd medierommet og sett det tilbake i «nøytral stand» når du er ferdig. Pass på matsmuler.
      multipurpose_room:
        name: "Flerbruksrom" # MT
        guidelines: |- # MT
          # Retningslinjer for flerbruksrommet

          1. Som retningslinjene for arrangementer sier, må alle gjester ha en voksen vert som er medlem av fellesskapet.
          1. Husk at dette rommet, som resten av fellesbygget, er en felles ressurs.
          1. Verten skriver gjestens navn og datoene for oppholdet på tavla utenfor døra.
          1. Alle gjester må følge de generelle retningslinjene for fellesbygget (de henger på døra) og retningslinjene for hvert rom de bruker. Legg særlig merke til reglene om støy, stilletid og parfymefritt miljø.
          1. Ingen stearinlys eller annet som kan føre til brann eller annen fare. Røyking er ikke tillatt i fellesbygget.
          1. Rommet brukes også til andre ting, men overnattingsgjester går foran. Kollisjoner i timeplanen løser dere direkte med hverandre.
          1. Gjester kan bo her i opptil 7 dager, så lenge ingen annen beboer har reservert rommet til en annen gjest.
          1. Verten har ansvaret for gjestene sine. Når gjestene har reist, vasker verten rommet og sengetøyet og leverer det tilbake til fellesbygget.
          1. Utsjekking er kl. 12:00.
          1. Nøklene ligger på et fast sted i fellesbygget. Hvis nøklene blir borte, må verten betale for nye.
          1. Gjestene kan bruke «Ikke forstyrr»-skiltet hvis de vil ha det privat.
      office:
        name: "Kontor" # MT
      sitting_room:
        name: "Peisestue" # MT
      dining_room:
        name: "Spisesal" # MT
        abbrv: "FB" # MT
      courtyard:
        name: "Tunet" # MT
        abbrv: "Tun" # MT
      kitchen:
        name: "Kjøkken" # MT
        abbrv: "FB" # MT
        guidelines: |- # MT
          # Retningslinjer for kjøkkenet

          ## Oversikt

          Kjøkkenet i fellesbygget er en stor investering for fellesskapet vårt, og det kan også være et farlig sted. Fordi sikkerheten til alle i fellesskapet, og til utstyret vårt, kommer først, har vi disse retningslinjene.

          Vi forventer at alle medlemmer og gjestene deres behandler utstyret og rommet med omtanke og respekt.

          Foreldre har ansvar for å lære barna sine at:

          * Kjøkkenet er ikke en lekeplass.
          * Maten på kjøkkenet er ikke til fri forsyning, med mindre det står på den.
          * Barn kan bare være på kjøkkenet hvis de er invitert inn og har tilsyn av en ansvarlig voksen.

          *Etterlat kjøkkenet renere enn du fant det.*

          Og la oss ha det gøy, og lage og spise god mat sammen!

          ## Sikkerhet

          * Hvis du går fra kjøkkenet mens noe står i ovnen eller på platen, må du advare andre ved å sperre inngangene til kjøkkenet og legge igjen en lapp.
          * Sett gryter med varm mat på de bakre platene, ikke de fremre.
          * Ikke flytt natronet bort fra komfyren. Det står der i tilfelle brann.
          * La aldri skarpe kniver ligge uten tilsyn, og legg dem aldri i oppvaskvannet.

          Hvis du må gå før du er ferdig med å rydde, legg igjen en lapp om når du kommer tilbake, med telefonnummeret ditt.

          Skriv deg opp for alt du låner, og lever det tilbake så snart du kan.

          Si fra om alt som virker rart, som merkelige lyder, lukter eller ting som er ødelagt, til den som har ansvar for reparasjoner.

          Kjøleskapet i fellesbygget er for basisvarer og fellesmåltider. Del ut rester i stedet for å oppbevare dem her.

          Oppgavene til hovedkokker, kjøkkenhjelpere og oppvaskere er beskrevet for seg.

          ## Grunnleggende hygiene

          1. Hvis du kanskje er syk, hold fellesskapet friskt ved å gå hjem.
          1. Vask hendene ofte, på gamlemåten: med såpe og varmt vann.
          1. Dekk til alle kutt helt.
          1. Når du smaker på maten, bruk hver skje bare én gang.
          1. Unngå krysskontaminering (allergener og bakterier) ved å bruke forskjellige redskaper til forskjellig mat.
          1. Alt som har vært i kontakt med rått kjøtt, må vaskes og desinfiseres før det brukes til noe annet.
          1. Bruk skjærebrett med riktig farge til hver type mat.
          1. Det kan være bakterier i vasken, så bruk et dørslag når du skyller grønnsaker og frukt som skal serveres rå.
          1. Maten holder seg trygg når den er skikkelig nedkjølt eller skikkelig gjennomvarm.

          ## Basisvarer

          Basisvarer kjøpes inn til måltidene i fellesbygget.

          Når vi kjøper basisvarer, tenker vi på om de er økologiske, Fairtrade og fri for GMO, og på kosthensyn, holdbarhet og pris.

          Basisvarene betales med et tillegg på måltidene i fellesbygget, som går til nye innkjøp. Hovedkokkene skal bruke basisvarene, slik at lageret holdes ferskt og måltidene deres blir billigere.

          Ikke bruk basisvarene til privat bruk. Hvis du virkelig må:

          * Erstatt det du bruker, vare for vare.
          * Hvis du ikke kan det, gi et raust bidrag til kjøkkenets basisvarekasse.

          Hvis du ser at vi begynner å gå tom for noe, skriv det på lista på skriveplata som henger der for det.

          Kjøkkenansvarlig går gjennom lista og spiskammeret hver uke og handler det som trengs. Vi gjør vårt beste for å fylle på basisvarene når de tar slutt.

          Hvis du trenger en basisvare til et fellesmåltid og ser at den mangler, kjøp den og lever en egen kvittering for refusjon.

          Måltidskomiteen har oversikten over basisvarene.

          Hovedkokkene kjøper alt annet, også ferdig salatdressing.
    shared_guidelines:
      common_house:
        name: "Retningslinjer for fellesbygget" # MT
        body: |- # MT
          # Retningslinjer for fellesbygget

          * Velkommen til fellesbygget vårt!
          * Fellesbygget er midtpunktet i livet i fellesskapet vårt.
          * Fellesskapet vårt er bygget på relasjoner.
          * Alle medlemmer har like mye å si om hvordan vi bruker fellesbygget.
          * Vi behandler fellesbygget like respektfullt som vi ville behandlet en nabos hus. Forlat det slik du fant det, eller enda bedre!

          Disse retningslinjene skaper en balanse mellom frihet, ansvar og sikkerhet for både mennesker og bygning.

          ## Tilgjengelighet

          Av hensyn til de som er ekstra følsomme, er vi enige om følgende:

          * *Parfymefritt* er målet i fellesbygget.
          * *Røyking:* det er ikke lov å røyke i fellesbygget.
          * *Dyr:* fellesbygget er fritt for kjæledyr, med unntak av servicehunder og andre assistansedyr. Kjæledyr skal ikke være uten tilsyn på uteområdet rundt fellesbygget.

          ## Sikring

          Fellesbygget låses senest kl. 22:00 på hverdager og kl. 23:00 på fredager og lørdager, etter sjekklisten for stenging.

          ## Kommunikasjon

          Beboerne tar opp ting direkte med hverandre når det går an. Ved behov kan husutvalget hjelpe til.

          ## Vedlikehold

          Meld fra om ødelagte eller defekte anlegg eller apparater til vedlikeholdsgruppa med en gang, på maintenance@example.com.

          For vanlige saker kan du sende en e-post eller legge en lapp i vedlikeholdsmappa.

          Meld fra om ting som er ødelagt til husutvalget på commonhouse@example.com.

          ## Alkohol

          Ikke legg igjen eller oppbevar alkohol, åpnet eller uåpnet, eller medisiner i fellesbygget.

          ## Støy

          Alle som blir plaget av støy i fellesbygget, kan gjerne be om at det dempes. Vis hensyn når andre spør.

          Fellesskapet får beskjed på forhånd om store arrangementer som kan bli mer støyende enn vanlig eller vare utover stengetid.

          ## Stilletid

          * Hverdager, kl. 22:00 til 08:00
          * Helger og helligdager, kl. 23:00 til 09:00

          ## Hvem fellesbygget er for

          Fellesbygget er for beboerne og gjestene de inviterer.

          * Vi er takknemlige for støtten og gjestfriheten fra nabofellesskapene våre.
          * Når vi ønsker naboene våre velkommen, forventer vi å løse eventuelle problemer rettferdig, basert på gjensidighet og tillit.

          Medlemmer av nabofellesskapene er velkomne i fellesbygget og følger de samme rutinene for å reservere rom. Alle andre må ha en voksen beboer som vert, som har ansvaret for hvordan gjestene oppfører seg.

          ## Reservere rom

          Fellesskapets aktiviteter føres i kalenderen og går foran andre arrangementer.

          Alle retningslinjer vedtas ved konsensus. Alle innspill er velkomne mens vi fortsetter å forbedre dem.
