# ======================================================================================================
# MACHINE TRANSLATIONS
#
# A line ending in "# MT" was translated automatically and hasn't been checked by a person yet.
#
# - If you check a line and it's right, or you correct it, delete the "# MT" from the end of the line.
# - If the English for a key changes, its translation here gets rewritten and marked "# MT" again.
# - For a multi-line value, the "# MT" is on the line with the key, after the "|-".
#
# To see how much of a language is left to check: grep -c "# MT" config/locales/<locale>/*.yml
# See "Translations" in CLAUDE.md for the rest.
# ======================================================================================================
nb:
  search:
    # Title for a search result with neither a title nor a name.
    untitled: "(uten tittel)" # MT
    # Singular label shown under each search result, keyed by result kind (SearchHelper::KINDS).
    kinds:
      wiki_page: "Wiki" # MT
      event: "Hendelse" # MT
      calendar: "Kalender" # MT
      group: "Gruppe" # MT
      user: "Person" # MT
      household: "Husstand" # MT
      meal: "Måltid" # MT
      memorial: "Minneside" # MT
      emergency_contact: "Nødkontakt" # MT
      pet: "Kjæledyr" # MT
      vehicle: "Kjøretøy" # MT
      transaction: "Transaksjon" # MT
    # Facts shown after a result's kind label (SearchHelper#search_result_details), joined by separator.
    details:
      separator: " · " # MT
      household: "Husstand: %{name}" # MT
      head_cook: "Hovedkokk: %{name}" # MT
      updated_by: "Oppdatert %{date} av %{name}" # MT
      updated: "Oppdatert %{date}" # MT
      members:
