        sheet: "Google Regneark" # MT
        slide: "Google Presentasjoner" # MT
        folder: "Mappe" # MT
        pdf: "PDF" # MT
    # Result count when there are more results than are fetched, e.g. "200+".
    count_capped: "%{count}+" # MT
