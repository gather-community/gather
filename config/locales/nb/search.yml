        household: "Husstander" # MT
        meal: "Måltider" # MT
        memorial: "Minnesider" # MT
        emergency_contact: "Nødkontakter" # MT
        pet: "Kjæledyr" # MT
        vehicle: "Kjøretøy" # MT
