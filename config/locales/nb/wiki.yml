          Dette er en eksempelside i wikien.

          Klikk på **Rediger** ovenfor for å se hvordan denne siden fungerer! Og ikke vær redd, du kan ikke ødelegge noe!

          ## Formatering

          Wikisider redigeres med **Markdown**, en enkel måte å lage ryddig og pent innhold på uten å måtte lære et eget språk. Les mer om Markdown i [veiledningen til Markdown-formatering](/about/markdown).

          ## Lenker

          Lenker til andre sider er veldig viktige! Du kan lenke til andre **wikisider** slik: [[Morsom side]].

          Lenken ovenfor er (sannsynligvis) rød. Det er fordi siden ikke finnes ennå. Hvis du klikker på lenken, kan du opprette siden. Da blir lenken blå!

          Hvis du vil bruke noe annet enn sidetittelen som lenketekst, kan du [[Morsom side|gjøre det slik]].

          Lenker til eksterne sider ser ut [slik](http://example.com).

          En nettadresse i vanlig tekst blir gjenkjent og gjort om til en lenke automatisk: https://gather.coop
