      guide:
        title: "Configuratiehandleiding Google Drive" # MT
        # Markdown, rendered with Gather's Markdown renderer. Google's menu and button names are in quotes
        # or bold so they can be matched to Google's own (translated) interface.
        body: |- # MT
          Deze handleiding helpt je stap voor stap om de inloggegevens te krijgen die nodig zijn om de Google Workspace van je gemeenschap met Gather te verbinden.

          ## Vereisten

          * De gemeenschap moet zich hebben aangemeld voor **Google Workspace**.
              * Het abonnement Business Starter is voldoende.
              * Er is maar één gebruikersaccount nodig.
              * Kies voor het account een naam van de gemeenschap (bijv. workspace.admin@jouwdomein.nl) in plaats van een persoonlijke naam (bijv. jandevries@jouwdomein.nl).
          * Wie deze instructies volgt, moet bij Google zijn ingelogd als gebruiker in de Google Workspace van de gemeenschap met rechten van **superbeheerder**. Als je maar één account hebt, heeft dat account rechten van superbeheerder.

          ## Hoofdconfiguratie

          ### Een project maken

          1. Ga naar https://console.cloud.google.com
          2. Zorg dat je bij Google bent ingelogd als de gebruiker met rechten van superbeheerder.
          3. Accepteer de voorwaarden. Wacht een paar minuten tot de organisatieresource voor je is ingericht.
          4. Ga naar https://console.cloud.google.com/projectcreate om een project te maken.
          5. Noem het **Gather Main**.
          6. Kies de organisatie voor je domein.
          7. Gebruik de standaardwaarde voor de locatie.

          ### Ingeschakelde API’s

          1. Ga met het nieuwe project geselecteerd naar https://console.cloud.google.com/ → hamburgermenu → API’s en services → Ingeschakelde API’s en services
          2. Klik op **API’s en services inschakelen**.
          3. Schakel de **Google Drive API** in.

          ### OAuth-client-ID

          1. Ga met het nieuwe project geselecteerd naar https://console.cloud.google.com/ → hamburgermenu → API’s en services → Ingeschakelde API’s en services → Inloggegevens.
          2. Klik op **Inloggegevens maken** → **OAuth-client-ID**
          3. Kies **Webapplicatie**.
          4. Naam: **Drive OAuth Client ID**.
          5. Voeg onder **Geautoriseerde JavaScript-bronnen** https://gather.coop toe.
          6. Voeg onder **Geautoriseerde omleidings-URI’s** https://gather.coop/gdrive/setup/auth/callback toe.
          7. Kopieer de client-ID en het clientgeheim naar een veilige plek en bewaar ze voor later.
              1. De client-ID ziet er ongeveer zo uit: `302773344240-7g2n5abcdef8es2cvpc0roj7t.apps.googleusercontent.com`
              2. Het clientgeheim ziet er ongeveer zo uit: `AIza73uyhc63ehd763ehesysqyhw-hei2asda_2rs`

          ### OAuth-toestemmingsscherm

          1. Ga met het nieuwe project geselecteerd naar https://console.cloud.google.com/ → hamburgermenu → API’s en services → OAuth-toestemmingsscherm.
          2. Kies **Intern**.
          3. App-naam: **Gather**.
          4. E-mailadres voor gebruikersondersteuning: het e-mailadres van de gebruiker met rechten van superbeheerder.
          5. Geen logo.
          6. Startpagina van app: https://gather.coop
          7. Privacybeleid: https://gather.coop/privacy-policy
          8. Geautoriseerde domeinen:
              1. gather.coop
          9. Contactgegevens van ontwikkelaar: support@gather.coop
          10. Bereiken
              1. auth/userinfo.email
              2. auth/drive
