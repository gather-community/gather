          body: |- # MT
            Als beheerder van de lijst wordt je gevraagd het volgende bericht
            op de mailinglijst goed te keuren:

                Lijst:     $listname
                Van:       $sender_email
                Onderwerp: $subject

            Het bericht wordt tegengehouden omdat:

            $reasons

            Ga wanneer het je uitkomt naar je dashboard om het verzoek goed
            te keuren of af te wijzen.
