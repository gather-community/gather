        dessert: "Tomatenijs?" # MT
        notes: "Lokaal en biologisch als het kan. De maaltijd kan zonder allergenen (maar niet zonder tomaat). Er zitten noten in (amandelen en hazelnoten)." # MT
      meal_30:
        title: "Chili en appeltoetjes-potluck!" # MT
        entrees: "Chili zoals ik die van vroeger ken: milde bonen en groente op rijst. Rundergehakt voor de vleeseters." # MT
