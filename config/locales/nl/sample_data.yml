        title: "Traditioneel Duits eten" # MT
        entrees: "Braadworst, eiernoedels en aardappelovenschotel" # MT
        side: "Rodekool, zuurkool, mierikswortel en zure room" # MT
        kids: "Nog niet bekend" # MT
        dessert: "Appelstrudel met ijs" # MT
      meal_27:
        title: "Barbecueavond" # MT
        entrees: "Favorieten van de grill met een Koreaans tintje. Ik hoop dat mijn hulpkoks goede ideeën hebben." # MT
        side: "Licht gebakken groente van de boerenmarkt of uit onze tuinen" # MT
        kids: "Misschien zetten we de kinderen aan het werk in de tuin" # MT
        dessert: "Verse aardbeien, als het seizoen is" # MT
        notes: "Zo biologisch en lokaal mogelijk. Makkelijk aan te passen aan elk dieet." # MT
      meal_28:
        title: "Zelfgemaakte pizza!" # MT
        entrees: "Pizza met allerlei toppings: kip, groente, kaas, pepperoni. Gewone en glutenvrije bodems." # MT
        side: "Salade en fruit" # MT
        kids: "Kinderen zijn hier dol op" # MT
        dessert: "Misschien..." # MT
        notes: "Zet hieronder als je glutenvrij nodig hebt, dan kan ik daar rekening mee houden. Bedankt! Biologische en lokale ingrediënten als het kan." # MT
      meal_29:
        title: "Tomatenproeverij" # MT
        entrees: "Een proeverij van tomaten uit de buurt, met gevogelte en vegetarische opties" # MT
