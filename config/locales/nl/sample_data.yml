        kids: "Het hoofdgerecht is mild genoeg voor iedereen" # MT
        dessert: "Het is weer tijd voor onze jaarlijkse appeltoetjes-potluck! Ga het weekend ervoor mee appels plukken en neem dan mee wat je van die prachtige appels maakt." # MT
        notes: "Zuivel staat apart klaar, maar in het hoofdgerecht zit het niet. De toetjes worden door verschillende mensen gemaakt, dus daar kunnen alle bekende allergenen in zitten." # MT
      meal_31:
        title: "Zoete en hartige crêpes" # MT
        entrees: "Crêpes met veel verschillende vullingen, hartig als hoofdgerecht en zoet als toetje" # MT
        side: "Gestoomde groente" # MT
        dessert: "Nog meer crêpes!" # MT
        notes: "Scharreleieren, melk uit de buurt, biologische bloem. Wil je glutenvrije crêpes, laat het me weten, dan probeer ik het." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Rijst, gekruide groente, rundvlees, en ei of gerookte zalm, opgerold in zeewier" # MT
        side: "Waterkimchi van rettich" # MT
        kids: "Het hoofdgerecht zou voor hen ook goed moeten zijn" # MT
        dessert: "Fruit of ijs" # MT
        notes: "We zijn twee weken geleden begonnen met het fermenteren van de waterkimchi. Na de maaltijd zijn er potjes om mee naar huis te nemen." # MT
