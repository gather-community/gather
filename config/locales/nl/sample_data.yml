        kids: "Hetzelfde" # MT
        dessert: "Hetzelfde" # MT
        notes: "Waarschijnlijk niet alles biologisch, maar ik doe mijn best binnen het budget." # MT
      meal_35:
        title: "Gehaktbrood" # MT
        entrees: "Gehaktbrood" # MT
        side: "Salade, scones, aardappels" # MT
        dessert: "Appelcrumble" # MT
