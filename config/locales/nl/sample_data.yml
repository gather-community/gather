        notes: "Alles is op smaak gebracht met glutenvrije sojasaus, knoflook, sesamolie en zwarte peper. Deze maaltijd is vooral groente, dus verwacht niet veel vlees." # MT
      meal_37:
        title: "Taco’s met kalkoen" # MT
        entrees: "Taco’s met kalkoengehakt" # MT
        side: "Refried beans, rijst" # MT
        notes: "Tomaat, sla, milde salsa en zure room voor op de taco’s." # MT
      meal_38:
        title: "Ontbijtpizza" # MT
        entrees: "De beste pizzabodem ooit, van maar een paar ingrediënten, vooral cassave. Zelfs de lastigste eters vinden hem lekker. Met een soort pestosaus en keuze uit vlees, groente en kaas. Zet je dieetwensen erbij." # MT
        side: "Roerei" # MT
      meal_39:
        title: "Soepbuffet!" # MT
        entrees: "Een simpele soep met vlees en een simpele groentesoep, plus heel veel toppings om je eigen creatie te maken: zaden, groente, glutenvrije pasta, kaas..." # MT
        side: "Groente, kaas, pasta" # MT
        kids: "Kinderen vinden het leuk om hun eigen soep te maken" # MT
        dessert: "Misschien iets met fruit" # MT
        notes: "Zo lokaal en biologisch mogelijk." # MT
      meal_40:
        title: "Zalm en papillote" # MT
        entrees: "Zalm gegaard in bakpapier, op smaak gebracht met ui en kruiden" # MT
        side: "Bladgroente (spinazie of boerenkool) of sperziebonen gebakken met knoflook, geroosterde krieltjes, en vers brood" # MT
        kids: "Eten je kinderen geen zalm, zet dat dan in de opmerkingen en stel iets anders voor, zoals tonijnsalade of hardgekookte eieren." # MT
        dessert: "Ja: fruit en iets gebakkens" # MT
        notes: "Alles is glutenvrij behalve het gebakken toetje. De groente is grotendeels biologisch. Heb je een vegetarische optie nodig, laat het weten, dan wok of bak ik wat tofu." # MT
