nl:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Mediaruimte" # MT
        guidelines: |- # MT
          # Richtlijnen mediaruimte

          1. Kinderen onder de 13 moeten onder toezicht van een volwassene staan.
          1. Programma’s die niet geschikt zijn voor kinderen onder de 12 zijn vergrendeld, zowel op de tv als op de decoder.
          1. Je kunt de ruimte reserveren voor speciale gelegenheden of tv-programma’s. Kijk in de agenda of mail naar media@example.com.
          1. De afstandsbedieningen blijven altijd in de ruimte, op hun vaste plek.
          1. Ruim de mediaruimte na gebruik op en laat hem weer ‘neutraal’ achter. Let op kruimels.
      multipurpose_room:
        name: "Multifunctionele ruimte" # MT
        guidelines: |- # MT
          # Richtlijnen multifunctionele ruimte

          1. Zoals in de richtlijnen voor activiteiten staat, moet elke gast te gast zijn bij een volwassen lid van de gemeenschap.
          1. Denk eraan dat deze ruimte, net als het hele gemeenschapshuis, van ons allemaal is.
          1. Gastheren en gastvrouwen schrijven de naam van hun gast en de data van het verblijf op het whiteboard naast de deur.
          1. Alle gasten volgen de algemene richtlijnen van het gemeenschapshuis (die op de deur hangen) en de richtlijnen van elke ruimte die ze gebruiken. Let vooral op de richtlijnen over geluid, stilte-uren en ons geurvrije beleid.
          1. Geen kaarsen of iets anders dat brand of ander gevaar kan veroorzaken. Roken is niet toegestaan in het gemeenschapshuis.
          1. De ruimte wordt ook voor andere dingen gebruikt, maar logees hebben voorrang. Los planningsconflicten samen onderling op.
          1. Gasten mogen maximaal 7 dagen blijven, zolang een andere bewoner de ruimte niet voor een andere gast heeft gereserveerd.
          1. Je bent zelf verantwoordelijk voor je gasten. Als ze vertrokken zijn, maak je de kamer schoon, was je het beddengoed en de lakens en breng je die terug naar het gemeenschapshuis.
          1. Uitchecken om 12:00 uur.
          1. De sleutels liggen op een vaste plek in het gemeenschapshuis. Raak je ze kwijt, dan betaal je de nieuwe.
          1. Gasten kunnen voor hun privacy het bordje ‘Niet storen’ gebruiken.
      office:
        name: "Kantoor" # MT
      sitting_room:
        name: "Zitkamer" # MT
      dining_room:
        name: "Eetzaal" # MT
        abbrv: "GH" # MT
      courtyard:
        name: "Binnenplaats" # MT
        abbrv: "Binnpl" # MT
      kitchen:
        name: "Keuken" # MT
        abbrv: "GH" # MT
        guidelines: |- # MT
          # Richtlijnen keuken

          ## Overzicht

          De keuken van het gemeenschapshuis is een grote investering voor onze gemeenschap, en het kan er ook gevaarlijk zijn. De veiligheid van iedereen in onze gemeenschap, en van onze spullen, staat voorop. Daarom hebben we de volgende richtlijnen.

          We verwachten dat alle leden en hun gasten zorgvuldig en met respect omgaan met de keuken en alles wat erin staat.

          Ouders leren hun kinderen dat:

          * De keuken geen speelplek is.
          * Het eten in de keuken niet zomaar voor iedereen is, tenzij dat erop staat.
          * Kinderen alleen in de keuken mogen komen als ze zijn uitgenodigd en er een verantwoordelijke volwassene bij is.

          *Laat de keuken schoner achter dan je hem aantrof.*

          En laten we er vooral plezier in hebben, en samen lekker koken en eten!

          ## Veiligheid

          * Ga je de keuken uit terwijl er iets in de oven of op het vuur staat, waarschuw anderen dan door een afzetting voor de keukeningangen te zetten en een briefje achter te laten.
          * Zet pannen met heet eten op de achterste pitten, niet op de voorste.
          * Laat het zuiveringszout bij het fornuis staan. Het staat daar voor als er brand uitbreekt.
          * Laat scherpe messen nooit onbeheerd liggen en leg ze niet in het sop.

          Moet je weg voordat je klaar bent met opruimen, laat dan een briefje achter met wanneer je terugkomt en je telefoonnummer.

          Schrijf op wat je leent en breng het zo snel mogelijk terug.

          Meld vreemde dingen, zoals rare geluiden, geurtjes of kapotte spullen, bij degene die over reparaties gaat.

          De koelkast in het gemeenschapshuis is voor de basisvoorraad en de gemeenschappelijke maaltijden. Verdeel restjes liever onder elkaar dan ze hier te bewaren.

          De taken van hoofdkoks, hulpkoks en opruimers staan apart beschreven.

          ## Basishygiëne

          1. Denk je dat je ziek wordt, ga dan naar huis en houd de gemeenschap gezond.
          1. Was vaak je handen, op de ouderwetse manier: met zeep en warm water.
          1. Dek wondjes helemaal af.
          1. Gebruik bij het proeven elke lepel maar één keer.
          1. Voorkom kruisbesmetting (allergenen en bacteriën) door voor verschillende gerechten verschillend keukengerei te gebruiken.
          1. Alles wat met rauw vlees in aanraking komt, moet je afwassen en desinfecteren voordat je het ergens anders voor gebruikt.
          1. Gebruik voor elk soort eten de snijplank in de juiste kleur.
          1. In gootstenen kunnen bacteriën zitten, dus was groente en fruit dat rauw wordt opgediend in een vergiet.
          1. Eten blijft veilig als het goed gekoeld of goed verhit is.

          ## Basisvoorraad

          De basisvoorraad wordt gekocht voor de maaltijden in het gemeenschapshuis.

          Bij het inkopen letten we erop of iets biologisch, fairtrade en gentechvrij is, en houden we rekening met dieetwensen, houdbaarheid en kosten.

          De basisvoorraad wordt betaald uit een kleine toeslag op de maaltijden in het gemeenschapshuis, waarmee we nieuwe voorraad kopen. Hoofdkoks gebruiken de basisvoorraad. Zo blijft die vers en blijven hun maaltijden goedkoop.

          Gebruik de basisvoorraad dus niet voor jezelf. Moet het echt:

          * Vul aan wat je gebruikt, stuk voor stuk.
          * Lukt dat niet, doe dan een royale bijdrage in de pot voor de basisvoorraad.

          Zie je dat iets bijna op is, schrijf het dan op het klembord dat daarvoor hangt.

          De keukencoördinator kijkt elke week de lijst en de voorraadkast na en doet boodschappen waar nodig. We doen ons best om de basisvoorraad aan te vullen voordat iets op is.

          Heb je voor een gemeenschappelijke maaltijd iets uit de basisvoorraad nodig en is het op, koop het dan zelf en lever een apart bonnetje in voor een vergoeding.

          De maaltijdcommissie beheert de lijst met de basisvoorraad.

          Al het andere kopen de hoofdkoks zelf, ook kant-en-klare saladedressings.
    shared_guidelines:
      common_house:
        name: "Richtlijnen gemeenschapshuis" # MT
        body: |- # MT
          # Richtlijnen gemeenschapshuis

          * Welkom in ons gemeenschapshuis!
          * Ons gemeenschapshuis is het hart van onze gemeenschap.
          * Onze gemeenschap is gebouwd op onderlinge relaties.
          * Elk lid heeft evenveel te zeggen over hoe we ons gemeenschapshuis gebruiken.
          * We gaan net zo respectvol met het gemeenschapshuis om als met het huis van de buren. Laat het achter zoals je het aantrof, of beter!

          Deze richtlijnen zoeken een balans tussen vrijheid, verantwoordelijkheid en veiligheid, voor mensen en voor het gebouw.

          ## Toegankelijkheid

          Om rekening te houden met gevoeligheden spreken we het volgende af:

          * *Geurvrij* is het doel in het gemeenschapshuis.
          * *Roken:* in het gemeenschapshuis wordt niet gerookt.
          * *Dieren:* het gemeenschapshuis is huisdiervrij, behalve voor hulphonden. Laat huisdieren niet onbeheerd achter op het terrein van het gemeenschapshuis.

          ## Beveiliging

          Het gemeenschapshuis gaat doordeweeks om 22:00 uur op slot en op vrijdag en zaterdag om 23:00 uur, volgens de afsluitlijst.

          ## Communicatie

          Bewoners spreken elkaar zo veel mogelijk direct aan als er iets is. Waar nodig helpt de commissie gemeenschapshuis.

          ## Onderhoud

          Meld kapotte of slecht werkende installaties of apparaten meteen bij de onderhoudscommissie, via maintenance@example.com.

          Voor gewone dingen kun je een e-mail sturen of een briefje in de onderhoudsmap leggen.

          Meld kapotte spullen bij de commissie gemeenschapshuis via commonhouse@example.com.

          ## Alcohol

          Laat geen alcohol, open of dicht, en geen medicijnen achter in het gemeenschapshuis en bewaar ze er ook niet.

          ## Geluid

          Heb je last van geluid in het gemeenschapshuis, vraag dan gerust of het wat zachter kan. Houd rekening met anderen als zij het jou vragen.

          Grote activiteiten die luider kunnen zijn dan normaal of na sluitingstijd doorgaan, worden van tevoren aan de gemeenschap gemeld.

          ## Stilte-uren

          * Doordeweeks van 22:00 tot 08:00 uur
          * In het weekend en op feestdagen van 23:00 tot 09:00 uur

          ## Voor wie het gemeenschapshuis is

          Het gemeenschapshuis is voor bewoners en de gasten die zij uitnodigen.

          * We zijn dankbaar voor de steun en gastvrijheid van de gemeenschappen om ons heen.
          * We heten onze buren welkom en verwachten dat we eventuele problemen eerlijk oplossen, op basis van wederkerigheid en vertrouwen.

          Leden van naburige gemeenschappen zijn welkom in het gemeenschapshuis en volgen dezelfde regels voor het reserveren van ruimtes. Alle anderen moeten te gast zijn bij een volwassen bewoner, die verantwoordelijk is voor het gedrag van de gasten.

          ## Ruimtes reserveren

          Activiteiten van de gemeenschap komen in de agenda en hebben voorrang op andere afspraken.

          Alle richtlijnen worden bij consensus vastgesteld. Iedereens inbreng is welkom terwijl we ze verder verbeteren.
