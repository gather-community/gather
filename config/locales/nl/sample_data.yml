        title: "Spliterwtensoep met kerrie en broodjes" # MT
        entrees: "Spliterwtensoep met kerrie, kippenbouillon, ham en melk, en een veganistische versie met groentebouillon en kokosmelk" # MT
        side: "Broodjes tonijnsalade en eiersalade, of neem je eigen beleg mee" # MT
