        dessert: "Zelfgebakken chocoladekoekjes, en fruit" # MT
        notes: "De soep is glutenvrij, en de groentesoep is ook zonder melk. Wil je glutenvrij brood of iets anders aangepast, mail me dan voor donderdag." # MT
