          Dit is een voorbeeld van een wikipagina.

          Klik hierboven op **Bewerken** om te zien hoe deze pagina werkt! En maak je geen zorgen, je kunt niets kapotmaken!

          ## Opmaak

          Om een wikipagina te bewerken, gebruik je **Markdown**, een eenvoudige manier om nette, mooie inhoud te maken zonder dat je een speciale taal hoeft te leren. Meer over Markdown lees je in de [opmaakhandleiding voor Markdown](/about/markdown).

          ## Links

          Links naar andere pagina’s zijn heel belangrijk! Je kunt zo naar andere **wikipagina’s** linken: [[Leuke pagina]].

          De link hierboven is (waarschijnlijk) rood. Dat komt doordat de pagina nog niet bestaat. Als je op de link klikt, kun je de pagina aanmaken. Daarna wordt de link blauw!

          Wil je iets anders dan de titel van de pagina als linktekst gebruiken, dan kun je [[Leuke pagina|dit doen]].

          Links naar externe pagina’s zien er [zo uit](http://example.com).

          Een URL als gewone tekst wordt automatisch herkend en omgezet in een link: https://gather.coop
