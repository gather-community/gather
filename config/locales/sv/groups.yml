    # Templates that Mailman fetches for list emails. $listname and similar are Mailman placeholders,
    # which must be kept as is.
    mailman:
      templates:
        footer:
          list_name: "$listname, en e-postlista för en grupp i Gather" # MT
          unsubscribe: "För att avsluta prenumerationen, gå till gruppens sida och lämna eller välj bort gruppen." # MT
        list_admin_action_post:
          body: |- # MT
            Som listadministratör ombeds du godkänna följande inlägg
            till e-postlistan:

                Lista:   $listname
                Från:    $sender_email
                Ämne:    $subject

            Meddelandet hålls kvar eftersom:

            $reasons

            När det passar dig, gå till din kontrollpanel för att godkänna
            eller avslå begäran.
