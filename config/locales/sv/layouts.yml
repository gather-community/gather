      heading: "Du har inte behörighet att se den sidan." # MT
      body: "Om du tror att det är fel, kontakta din administratör." # MT
    "404":
      title: "Sidan du letade efter finns inte (404 Not found)" # MT
      heading: "Sidan du letade efter finns inte." # MT
      body: "Du kan ha skrivit fel adress, eller så har sidan flyttats. Om du driver applikationen finns mer information i loggarna." # MT
    "406-unsupported-browser":
