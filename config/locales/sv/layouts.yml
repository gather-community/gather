      skip_to_content: "Hoppa till innehållet" # MT
      show_menu: "Visa meny" # MT
      toggle_navigation: "Visa/dölj navigering" # MT
      loading: "Laddar" # MT
      add_to_home_screen: "Lägg till Gather på hemskärmen" # MT
    footer:
      privacy_policy: "Integritetspolicy" # MT
      credits: "Tack till" # MT
      settings: "Inställningar" # MT
