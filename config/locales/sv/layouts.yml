      logo_alt: "Gathers logotyp" # MT
      sign_in_google: "Logga in med Google" # MT
      sign_in_password: "Logga in med lösenord" # MT
      learn_more: "Läs mer" # MT
      try_it_out: "Prova" # MT
    signed_out:
      title: "Gather – Utloggad" # MT
      signed_out: "Du är nu utloggad från Gather." # MT
      public_computer_html: "Om det här är en <strong>offentlig dator</strong> kan du också vilja<br/>%{link}." # MT
      google_sign_out: "logga ut från ditt Google-konto" # MT
      return_home: "Tillbaka till start" # MT
    privacy_policy:
      title: "Integritetspolicy" # MT
      english_only: "Integritetspolicyn finns bara på engelska." # MT
    markdown:
      title: "Guide till Markdown-formatering" # MT
      intro_html: "<strong>Markdown</strong> är ett enkelt sätt att skapa ren och snygg text utan att behöva lära sig ett särskilt språk." # MT
      if_you_type: "Om du skriver …" # MT
      displayed_like: "Visas det så här:" # MT
      outro: "Ha nu kul och skapa massor av användbart och snyggt innehåll!" # MT
      # Each example is shown as typed and then as rendered, so it must be valid Markdown.
      examples:
        formatting: "Det är lätt att göra enkel formatering som **fet**, _kursiv_ och ~~genomstruken~~ text." # MT
        lists: |- # MT
          Du kan också göra

          * punkt-
          * listor
              * med
              * indragna
              * underlistor

          och

          1. numrerade
          2. listor
        headers: |- # MT
          # Rubriker
          ## Är
          ### Enkla

          också!
        tables: |- # MT
          | Du  | Kan    |
          |------|--------|
          | till och med göra snygga | tabeller |
          | Wow! | Vad häftigt! |
        links: |- # MT
          Länkar till andra sidor ser ut [så här](http://example.com).

          En webbadress i vanlig text känns igen automatiskt: https://gather.coop
        images: |- # MT
          Du kan visa bilder så här:

          ![Kattunge](https://gather.coop/sample-image.png)
        rule: |- # MT
          Du kan använda en horisontell linje för att dela upp innehållet:

          ---

          snyggt!
        # Not named html or *_html: Rails treats such keys as already-safe HTML, so the
        # tags in this example would render instead of being shown as typed.
        raw_markup: |- # MT
          Om du är en van användare och vill använda ren HTML, testa!

          Du kanske till exempel vill <blockquote>använda blockcitat</blockquote>.
  # Static error pages, generated into public/ by `rake error_pages:generate` (see Gather::ErrorPages).
