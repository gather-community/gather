        title: "Traditionell tysk mat" # MT
        entrees: "Bratwurst, äggnudlar och potatisgratäng" # MT
        side: "Rödkål, surkål, pepparrot och gräddfil" # MT
        kids: "Bestäms senare" # MT
        dessert: "Äppelstrudel med glass" # MT
      meal_27:
        title: "Grillkväll" # MT
        entrees: "Grillfavoriter med koreansk touch. Jag hoppas att mina assistenter har några bra idéer." # MT
        side: "Lätt sauterade grönsaker från bondens marknad eller våra odlingar" # MT
        kids: "Barnen kanske får hjälpa till i trädgården" # MT
        dessert: "Färska jordgubbar, om det är säsong" # MT
        notes: "Så ekologiskt och närproducerat som möjligt. Lätt att anpassa till alla kostbehov." # MT
      meal_28:
        title: "Hemgjord pizza!" # MT
        entrees: "Pizza med olika fyllningar: kyckling, grönsaker, ost, pepperoni. Vanlig och glutenfri botten." # MT
        side: "Sallad och frukt" # MT
        kids: "Barn gillar sånt här" # MT
        dessert: "Kanske..." # MT
        notes: "Skriv nedan om du behöver glutenfritt så att jag kan planera. Tack! Ekologiska och närproducerade råvaror när det går." # MT
      meal_29:
        title: "Tomatprovning" # MT
        entrees: "Ett urval tomater från trakten, med fågel och vegetariska alternativ" # MT
        side: "Caprese, massor av grönsaker, majskolvar" # MT
        kids: "Majs skuren från kolven för barn med tandställning" # MT
        dessert: "Tomatglass?" # MT
        notes: "Närproducerat och ekologiskt när det går. Maten kan göras allergenfri (men inte tomatfri). Det blir nötter (mandel och hasselnötter)." # MT
      meal_30:
        title: "Chili och knytkalas med äppelefterrätter!" # MT
        entrees: "Chili som jag minns den från barndomen: milda bönor och grönsaker på ris. Köttfärs för köttätare." # MT
        side: "Kokta grönsaker, beroende på vad som finns från trakten" # MT
        kids: "Huvudrätten är mild nog för alla" # MT
        dessert: "Det är vårt årliga knytkalas med äppelefterrätter! Följ med och plocka äpplen helgen innan, och ta sedan med det du gör av de underbara äpplena." # MT
        notes: "Mjölkprodukter finns vid sidan av, men huvudrätten innehåller inga. Efterrätterna görs av olika personer, så de kan innehålla vilka som helst av de vanliga allergenerna." # MT
      meal_31:
        title: "Söta och salta crêpes" # MT
        entrees: "Crêpes med massor av fyllningar, salta till middag och söta till efterrätt" # MT
        side: "Ångkokta grönsaker" # MT
        dessert: "Fler crêpes!" # MT
        notes: "Ägg från frigående höns, närproducerad mjölk, ekologiskt mjöl. Vill du ha glutenfria crêpes så säg till, så gör jag ett försök." # MT
      meal_32:
        title: "Gimbap" # MT
        entrees: "Ris, kryddade grönsaker, nötkött och ägg eller rökt lax, rullat i sjögräs" # MT
        side: "Vattenkimchi på rädisa" # MT
        kids: "Huvudrätten borde funka för dem" # MT
        dessert: "Frukt eller glass" # MT
        notes: "Vi började fermentera vattenkimchin för två veckor sedan. Det blir burkar att ta med hem efter måltiden." # MT
      meal_33:
        title: "Ärtsoppa med curry och smörgåsar" # MT
        entrees: "Currykryddad soppa på gula ärter med kycklingbuljong, skinka och mjölk, och en vegansk variant med grönsaksbuljong och kokosmjölk" # MT
        side: "Smörgåsar med tonfisksallad och äggsallad, eller ta med eget pålägg till brödet" # MT
        kids: "Samma. Mejla mig före torsdag om dina barn vill ha soppa utan curry." # MT
        dessert: "Hembakade kakor med chokladbitar, och frukt" # MT
        notes: "Soppan är glutenfri, och grönsakssoppan är mjölkfri också. Vill du ha glutenfritt bröd eller andra ändringar, mejla mig före torsdag." # MT
      meal_34:
        title: "Crêpes och goda saker att fylla dem med" # MT
        entrees: "Crêpes (ägg, mjöl, mjölk). Egentligen mest som vanliga svenska pannkakor: tunna och mjuka." # MT
        side: "Söta och salta fyllningar: socker, hemkokt jordgubbs- och blåbärssylt, saltkolasås, vispgrädde, ost och antagligen stekt svamp. Ta med eget om du vill ha något särskilt." # MT
        kids: "Samma" # MT
        dessert: "Samma" # MT
        notes: "Antagligen inte allt ekologiskt, men jag gör mitt bästa inom budgeten." # MT
      meal_35:
        title: "Köttfärslimpa" # MT
        entrees: "Köttfärslimpa" # MT
        side: "Sallad, scones, potatis" # MT
        dessert: "Äppelsmulpaj" # MT
      meal_36:
        title: "Bibimbap" # MT
        entrees: "Ångkokt ris toppat med kryddade grönsaker och nötkött (eller tofu), med stark chilisås (och soja om du inte gillar starkt), och stekta ägg" # MT
        side: "Inlagda grönsaker och kimchi" # MT
        kids: "De kan få mer nötkött eller tofu än grönsaker" # MT
        dessert: "Frukt" # MT
        notes: "Allt är kryddat med glutenfri soja, vitlök, sesamolja och svartpeppar. Det här är mest grönsaker, så räkna inte med så mycket kött." # MT
      meal_37:
        title: "Kalkontacos" # MT
        entrees: "Tacos med kalkonfärs" # MT
        side: "Bönröra, ris" # MT
        notes: "Tomat, sallad, mild salsa och gräddfil till tacosen." # MT
      meal_38:
        title: "Frukostpizza" # MT
        entrees: "Världens bästa pizzabotten, gjord på bara några få ingredienser, mest kassava. Till och med de mest kräsna älskar den. Med en pestoliknande sås och valfritt kött, grönsaker och ostar. Skriv eventuella kostbehov." # MT
        side: "Äggröra" # MT
      meal_39:
        title: "Soppbuffé!" # MT
        entrees: "En enkel köttsoppa och en enkel grönsakssoppa, plus massor av tillbehör så att du kan skapa din egen variant: frön, grönsaker, glutenfri pasta, ost..." # MT
        side: "Grönsaker, ost, pasta" # MT
        kids: "Barnen kommer att tycka att det är kul att göra sin egen" # MT
        dessert: "Kanske något med frukt" # MT
        notes: "Så närproducerat och ekologiskt som möjligt." # MT
      meal_40:
        title: "Lax en papillote" # MT
        entrees: "Lax bakad i bakplåtspapper, kryddad med lök och örter" # MT
        side: "Bladgrönt (spenat eller grönkål) eller haricots verts sauterade med vitlök, ugnsrostad färskpotatis och nybakat bröd" # MT
        kids: "Skriv en kommentar om dina barn inte äter lax och föreslå något annat, som tonfisksallad eller hårdkokta ägg." # MT
        dessert: "Ja: frukt och något bakat" # MT
        notes: "Allt är glutenfritt utom den bakade efterrätten. Grönsakerna blir mest ekologiska. Säg till om du behöver ett vegetariskt alternativ; jag kan woka eller ugnsbaka lite tofu." # MT
