sv:
  # Demo content for communities created with sample data (Utils::Generators), written in the community's
  # language like the starter content (starter_content.yml). The rows in lib/random_data/data hold everything
  # that isn't text, and name their text here by `key`.
  #
  # Calendar names (with the starter content's) can be at most 24 characters and must all differ, and
  # calendar abbreviations at most 6. Event names can be at most 24 characters.
  sample_data:
    calendars:
      media_room:
        name: "Medierum" # MT
        guidelines: |- # MT
          # Riktlinjer för medierummet

          1. Barn under 13 år måste ha sällskap av en vuxen.
          1. Program med åldersgräns 15 år och uppåt är spärrade både på tv:n och på tv-boxen.
          1. Rummet kan bokas för särskilda evenemang eller tv-program. Se kalendern eller kontakta media@example.com.
          1. Fjärrkontrollerna ska alltid stanna i rummet, på sin bestämda plats.
          1. Plocka undan i medierummet och ställ tillbaka allt i ”grundläge” när du har använt det. Se upp med smulor.
      multipurpose_room:
        name: "Allaktivitetsrum" # MT
        guidelines: |- # MT
          # Riktlinjer för allaktivitetsrummet

          1. Som det står i riktlinjerna för händelser måste alla gäster ha en vuxen medlem i gemenskapen som värd.
          1. Tänk på att det här rummet, precis som resten av gemensamhetshuset, är en gemensam resurs.
          1. Värden skriver gästens namn och vistelsedatum på whiteboarden utanför dörren.
          1. Alla gäster följer de allmänna riktlinjerna för gemensamhetshuset (uppsatta på dörren) och riktlinjerna för varje rum de använder. Var särskilt uppmärksam på riktlinjerna om ljud, tysta timmar och vår doftfria policy.
          1. Inga levande ljus eller annat som kan orsaka brand eller annan fara. Ingen rökning i gemensamhetshuset.
          1. Rummet används till annat också, men övernattande gäster går före. Lös krockar i bokningen direkt med varandra.
          1. Gäster får stanna i upp till 7 dagar, så länge ingen annan boende har bokat rummet för en annan gäst.
          1. Värden ansvarar för sina gäster. När gästerna har åkt städar värden rummet, tvättar lakan och sängkläder och lämnar tillbaka dem till gemensamhetshuset.
          1. Utcheckning senast kl. 12:00.
          1. Nycklarna lämnas på en bestämd plats i gemensamhetshuset. Om nycklarna kommer bort får värden betala för nya.
          1. Gäster får använda skylten ”Stör ej” som finns i rummet, för att få vara ifred.
      office:
        name: "Kontor" # MT
      sitting_room:
        name: "Sällskapsrum" # MT
      dining_room:
        name: "Matsal" # MT
        abbrv: "GH" # MT
      courtyard:
        name: "Gården" # MT
        abbrv: "Gård" # MT
      kitchen:
        name: "Kök" # MT
        abbrv: "GH" # MT
        guidelines: |- # MT
          # Riktlinjer för köket

          ## Översikt

          Köket i gemensamhetshuset är en stor investering för vår gemenskap, och det kan också vara en farlig plats. Eftersom det viktigaste för oss är att alla i gemenskapen, och vår utrustning, är säkra har vi följande riktlinjer.

          Vi förväntar oss att alla medlemmar och deras gäster behandlar utrustningen och lokalen varsamt och med respekt.

          Föräldrar ansvarar för att lära sina barn att:

          * Köket är ingen lekplats.
          * Maten i köket är inte till för vem som helst att äta, om det inte står så på den.
          * Barn får bara vara i köket om de är inbjudna och har en ansvarig vuxen med sig.

          *Lämna köket renare än du hittade det.*

          Och låt oss ha roligt och laga och äta god mat tillsammans!

          ## Säkerhet

          * Om du lämnar köket medan något står i ugnen eller på spisen, varna andra genom att spärra av ingångarna till köket och lämna en lapp.
          * Ställ kastruller med varm mat på de bakre plattorna, inte de främre.
          * Flytta inte bikarbonatet från spisen. Det står där ifall det börjar brinna.
          * Lämna aldrig vassa knivar obevakade och lägg dem inte i diskvattnet.

          Om du måste gå innan du har städat klart, lämna en lapp om när du kommer tillbaka, med ditt telefonnummer.

          Skriv upp allt du lånar och lämna tillbaka det så snart du kan.

          Rapportera allt som verkar konstigt, som märkliga ljud, lukter eller trasiga saker, till den som ansvarar för reparationer.

          Kylskåpet i gemensamhetshuset är till för baslivsmedel och gemensamma måltider. Dela hellre ut rester än förvarar dem här.

          Vad huvudkockar, kockassistenter och städare ska göra beskrivs separat.

          ## Grundläggande hygien

          1. Om du kan vara sjuk, håll gemenskapen frisk genom att gå hem.
          1. Tvätta händerna ofta, på gammaldags vis: med tvål och varmt vatten.
          1. Täck alla sår ordentligt.
          1. Använd varje sked bara en gång när du smakar av.
          1. Undvik korskontaminering (allergener och bakterier) genom att använda olika redskap till olika livsmedel.
          1. Allt som har kommit i kontakt med rått kött måste diskas och desinficeras innan det används till något annat.
          1. Använd skärbräda i rätt färg för varje sorts livsmedel.
          1. Diskhoar kan hysa bakterier, så använd ett durkslag när du sköljer grönsaker och frukt som ska serveras råa.
          1. Maten är säker när den är ordentligt nedkyld eller ordentligt genomvarm.

          ## Baslivsmedel

          Baslivsmedel köps in till måltiderna i gemensamhetshuset.

          När vi köper baslivsmedel tänker vi på om de är ekologiska, rättvisemärkta och GMO-fria, och på kostpreferenser, hållbarhet och pris.

          Baslivsmedlen betalas med en extra avgift på måltiderna i gemensamhetshuset, som används till att fylla på förrådet. Huvudkockarna förväntas använda baslivsmedlen, så att förrådet hålls färskt och kostnaden för deras måltider hålls nere.

          Använd alltså inte baslivsmedlen privat. Om du verkligen måste:

          * Ersätt det du använder, vara för vara.
          * Om du inte kan det, bidra generöst till kökets kassa för baslivsmedel.

          Om du märker att något börjar ta slut, skriv upp det på listan på skrivplattan som finns för det.

          Köksansvarig går igenom listan och skafferiet varje vecka och handlar vid behov. Vi gör vårt bästa för att fylla på baslivsmedel när de tar slut.

          Om du behöver ett baslivsmedel för att laga en gemensam måltid och det saknas, köp det och lämna in ett separat kvitto för ersättning.

          Matgruppen har hand om listan över baslivsmedel.

          Huvudkockarna köper allt annat, även färdiga salladsdressingar.
    shared_guidelines:
      common_house:
        name: "Riktlinjer för gemensamhetshuset" # MT
        body: |- # MT
          # Riktlinjer för gemensamhetshuset

          * Välkommen till vårt gemensamhetshus!
          * Vårt gemensamhetshus är hjärtat i vår gemenskap.
          * Relationer är det som vår gemenskap bygger på.
          * Alla medlemmar har lika mycket att säga till om när det gäller hur vi använder gemensamhetshuset.
          * Vi behandlar gemensamhetshuset med samma respekt som en grannes hus. Lämna det som du hittade det, eller bättre!

          De här riktlinjerna väger frihet, ansvar och säkerhet för människor och byggnad mot varandra.

          ## Tillgänglighet

          För att ta hänsyn till känsligheter är vi överens om följande:

          * *Doftfritt* är målet i gemensamhetshuset.
          * *Rökning:* det är rökfritt i gemensamhetshuset.
          * *Djur:* gemensamhetshuset är fritt från husdjur, utom assistanshundar. Husdjur får inte lämnas ensamma på gemensamhetshusets tomt.

          ## Säkerhet

          Gemensamhetshuset låses senast kl. 22:00 på vardagar och senast kl. 23:00 på fredagar och lördagar, enligt checklistan för stängning.

          ## Kommunikation

          De boende tar upp problem direkt med varandra när det går. Vid behov finns gruppen för gemensamhetshuset till hands och hjälper till.

          ## Underhåll

          Rapportera trasiga eller felaktiga system och apparater till underhållsgruppen direkt, på maintenance@example.com.

          För vardagliga saker, skicka ett mejl eller lägg en lapp i underhållsmappen.

          Rapportera trasiga saker till gruppen för gemensamhetshuset på commonhouse@example.com.

          ## Alkohol

          Lämna eller förvara inte alkohol, öppnad eller oöppnad, eller några läkemedel i gemensamhetshuset.

          ## Ljud

          Alla som störs av ljud i gemensamhetshuset får gärna be om att det sänks. Visa hänsyn när någon ber dig om det.

          Gemenskapen får veta i förväg om större evenemang som kan bli högljuddare än vanligt eller hålla på efter stängningsdags.

          ## Tysta timmar

          * Vardagar, kl. 22:00–08:00
          * Helger och helgdagar, kl. 23:00–09:00

          ## Vem gemensamhetshuset är till för

          Gemensamhetshuset är till för de boende och deras inbjudna gäster.

          * Vi är tacksamma för stödet och gästfriheten från gemenskaperna i grannskapet.
          * När vi välkomnar våra grannar räknar vi med att lösa eventuella problem på ett rättvist sätt, med ömsesidighet och tillit som grund.

          Medlemmar i gemenskaper i grannskapet är välkomna i gemensamhetshuset och följer samma rutiner för att boka rum. Alla andra måste ha en vuxen boende som värd, som ansvarar för sina gästers uppförande.

          ## Boka rum

          Gemenskapens aktiviteter läggs in i kalendern och går före andra händelser.

          Alla riktlinjer beslutas i konsensus. Allas synpunkter är välkomna medan vi fortsätter att förbättra dem.
