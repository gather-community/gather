    # literal query syntax; descriptions that mention an example take it as an interpolation.
    search_tips_modal:
      title: "Söktips" # MT
      intro: "Skriv ord för att söka i Gather (wikisidor, händelser, personer, måltider med mera) och Google Drive." # MT
