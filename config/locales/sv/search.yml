      both_words: "Objekt som innehåller båda orden" # MT
      word_start: "Ord som börjar med ”%{start}”" # MT
      word_start_drive: "Ord som börjar med ”%{start}”. I Google Drive matchar detta bara början av filnamn, inte filinnehåll." # MT
      exact_phrase: "Den exakta frasen ”%{phrase}”" # MT
      special_syntax: "Särskild syntax" # MT
      title_only: "Sök bara i fältet för titel eller namn" # MT
      # %{options} is a comma-separated list of file type codes, e.g. doc, sheet.
      drive_type_html: "Filtrera resultat från Drive efter filtyp. Alternativ: %{options}" # MT
      combining: "Kombinera" # MT
      title_and_word: "Objekt med namnet ”%{title}” som innehåller ”%{word}”" # MT
      sheet_and_phrase: "Google Kalkylark som matchar frasen ”%{phrase}”" # MT
