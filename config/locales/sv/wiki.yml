          Det här är en exempelsida i wikin.

          Klicka på **Redigera** ovan för att se hur sidan fungerar! Oroa dig inte, du kan inte förstöra något!

          ## Formatering

          Wikisidor redigeras med **Markdown**, ett enkelt sätt att skapa ren och snygg text utan att behöva lära sig ett särskilt språk. Läs mer om Markdown i [guiden till Markdown-formatering](/about/markdown).

          ## Länkar

          Länkar till andra sidor är väldigt viktiga! Du kan länka till andra **wikisidor** så här: [[Rolig sida]].

          Länken ovan är (förmodligen) röd. Det beror på att sidan inte finns ännu. Om du klickar på länken kan du skapa sidan. Då blir länken blå!

          Om du vill att länktexten ska vara något annat än sidans titel kan du [[Rolig sida|göra så här]].

          Länkar till externa sidor ser ut [så här](http://example.com).

          En webbadress i vanlig text känns igen och blir automatiskt en länk: https://gather.coop
