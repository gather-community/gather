hcaptcha:
  # Test credentials that always pass: https://docs.hcaptcha.com/#integration-testing-test-keys
  site_key: "10000000-ffff-ffff-ffff-000000000001"
  secret_key: "0x0000000000000000000000000000000000000000"

meals:
  close_cutoff_age: 2 # hours
reminders:
  time_of_day: 6 # 6:00am
photos:
  max_size_mb: 8
work:
  min_age: 5

###########################################################################
# These settings are for development/testing only, should be overridden in
# production.
single_sign_on:
  # Not a real secret, ok to check in
  secret: ssosecret
mailman:
  api:
    # No trailing slash, no API version. API version gets appended to this.
    base_url: http://localhost:8001
    port: 8001
    username: restadmin
    # Not a real secret, ok to check in
    password: restpass
  single_sign_on:
    init_url: http://localhost:8000/sso/init
    update_url: http://localhost:8000/sso/update
    sign_out_url: http://localhost:8000/sso/logout
# These options are passed directly to the Elasticsearch::Client initializer.
# See https://github.com/elastic/elasticsearch-ruby/tree/master/elasticsearch-transport for details.
# The default settings should work in most cases.
elasticsearch:
  host: 127.0.0.1 # This IP is ignored by VCR, but localhost isn't.
  port: 9200
redis:
  url: redis://localhost:6379/0
s3:
  access_key_id: key
  secret_access_key: secret
  region: region
  bucket: gather
  endpoint: https://region.digitaloceanspaces.com

# These are test-mode settings and should be overridden in production.yml
stripe:
  # This is a junk value and should be overridden in production (with real key) and dev/test (with test mode key)
  api_key: sk_test_xxx
  publishable_key: pk_test_xxx
  billing_portal_url: https://billing.stripe.com/p/login/test_xxx
  # Used to verify incoming webhook signatures. Override per environment.
  webhook_signing_secret: whsec_test_xxx
  messaging:
    # The Stripe product whose purchase tops up a messaging account. Override per environment.
    topup_product_id: prod_test_messaging_topup

# External data sources for the self-serve subscription price calculator. Fetched nightly by
# Subscription::RefreshPricingDataJob and cached in the DB.
pricing:
  exchange_rate:
    # open.er-api.com is free and needs no key. Swap base_url/api_key for a paid provider.
    base_url: https://open.er-api.com/v6/latest
    api_key: ~
  cpi:
    # US BLS public data API (v2 is a POST endpoint). series_id CUUR0000SA0 = CPI-U, US city
    # average, all items (NSA). api_key is a free BLS registration key required by v2; set it via
    # SETTINGS__PRICING__CPI__API_KEY in prod.
    base_url: https://api.bls.gov/publicAPI/v2/timeseries/data/
    series_id: CUUR0000SA0
    api_key: ~

# Messaging (outbound SMS) settings. Per-segment prices are NOT here — they're hardcoded, per
# country, in Messaging::Providers::* (Twilio/Telnyx expose no usable pricing API). This holds
# only the tuning knob.
messaging:
  # Multiplier applied to our all-in provider cost per segment to get the price we charge
  # communities. 0.2 = a 20% markup. Applied to the all-in cost (base price plus, in the US/CA,
  # the worst-case carrier fee), not a headline rate. Only ~5% of it is cost recovery (Stripe's
  # ~2.9% on top-ups, plus failed messages we're still billed for); the rest is margin. Fixed
  # costs (number rental, A2P 10DLC registration) are NOT amortized here — they're debited to
  # the account separately. See Messaging::CostCalculator.
  markup: 0.2

# Twilio and Telnyx credentials, for SENDING SMS (pricing is hardcoded, so these aren't needed
# to quote a cost). Deliberately blank here; set per environment (config/settings.local.yml in
# dev, SETTINGS__*__ in production).
#
# Twilio uses an API key, not the account auth token: a key is scoped and revocable on its own,
# whereas leaking the auth token means rotating account-wide credentials. `sid` is the key SID
# (SK...) and doubles as the HTTP Basic username; `account_sid` (AC...) identifies the account
# and is embedded in the path of account-scoped endpoints like message sending.
twilio:
  sid:
  client_secret:
  account_sid:

# Telnyx uses a bearer API key (it has no scoped-key model — a leaked key is full account
# access, so guard it accordingly).
telnyx:
  api_key:
