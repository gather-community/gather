# PostgreSQL database configuration
# Generated by bin/setup - safe to customize
#
# Connection settings are managed in the 'default' block.
# Use bin/setup to reconfigure, or edit values directly.

default: &default
  adapter: postgresql
  pool: 5
  timeout: 5000
  host:
  port: 5432
  # username:
  # password:

development:
  <<: *default
  database: gather_development

test:
  <<: *default
  database: gather_test

production:
  <<: *default
  database: gather_production
