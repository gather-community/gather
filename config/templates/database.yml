# PostgreSQL database configuration
# Generated by bin/setup - safe to customize

default: &default
  adapter: postgresql
  pool: 5
  timeout: 5000
  host: postgres
  port: 5432
  username: gather
  password: gather

development:
  <<: *default
  database: gather_development

test:
  <<: *default
  database: gather_test

production:
  <<: *default
  database: gather_production
