# Docker Compose configuration for Gather development
# Generated by bin/setup - safe to customize
#
# Services are added/removed based on your configuration choices.
# Use bin/setup to reconfigure, or edit directly.
#
# Start services:  docker compose up -d
# Stop services:   docker compose down
# View logs:       docker compose logs -f

services:
  # Mailcatcher - catches all outgoing email
  # Web UI: http://localhost:1080
  # SMTP:   localhost:1025
  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - gather-network

volumes: {}

networks:
  gather-network:
    external: true
