# Local development settings
# Generated by bin/setup - safe to customize

# Google OAuth credentials
# Create at: https://console.cloud.google.com/apis/credentials
oauth:
  google:
    client_id:
    client_secret:

# Active Record Encryption keys (generate with: bin/rails db:encryption:init)
active_record_encryption:
  primary_key:
  deterministic_key:
  key_derivation_salt:

# Rails secret key base (auto-generated by bin/setup)
secret_key_base:

# Email settings
email:
  from: Gather <noreply@example.coop>
  webmaster: developer@example.com

# Elasticsearch connection
elasticsearch:
  host: elasticsearch
  port: 9200

# Redis connection
redis:
  url: redis://redis:6379/0

# Mailman API connection (uses Docker service name, same as elasticsearch/redis above)
mailman:
  api:
    base_url: http://mailman-core:8001

# Stripe (test mode) — only needed for local subscription + messaging-topup testing.
# Leave blank otherwise; the junk defaults in config/settings.yml keep the app booting.
# Restart the server after changing these (topup_product_id is read once at boot).
stripe:
  api_key:                 # sk_test_... (Stripe test secret key)
  publishable_key:         # pk_test_... (test publishable key, for the base-sub payment form)
  webhook_signing_secret:  # whsec_... (printed by `stripe listen`)
  messaging:
    topup_product_id:      # prod_... (a product created in Stripe TEST mode; topup prices live under it)
