services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather
      POSTGRES_DB: gather_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gather-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gather-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms200m -Xmx200m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - gather-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - gather-network

  # Headless Chrome for system specs (js: true). Works on both amd64 and arm64.
  # Set SELENIUM_REMOTE_URL=http://localhost:4444/wd/hub when running system specs locally.
  selenium-chrome:
    image: seleniarm/standalone-chromium:latest
    ports:
      - "4444:4444"
      - "5900:5900"
    shm_size: 2g
    networks:
      - gather-network

  mailman-core:
    image: maxking/mailman-core:0.4
    platform: linux/amd64
    ports:
      - "8001:8001"
    volumes:
      - mailman_core_data:/opt/mailman
    environment:
      - HYPERKITTY_API_KEY=hyperkittyapikey
      - MTA=null
      - MAILMAN_REST_API_PASS=restpass
      - MAILMAN_REST_USER=restadmin
    networks:
      - gather-network

  mailman-web:
    image: maxking/mailman-web:0.4
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - mailman_web_data:/opt/mailman-web-data
      - ./docker/mailman-web-uwsgi.ini:/opt/mailman-web/uwsgi.ini
      - ./docker/mailman-web-settings-local.py:/opt/mailman-web-data/settings_local.py
    environment:
      - HYPERKITTY_API_KEY=hyperkittyapikey
      - DATABASE_TYPE=sqlite
      - DATABASE_URL=sqlite:////opt/mailman-web-data/mailmanweb.db
      - MAILMAN_ADMIN_USER=admin
      - MAILMAN_ADMIN_EMAIL=admin@example.com
      - SECRET_KEY=django-insecure-gatherdevelopment
      - SERVE_FROM_DOMAIN=localhost
      - MAILMAN_REST_API_URL=http://mailman-core:8001
      - MAILMAN_REST_API_USER=restadmin
      - MAILMAN_REST_API_PASS=restpass
      # gethostbyname() is evaluated eagerly at import time; use localhost to avoid needing mailman-core up first
      - MAILMAN_HOSTNAME=localhost
    depends_on:
      - mailman-core
    networks:
      - gather-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  mailman_core_data:
  mailman_web_data:

networks:
  gather-network:
    external: true
