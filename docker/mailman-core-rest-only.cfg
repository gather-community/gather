# Dev-only Mailman config. When MAILMAN_REST_ONLY is true (the default), docker-compose.yml copies this
# to /opt/mailman/mailman-extra.cfg, which the mailman-core image appends to /etc/mailman.cfg at startup.
#
# Gather only talks to Mailman's REST API (creating lists, syncing members and settings), so in dev
# we run just the `rest` runner and turn off the mail-handling runners. Each runner is a separate
# Python process under x86 emulation, using about 65 MB, so this saves about 750 MB per dev env.
#
# With these off, mail Mailman generates (welcome notices, list posts) sits in its queue folders.
# Nothing is lost: there's no mail server behind dev Mailman (MTA=null), so it was never delivered.
#
# To run all the runners (e.g. to test list mail end to end):
#   MAILMAN_REST_ONLY=false docker compose up -d --force-recreate mailman-core
# and run the same command without MAILMAN_REST_ONLY=false to go back.

[webservice]
workers: 1

[runner.in]
start: no

[runner.out]
start: no

[runner.lmtp]
start: no

[runner.pipeline]
start: no

[runner.virgin]
start: no

[runner.archive]
start: no

[runner.digest]
start: no

[runner.bounces]
start: no

[runner.command]
start: no

[runner.retry]
start: no

[runner.task]
start: no

[runner.nntp]
start: no
